    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

    // its (possibly foreign) parent.

    const resourceBlobs = {};

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ry-companies';\nconst fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\nconst TODAY = () => fmt(new Date());\nconst daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);\nconst shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst DEF = { xp: 0, days: [], cards: {}, mcq: {}, open: {}, calc: {}, listened: {}, wrong: {}, badges: {}, ai: {}, aiOpen: {}, aiCalc: {}, best: 0, rounds: 0, tlPerfect: 0, slides: { done: false, checked: '' }, lang: 'it' };\nconst RANKS = [['Boutique', 'Boutique'], ['Atelier', 'Atelier'], ['Maison', 'Maison'], ['Gruppo', 'Group'], ['Conglomerato', 'Conglomerate'], ['Polo del lusso', 'Luxury powerhouse'], ['Icona globale', 'Global icon']];\nconst BADGES = [\n  ['first', 'I', ['Prima acquisizione', 'First acquisition'], ['Prima risposta corretta', 'First correct answer']],\n  ['q25', '25', ['Due diligence', 'Due diligence'], ['25 domande diverse giuste', '25 different questions right']],\n  ['s3', '3g', ['Continuità', 'Continuity'], ['Serie di 3 giorni', '3-day streak']],\n  ['s7', '7g', ['Heritage', 'Heritage'], ['Serie di 7 giorni', '7-day streak']],\n  ['v500', '500', ['€ 500 M', '€500M'], ['Valore del gruppo a 500 M', 'Group value at €500M']],\n  ['v2000', '2B', ['€ 2 miliardi', '€2 billion'], ['Valore del gruppo a 2.000 M', 'Group value at €2,000M']],\n  ['icon', '★', ['Prima icona', 'First icon'], ['Un’unità all’80%', 'One unit at 80%']],\n  ['listen', 'Au', ['In ascolto', 'Listening'], ['Ascolta 3 riassunti', 'Listen to 3 summaries']],\n  ['analyst', '8+', ['Analista', 'Analyst'], ['Risposta aperta da 8/10', 'Open answer scoring 8/10']],\n  ['speed', '10', ['Time to market', 'Time to market'], ['10 punti in una sfida', '10 points in a challenge']],\n  ['chron', '3×', ['Cronista', 'Chronicler'], ['3 cronologie perfette', '3 perfect t n  en: { tagline: 'Your luxury group', groupValue: 'Group value', days: 'days', navHome: 'The group', navUnit: 'Maison', navCards: 'Cards', navQuiz: 'Quiz', navOpen: 'Open & cases', navListen: 'Audio', navMap: 'Map', navTimeline: 'Timeline', navCalc: 'Calculations', navMatch: 'Who’s who', navChallenge: 'Challenge', navReview: 'Review', navPortfolio: 'Portfolio',\n    examText: 'Exam (non-attending): final written exam, 100%, no oral. Open and closed questions, cases and possible calculations on the whole syllabus: textbook, articles, cases, videos and slides.',\n    slidesKicker: 'Lecture slides · Blackboard 20671', slChecked: 'Checked today', slDone: 'I uploaded them', slUndo: 'Not uploaded yet',\n    summary: 'Summary', again: 'Review again', know: 'I know it', readAloud: 'Read aloud', cardKeys: 'Space flips · ← again · → know', again2: 'Start over',\n    openPh: 'Answer as in the exam: thesis, concepts, examples from the cases…', keyPoints: 'Expected points', covered: 'Covered', missing: 'Missing or to refine', model: 'Model answer',\n    stop: 'Stop', speed: 'Speed', newRound: 'New round', roundDone: 'Round complete · +€30M', go: 'Go',\n    tlPool: 'Events to order', tlLine: 'Your timeline (oldest first)', tlAllPlaced: 'All placed: check it.', tlCheck: 'Check the order',\n    verify: 'Check', hint: 'Hint', nextProblem: 'Next problem',\n    notReadyTitle: 'Unit in preparation', notReadyText: 'Curated cards, audio, map, timeline and calculations for this unit are coming in the next updates. Meanwhile quiz and open questions work with AI on the source text.',\n    missingText: 'The material for these chapters hasn’t been uploaded yet. Download them from ProQuest (Ebook Central) and send them to Claude to add them.',\n    mastery: 'Status of each unit', all: 'All ready units' }\n};\nconst SINGLE = ['unit', 'cards', 'open', 'listen', 'map'];\nconst MULTI = ['quiz', 'match', 'challenge', 'timeline', 'calc'];\nconst CURATED = ['cards', 'listen', 'map'];\n\nclass Component extends DCLogic {\n  state = { view: 'home', ch: 'r1', p: this.load(), cd: { i: 0, flip: false }, quiz: null, gen: {}, op: this.op0(), caseGen: {}, ls: { playing: false, idx: -1, rate: 1 }, mp: { test: false, open: {} }, mt: null, tl: null, cc: { i: 0, val: '', done: null, hint: false }, calcGen: {}, chl: { state: 'idle', left: 0, score: 0, item: null, flash: '' }, toast: '' };\n  op0() { return { i: 0, text: '', busy: false, res: null, err: '', keys: false }; }\n  load() { try { const p = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}')); p.slides = Object.assign({ done: false, checked: '' }, p.slides); return p; } catch (e) { return Object.assign({}, DEF); } }\n  save(p) {\n    p.livello = this.levelOf(p.xp); p.rango = RANKS[Math.min(p.livello - 1, RANKS.length - 1)][0]; p.serie = this.streakOf(p);\n    p.badgeTot = Object.keys(p.badges).length; p.padronanza = this.avgMastery(p); p.aggiornato = new Date().toISOString();\n    try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {}\n    this.push(p);\n  }\n  componentDidMount() {\n    const add = src => new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = r; s.onerror = r; document.head.appendChild(s); });\n    add('lux-data/index.js').then(() => Promise.all((window.LUX_INDEX || []).filter(c => c.ready).map(c => add('lux-data/' + c.id + '.js')))).then(() => this.setState({ loaded: true }));\n    this._key = e => this.onKey(e); window.addEventListener('keydown', this._key);\n    const h = (location.hash || '').slice(1);\n    if (['review', 'quiz', 'challenge', 'portfolio', 'match', 'timeline', 'calc'].includes(h)) setTimeout(() => this.go(h, MULTI.includes(h) ? 'all' : undefined), 300);\n    (window.claude ? Promise.resolve() : add('/shim.js')).then(() => this.syncInit());\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._key); clearInterval(this._timer); try { speechSynthesis.cancel(); } catch (e) {} }\n  async syncInit() {\n    try {\n      const c = window.claude; if (!c || typeof c.use !== 'function') return;\n      const [db, u] = await Promise.all([c.use('db'), c.use('user')]); if (!db || !u) return;\n      const id = await u.id(); if (!id) return;\n      this._ref = db.collection('data/users/' + id).doc(KEY);\n      const sn = await this._ref.get(); const r = sn.exists ? sn.data() : null;\n      if (r && (r.aggiornato || '') > (this.state.p.aggiornato || '')) { const p = Object.assign({}, DEF, r); try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {} this.setState({ p }); }\n      else this.push(this.state.p);\n    } catch (e) {}\n  }\n  push(p) { if (!this._ref) return; clearTimeout(this._st); this._st = setTimeout(() => { this._ref.set(JSON.parse(JSON.stringify(p))).catch(() => {}); }, 1200); }\n\n  get L() { return this.state.p.lang === 'en' ? 1 : 0; }\n  tr(pair) { return pair ? (Array.isArray(pair) ? (pair[this.L] || pair[0]) : pair) : ''; }\n  idx() { return window.LUX_INDEX || []; }\n  data(id) { return (window.LUX || {})[id]; }\n  unit(id) { return this.idx().find(x => x.id === id); }\n  readyIds() { return this.idx().filter(c => c.ready).map(c => c.id); }\n  levelOf(xp) { return Math.floor(Math.sqrt(xp / 60)) + 1; }\n  lvlXp(l) { return 60 * (l - 1) * (l - 1); }\n  rankOf(l) { return this.tr(RANKS[Math.min(l - 1, RANKS.length - 1)]); }\n  streakOf(p) { const set = new Set(p.days); const d = new Date(); if (!set.has(fmt(d))) d.setDate(d.getDate() - 1); let s = 0; while (set.has(fmt(d))) { s++; d.setDate(d.getDate() - 1); } return s; }\n  mastery(p, id) {\n    const d = this.data(id);\n    if (!d) { const ai = p.ai[id] || []; if (!ai.length) return 0; return Math.round(100 * ai.filter((m, i) => p.mcq[id + ':a' + i]).length / Math.max(ai.length, 20)); }\n    const nc = (d.calc || []).length;\n    const tot = d.mcq.length + d.cards.length + d.open.length * 3 + nc * 2;\n    let got = d.mcq.filter((m, i) => p.mcq[id + ':' + i]).length + d.cards.filter((c, i) => p.cards[id + ':' + i]).length + (d.calc || []).filter((c, i) => p.calc[id + ':' + i]).length * 2;\n    d.open.forEach((o, i) => { const s = p.open[id + ':' + i] || 0; got += s >= 7 ? 3 : s >= 4 ? 1 : 0; });\n    return Math.min(100, Math.round(100 * got / tot));\n  }\n  avgMastery(p) { const ids = this.idx().filter(c => !c.missing).map(c => c.id); if (!ids.length) return 0; return Math.round(ids.reduce((a, id) => a + this.mastery(p, id), 0) / ids.length); }\n  stage(pct) { const L = this.L; return pct >= 80 ? ['Icona', 'Icon'][L] : pct >= 50 ? ['Integrata', 'Integrated'][L] : pct >= 20 ? ['Acquisita', 'Acquired'][L] : ['Due diligence', 'Due diligence'][L]; }\n\n  checkBadges(p) {\n    const has = { first: Object.keys(p.mcq).length >= 1, q25: Object.keys(p.mcq).length >= 25, s3: this.streakOf(p) >= 3, s7: this.streakOf(p) >= 7, v500: p.xp >= 500, v2000: p.xp >= 2000,\n      icon: this.idx().some(c => this.mastery(p, c.id) >= 80), listen: Object.keys(p.listened).length >= 3, analyst: Object.values(p.open).some(s => s >= 8), speed: p.best >= 10, chron: p.tlPerfect >= 3, cfo: Object.keys(p.calc).length >= 5 };\n    const nb = []; BADGES.forEach(b => { if (has[b[0]] && !p.badges[b[0]]) { p.badges[b[0]] = TODAY(); nb.push(b); } }); return nb;\n  }\n  upd(mut, xp = 0) {\n    const p = JSON.parse(JSON.stringify(this.state.p)); if (mut) mut(p);\n    if (xp > 0) { p.xp += xp; const t = TODAY(); if (!p.days.includes(t)) p.days.push(t); }\n    const nb = this.checkBadges(p); this.save(p); this.setState({ p });\n    if (nb.length) this.toast('Badge · ' + this.tr(nb[0][2])); else if (xp > 0) this.toast('+€ ' + xp + ' M');\n  }\n  toast(t) { clearTimeout(this._tt); this.setState({ toast: t }); this._tt = setTimeout(() => this.setState({ toast: '' }), 2200); }\n\n  go(view, ch) {\n    try { speechSynthesis.cancel(); } catch (e) {} clearInterval(this._timer);\n    let c = ch || this.state.ch;\n    if (SINGLE.includes(view) && c === 'all') c = this.readyIds()[0] || 'r1';\n    this.s

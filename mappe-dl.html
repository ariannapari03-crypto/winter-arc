\u002Fbutton>\n        <span style=\"margin-left:auto;font-size:12.5px;color:var(--color-neutral-700)\">frase {{ p2.audio.pos }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden\"><div style=\"height:100%;width:{{ p2.audio.pct }};background:var(--color-accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p2.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p2.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> Tre forze spingono insieme sul retail: <b>geopolitica<\u002Fb>, <b>tecnologia<\u002Fb> e <b>consumatore<\u002Fb>. Il capitolo le legge in sequenza: un mercato fragile e sfiduciato → la GDO italiana che resiste ma si polarizza → un consumatore razionale e disilluso guidato da tre bisogni (modello <b>PAD<\u002Fb>) → le tecnologie digitali che ridisegnano il retail → come cambiano i programmi fedeltà → come si <b>misura<\u002Fb> la loyalty con i KPI. La mappa è un <b>barometro a fasce<\u002Fb>: si scende dal contesto alla misurazione.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px\">\n    <div style=\"background:var(--color-accent-500);color:#fff;border-radius:18px;padding:12px 14px;font-size:13px\"><b style=\"font-size:15px\">Geopolitica<\u002Fb><br>conflitti, rallentamento Cina, energia volatile, dazi USA → produzioni che tornano vicino ai mercati<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-600);color:#fff;border-radius:18px;padding:12px 14px;font-size:13px\"><b style=\"font-size:15px\">Tecnologia<\u002Fb><br>innovazione frequente → aspettative di immediatezza e controllo<\u002Fdiv>\n    <div style=\"background:var(--color-accent-300);color:#201e1d;border-radius:18px;padding:12px 14px;font-size:13px\"><b style=\"font-size:15px\">Consumatore<\u002Fb><br>più preparato, esigente, digitale; temi sociali e ambientali cambiano il «valore»<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px;color:var(--color-neutral-300)\">Il retail non è più un «box mover» ma un <b style=\"color:#fff\">ecosistema strategico<\u002Fb> dove dati, esperienze e valori si alimentano a vicenda (p. 20).<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Fascia 1 · Un mercato fragile<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 20–22 · Fig. 2.1<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Crescita debole e fiducia bassa: il consumatore è prudente, selettivo e disilluso.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">FMI 2025: mondo +2,8%, euro +0,8%, Italia +0,4%<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fiducia ISTAT sotto 100<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">25% ottimisti<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">35% spesa prudente<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">consumatore accorto + valoriale<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Previsioni FMI (aprile 2025): mondo <b>+2,8%<\u002Fb>, area euro <b>+0,8%<\u002Fb>, Italia <b>+0,4%<\u002Fb>. La BCE conferma domanda interna debole e consumi in calo. L'indice ISTAT di fiducia dei consumatori resta <b>sotto 100<\u002Fb>, la soglia psicologica tra normalità e preoccupazione.<\u002Fdiv>\n      <div>Solo il <b>25%<\u002Fb> degli italiani è ottimista; il <b>35%<\u002Fb> riduce gli acquisti non necessari e il <b>15%<\u002Fb> anche quelli essenziali (McKinsey e BCG 2025). Il 77% vuole rinunciare al superfluo, il 75% sceglie prodotti più convenienti, il 64% rinvia spese, il 58% teme per la propria capacità di spesa (Coop 2024).<\u002Fdiv>\n      <div>Il consumatore è «tirato» da due forze: <b>accorto<\u002Fb> (riflessivo, selettivo) e <b>valoriale<\u002Fb> (sostenibilità, salute, qualità). In realtà ogni acquisto mescola più driver. La fedeltà non si gestisce più con schemi binari fedele/infedele, ma con strategie adattive e modelli ibridi di engagement.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Fascia 2 · La GDO italiana: resilienza e polarizzazione<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 22–26 · Fig. 2.2–2.6<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">La GDO tiene, ma cresce soprattutto per nuove aperture, prezzi e discount; i consumatori ribilanciano il carrello.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\"> 4.500 m² in crisi · promo 26,8%\"&gt;\n      \n      <div><b>Largo consumo confezionato 2024<\u002Fb>: +1,9% a valore, circa <b>135,1 mld €<\u002Fb>; trainata dall'<b>Area 4<\u002Fb> (Sud) +3,3%. A <b>parità di rete<\u002Fb> solo +0,8%. No Food il segmento più debole (+0,7%). Crescono SSS Drug (+7,7%) ed e-commerce (+6,3%). 1° semestre 2025: +4,2% omnichannel (Area 4 +6%).<\u002Fdiv>\n      <div><b>Inflazione vs variazione dei prezzi<\u002Fb>: l'inflazione misura i prezzi a parità di carrello; la variazione prezzi misura il prezzo medio del carrello reale. La seconda è più bassa → i clienti <b>adattano il mix<\u002Fb> per compensare, tranne nelle categorie poco sostituibili (carni +5,7%, ortofrutta +3,8%).<\u002Fdiv>\n      <div><b>Polarizzazione<\u002Fb>: mix per fascia di prezzo stabile nel 2025; nel 2024 erano cresciute le fasce estreme, soprattutto premium (25,7%).<\u002Fdiv>\n      <div><b>Private label (MDD)<\u002Fb>: 31,6% omnichannel nel 2024 (+0,3 p.p.), 32% a giugno 2025; in Iper+Super+LIS 22,8% → 23,3%. Peso maggiore della fascia <b>entry level<\u002Fb>; non più solo opzione economica ma leva di <b>differenziazione<\u002Fb>.<\u002Fdiv>\n      <div><b>Discount<\u002Fb>: +2,3% a rete corrente ma +0,1% a rete costante (crescita da aperture); 2025 +4,8% / +2,3%. In crisi superette e <b>iper oltre 4.500 m²<\u002Fb>.<\u002Fdiv>\n      <div><b>Promozioni<\u002Fb>: 26,8% delle vendite Iper+Super+LIS nel 2024 (+0,7 p.p.); l'iper &gt; 4.500 m² ha circa 7 p.p. in più della media, il doppio dei discount. Serve ripensare la promo da tattica a <b>strategica<\u002Fb>.<\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap3\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 3:<\u002Fb> Marche commerciali al 32% e polarizzazione sulle fasce estreme (Fig. 3.12–3.13).<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Fascia 3 · Il consumatore e il modello PAD<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 26–28<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il consumatore cerca tre cose: piacere e identità, semplicità, controllo. Diventa fedele solo se ne ha un vantaggio reale.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">88% più promo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">attivismo razionale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">PAD (Mehrabian e Russell 1974)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Pleasure = identità e benessere<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Arousal = semplificazione<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Dominance = controllo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fedeltà selettiva<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">consumatore a geometria variabile<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>L'<b>88%<\u002Fb> comprerà più prodotti in promo e il 44% userà i risparmi, ma non è passivo: confronta prezzi, usa app e cashback, cambia insegna se la fiducia è debole → <b>«attivismo razionale»<\u002Fb>. Il prezzo resta centrale, ma letto come <b>valore<\u002Fb>.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;font-size:13px\">\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px\"><b>P · Pleasure = identità e benessere<\u002Fb><br>la spesa è un atto simbolico; cibo salutare 66%, semplice 53%, tradizionale 51%; «esploratore alimentare» 63%: plant-based, funzionali, filiera corta<\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-900);border-radius:12px;padding:8px\"><b>A · Arousal = semplificazione<\u002Fb><br>69% sopraffatto da offerte e notifiche (Adobe); 64% premia chi semplifica (Siegel+Gale); formati snelli; semplicità = progettazione intelligente<\u002Fdiv>\n        <div style=\"background:var(--color-neutral-200);color:#201e1d;border-radius:12px;padding:8px\"><b>D · Dominance = controllo<\u002Fb><br>il cliente vuole comandare tempi e modi: comparatori, wallet, rateale, self-checkout, mappe in app, scaffali intelligenti; intolleranza alle frizioni<\u002Fdiv>\n      <\u002Fdiv>\n      <div>In Europa cresce la <b>fedeltà selettiva<\u002Fb>: si segue un brand solo se coerente con i propri valori e con vantaggi tangibili; il «brand attachment» è fragile. La tecnologia (app) abilita la relazione ma non differenzia più: contano <b>utilità, trasparenza, controllo<\u002Fb>.<\u002Fdiv>\n      <div>Profilo: consumatore <b>«a geometria variabile»<\u002Fb>, fedele per trasparenza, etica, riconoscimento e appartenenza, o solo comportamentalmente per convenienza. Finisce l'epoca del consumatore «captive».<\u002Fdiv>\n      <div style=\"border:2px dashed var(--color-neutral-400);border-radius:14px;padding:8px 11px;font-size:13px\"><b>Per ricordare ·<\u002Fb> PAD = Piacere, Agitazione da ridurre (semplificare), Dominio (controllo).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Fascia 4 · Il digitale nel retail<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 28–31<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il digitale è un ambiente culturale: l'AI è il filo che lega dati, esperienze e touchpoint, ma va resa affidabile.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AI generativa<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">bias, privacy, trasparenza, explainability<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fiducia nell'AI 43/100<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">92% retailer usa AI<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AI e big data<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">omnicanalità e phygital (+10% online, +4% store)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">blockchain e DPP<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">retail media (RMN)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">wallet e CRM<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>67,1% del mondo connesso; in Italia 81,9% usa Internet, 73% i social; 45,7% degli acquisti online da smartphone. La discontinuità più forte è l'<b>AI generativa<\u002Fb> (impatto stimato 19,9 trilioni $ al 2030, 3,5% del PIL).<\u002Fdiv>\n      <div><b>Rischi<\u002Fb>: bias algoritmico, privacy, trasparenza, <b>explainability<\u002Fb> (AI Act 2024). Fiducia nelle aziende tech 76/100 ma nell'AI solo <b>43/100<\u002Fb>; solo il 21% accoglie bene l'AI, il 43% la respinge.<\u002Fdiv>\n      <div>Il <b>92%<\u002Fb> dei retailer globali usa già l'AI (59% per consigli dei collaboratori, 55% assistenti digitali): da logica reattiva a proattiva; collante tra marketing, operations, CRM, pricing.<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px;font-size:13px\">\n        <div><b>AI, ML, big data<\u002Fb>: 20% riduce i costi o aumenta i ricavi; forecasting, pricing, merchandising; <b>digital twin<\u002Fb> nel fashion.<\u002Fdiv>\n        <div><b>Omnicanalità e phygital<\u002Fb>: 73% usa più canali; chi usa più touchpoint spende <b>+10% online e +4% in store<\u002Fb> (Sopadjieva 2017); click &amp; collect, magazzini condivisi.<\u002Fdiv>\n        <div><b>Blockchain e tracciabilità<\u002Fb>: QR, IoT; meno dipendenza dalle recensioni e più vendite (Li e Du 2024); <b>Digital Product Passport<\u002Fb> nel lusso.<\u002Fdiv>\n        <div><b>Retail media<\u002Fb>: il retailer diventa media owner con le <b>Retail Media Networks<\u002Fb>; 125 mld $ nel 2023, 177 mld stimati nel 2025; Europa oltre 30 mld al 2028.<\u002Fdiv>\n        <div><b>Wallet e CRM<\u002Fb>: pass nel wallet = relazione continua, a basso attrito, visibile, aggiornata in tempo reale; CRM con AI → segmentazione dinamica, lead scoring predittivo (precisione fino all'84%).<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap1\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 1:<\u002Fb> Le stesse frontiere tecnologiche A–E del macroambiente (AI, omnicanale, blockchain, retail media, wallet e CRM).<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Fascia 5 · Cinque strade dei programmi fedeltà<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 31–32<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">I programmi fedeltà diventano «atomi di relazione»: personali, comunitari, semplici, sostenibili, selettivi.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">iper-personalizzazione<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">hub relazionale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">esperienza semplificata<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">sostenibilità integrata<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">loyalty fatigue e selezione premium<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">agent AI<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px\">\n        <li><b>Iper-personalizzazione<\u002Fb>: l'AI profila in tempo reale e anticipa i comportamenti.<\u002Fli>\n        <li><b>Loyalty come hub relazionale<\u002Fb>: gamification, premium tier familiari, cross brand, esperienze esclusive → comunità.<\u002Fli>\n        <li><b>Esperienza semplificata<\u002Fb>: onboarding facile, app intuitive.<\u002Fli>\n        <li><b>Sostenibilità integrata<\u002Fb>: premiare comportamenti sostenibili (refill, donazioni, packaging) rafforza fiducia e retention, soprattutto nei giovani.<\u002Fli>\n        <li><b>Loyalty fatigue e selezione premium<\u002Fb>: ci si iscrive a più programmi di quanti se ne usino → puntare su esclusività e coerenza valoriale, non sulla presenza dispersiva.<\u002Fli>\n      <\u002Fol>\n      <div style=\"border:2px dashed var(--color-neutral-400);border-radius:14px;padding:8px 11px;font-size:13px\"><b>Per ricordare ·<\u002Fb> P-H-S-S-F: Personalizzazione, Hub, Semplicità, Sostenibilità, Fatigue.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Fascia 6 · Misurare la loyalty: i KPI<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 32–33<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Non basta misurare gli acquisti: servono KPI sul ciclo di vita del cliente, sulle sue attitudini e sul valore che genera.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">KPI evolutivi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">retention, churn, repeat purchase, frequency, CLV, redemption, active engagement<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">pre-churn analytics<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Hybrid Choice Models<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">5 condizioni: dashboard, A/B test, ROI multilivello, responsabilità condivisa, storytelling interno<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">accountability<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>KPI evolutivi<\u002Fb>: Customer Retention Rate, Customer Churn Rate, Repeat Purchase Rate, Purchase Frequency, <b>Customer Lifetime Value<\u002Fb>, Reward Redemption Rate, Active Engagement Rate. Chi li misura bene ha un ROI migliore.<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <div style=\"background:#201e1d;color:var(--color-neutral-100);border-radius:12px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6\"><b style=\"color:var(--color-accent-300)\">ƒ<\u002Fb> Retention Rate = (clienti a fine periodo − nuovi acquisiti) / clienti a inizio periodo · Churn Rate = clienti persi / clienti a inizio periodo<\u002Fdiv>\n        <div style=\"background:#201e1d;color:var(--color-neutral-100);border-radius:12px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6\"><b style=\"color:var(--color-accent-300)\">ƒ<\u002Fb> Repeat Purchase Rate = clienti con più di un acquisto / clienti totali · Purchase Frequency = n. ordini / n. clienti<\u002Fdiv>\n        <div style=\"background:#201e1d;color:var(--color-neutral-100);border-radius:12px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6\"><b style=\"color:var(--color-accent-300)\">ƒ<\u002Fb> Redemption Rate = punti (o premi) riscattati / punti emessi · Active Engagement Rate = membri attivi / membri iscritti<\u002Fdiv>\n        <div style=\"background:#201e1d;color:var(--color-neutral-100);border-radius:12px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6\"><b style=\"color:var(--color-accent-300)\">ƒ<\u002Fb> CLV ≈ margine medio per acquisto × frequenza annua × durata attesa (anni) − costi di acquisizione e retention<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-600)\">Il libro elenca i KPI senza formule: queste sono le definizioni standard.<\u002Fdiv>\n      <\u002Fdiv>\n      <div><b>Pre-churn analytics<\u002Fb>: modelli predittivi AI che intercettano chi sta per disingaggiarsi. <b>Hybrid Choice Models<\u002Fb> (Abou-Zeid e Ben-Akiva 2024): uniscono dati comportamentali (frequenza, spesa) e variabili latenti (valori, abitudini, percezione del brand); nati in economia comportamentale e trasporti (McFadden 1986).<\u002Fdiv>\n      <div><b>5 condizioni<\u002Fb> per una cultura KPI-driven: ① dashboard centralizzate (CRM, app, e-commerce, store) in tempo reale · ② <b>A/B test<\u002Fb> con gruppi di controllo · ③ <b>ROI multilivello<\u002Fb> (vendite incrementali + churn, CLV, NPS, soddisfazione, reputazione) · ④ responsabilità condivisa tra tutte le aree · ⑤ storytelling interno con benchmark esterni.<\u002Fdiv>\n      <div>Misurare = <b>accountability<\u002Fb>: trasforma la loyalty da costo operativo a leva di crescita. La tecnologia da sola non fidelizza: conta l'uso consapevole, etico e strategico.<\u002Fdiv>\n      <sc-if value=\"{{ showMkt }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Già visto a Marketing:<\u002Fb> CLV = (VM × FA × CV) − CA − CR dei tuoi schemi: valore medio × frequenza × durata, meno costi di acquisizione e di retention.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\"><b style=\"font-family:var(--font-heading);font-size:21px\">Allenati sul capitolo 2<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Ogni risposta conta in Winter Arc<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ p2.tab.tabs }}\" as=\"tb\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border-radius:999px;min-height:38px;padding:6px 14px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <sc-if value=\"{{ p2.tab.is_mc }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Clicca la risposta: la correzione è immediata. {{ p2.mc.punteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p2.mc.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Rifai<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p2.mc.items }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--color-neutral-200);padding-top:10px\">\n        <div style=\"font-weight:700\">{{ m.num }}. {{ m.q }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px\"><sc-for list=\"{{ m.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;border-radius:14px;min-height:44px;padding:8px 12px;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.txt }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <sc-if value=\"{{ m.done }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:{{ m.esitoColor }}\">{{ m.esito }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p2.tab.is_aperte }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Rispondi a voce o per scritto, poi apri la risposta modello. {{ p2.quiz.conteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p2.quiz.toggleFiltro }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ p2.quiz.filtroLabel }}<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p2.quiz.items }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border:2px solid {{ d.bordo }};border-radius:16px;paddi div style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-family:var(--font-heading);font-size:19px\">Passo 0 · Ascolta il capitolo del libro<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Prima della mappa. {{ p3.audio.info }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ p3.audio.fine }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 12px;border-radius:999px;background:var(--color-accent-2-600);color:#fff;font-weight:700;font-size:12.5px\">✓ Ascoltato · segnato in Winter Arc<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ p3.audio.notReady }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:var(--color-neutral-700)\">Carico il testo del libro…<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p3.audio.ready }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n        <button sc-camel-on-click=\"{{ p3.audio.back10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Indietro di 10 frasi\">« 10<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p3.audio.back }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase precedente\">‹<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p3.audio.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-500);color:#fff;padding:8px 20px\">{{ p3.audio.label }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p3.audio.fwd }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase successiva\">›<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p3.audio.fwd10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Avanti di 10 frasi\">10 »<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p3.audio.cycleRate }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">{{ p3.audio.rateLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p3.audio.restart }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:transparent;color:var(--color-neutral-700)\">Dall'inizio<\u002Fbutton>\n        <span style=\"margin-left:auto;font-size:12.5px;color:var(--color-neutral-700)\">frase {{ p3.audio.pos }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden\"><div style=\"height:100%;width:{{ p3.audio.pct }};background:var(--color-accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p3.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p3.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> È una <b>revisione sistematica della letteratura<\u002Fb>: quali punti di contatto digitali costruiscono la fedeltà, e come. Prima il metodo (come sono stati scelti 124 articoli), poi i <b>sei touchpoint<\u002Fb> più studiati, uno per uno, e infine la sintesi. Il capitolo dice <i>cosa fanno le imprese<\u002Fi>; il cap. 4 dirà <i>cosa fa funzionare i touchpoint<\u002Fi>. La mappa è una <b>schermata di app<\u002Fb>: sei icone, una per touchpoint.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:var(--color-accent-2-700);color:#fff;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:#fff\">La loyalty e il metodo della ricerca<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 34–36 · Fig. 3.1<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:rgba(255,255,255,.14);border-radius:14px;padding:9px 12px;text-wrap:pretty\">La loyalty ha più dimensioni e va gestita tutta insieme; la ricerca ha selezionato 124 articoli su digitale e fedeltà.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12.5px\">loyalty multidimensionale: attitudinale (cognitiva, affettiva, conativa) + comportamentale<\u002Fspan><span style=\"background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12.5px\">systematic literature review<\u002Fspan><span style=\"background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12.5px\">Scopus digital* AND loyal*<\u002Fspan><span style=\"background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12.5px\">510 → 300 (ABDC A*–C) → 124 articoli<\u002Fspan><span style=\"background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12.5px\">2020–2025<\u002Fspan><span style=\"background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12.5px\">molte survey<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>La loyalty è una risorsa strategica dove i clienti sono scarsi e cambiare brand è facile. È <b>multidimensionale<\u002Fb>: componenti <b>attitudinali<\u002Fb> (cognitiva, affettiva, conativa) e <b>comportamentali<\u002Fb>, che evolvono nel tempo (Castaldo 2024). Il digitale moltiplica touchpoint e dati ma pone problemi di <b>trasparenza, privacy e coerenza<\u002Fb>.<\u002Fdiv>\n      <div><b>Metodo<\u002Fb>: systematic literature review su Scopus con «digital*» e «loyal*»; solo articoli in inglese su riviste peer-review di management e marketing. <b>510<\u002Fb> risultati → <b>300<\u002Fb> su riviste ABDC A*, A, B, C → esclusi concettuali, review, editoriali, temi fuori ambito (destination loyalty, employee loyalty) → <b>124 articoli<\u002Fb>.<\u002Fdiv>\n      <div>Risultati descrittivi: articoli recenti (2020–2025), in forte crescita; molto dispersi (prima rivista: Journal of Retailing and Consumer Services, 13); soprattutto <b>survey<\u002Fb>, pochi esperimenti.<\u002Fdiv>\n      <div>Due categorie di risultati: <b>touchpoint<\u002Fb> = ciò che fanno le aziende (cap. 3) · <b>enabler<\u002Fb> = ciò che li fa funzionare (cap. 4).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">1 · Siti web ed e-commerce<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 37–38<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il sito fidelizza se funziona bene, emoziona, è sicuro e usa i dati in modo etico.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">facilità d'uso, navigazione, velocità<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">valore esperienziale (estetica, gioco)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">coinvolgimento emotivo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">referral e cashback<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">prezzi personalizzati = rischio equità e privacy<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">brand safety<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Gen Z<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">B2B2C<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Quattro dimensioni: <b>funzionale<\u002Fb> (facilità d'uso, navigazione intuitiva, informazioni chiare, velocità; Flavián 2006), <b>esperienziale<\u002Fb> (estetica, gioco, eccellenza del servizio; Dey e Vasantha 2018), <b>emotiva<\u002Fb> (coinvolgimento affettivo → riacquisto e passaparola; presenza sociale e interattività), <b>relazionale<\u002Fb> (referral e cashback rendono il cliente promotore; Ballestar 2016).<\u002Fdiv>\n      <div><b>Rischio etico<\u002Fb>: i <b>prezzi personalizzati<\u002Fb> basati sui dati personali creano percezioni di ingiustizia e preoccupazioni sulla privacy (Victor 2021); la loyalty peggiora soprattutto nei clienti sensibili al prezzo che erano fedeli (Chen 2023). Servono sicurezza delle transazioni, garanzie, <b>trasparenza dell'algoritmo<\u002Fb>.<\u002Fdiv>\n      <div>Anche il contesto degli annunci conta (<b>brand safety<\u002Fb>, Johnson 2023). La <b>Gen Z<\u002Fb> guarda qualità del servizio e valore esperienziale. Modelli <b>B2B2C<\u002Fb> integrano valore funzionale, economico e contestuale.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">2 · Touchpoint conversazionali<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 39–40<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Chatbot, assistenti e avatar fidelizzano quando l'utente si sente ascoltato come da una persona.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">chatbot<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">naturalezza e tono<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">antropomorfismo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">identificazione con la chatbot (Lee e Li)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">avatar e sguardo (Pizzi)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">assistenti vocali (effetto variabile)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">metaverso e prove virtuali<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">valore esperienziale (Gallarza)<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Chatbot<\u002Fb>: efficaci se personalizzano, risolvono problemi in tempo reale, intrattengono e danno un'immagine moderna (Naqvi 2024). La <b>naturalezza<\u002Fb> (tono adattato, ascolto) aumenta fiducia e fedeltà. Gli utenti attribuiscono tratti sociali alle chatbot e possono identificarsi con loro (Lee e Li 2023).<\u002Fdiv>\n      <div>Conta anche l'aspetto: sguardo e volto umanoide dell'<b>avatar<\u002Fb> aumentano la competenza percepita (Pizzi 2023); una chatbot troppo fredda incrina la relazione.<\u002Fdiv>\n      <div><b>Assistenti vocali<\u002Fb>: semplificano, ma la componente umana è percepita in modo positivo da alcuni e negativo da altri (Maduku 2024). Forme immersive: <b>avatar, metaverso, prove virtuali<\u002Fb> nel beauty e nella moda (Anujan 2024).<\u002Fdiv>\n      <div>Conta il <b>valore esperienziale<\u002Fb> (Gallarza 2023): da strumenti di automazione a leve strategiche. Non conta solo cosa si dice, ma <b>come si fa sentire l'utente<\u002Fb>.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">3 · Loyalty program<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 40–41<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il programma fedeltà va in app, deve essere trasparente e integrato, e si arricchisce di gioco.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">dalla carta all'app<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">punti e riscatto in tempo reale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">percezione eterogenea → segmentare (Ieva e Ziliani)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">trasparenza + integrazione online/offline (Xiao)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">benefici immediati<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">feedback to-date vs to-go<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">gamification<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">triple bottom line<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Passaggio dal formato <b>fisico<\u002Fb> a quello <b>digitale<\u002Fb> (Dreher e Ströbel 2023): l'app permette accumulo e riscatto dei punti in tempo reale, offerte personalizzate, accesso semplice ai benefici.<\u002Fdiv>\n      <div>Percezione <b>eterogenea<\u002Fb> per età, genere, familiarità tecnologica e numero di programmi → la digitalizzazione non si fa in modo uniforme, serve <b>segmentazione<\u002Fb> (Ieva e Ziliani 2017).<\u002Fdiv>\n      <div>Due requisiti: <b>trasparenza<\u002Fb> su regole, privacy e riscatto, e <b>integrazione online/offline<\u002Fb> (Xiao 2023). Si preferiscono benefici <b>immediati, tangibili, facili da valutare<\u002Fb>; il canale e il tipo di partner cambiano il valore percepito del premio.<\u002Fdiv>\n      <div><b>Feedback<\u002Fb>: «to-date» (quanto hai già raggiunto) vs «to-go» (quanto manca): l'efficacia dipende dalla cultura. Framing promozionale per le culture individualiste, preventivo per quelle collettiviste (Yang 2021).<\u002Fdiv>\n      <div><b>Gamification<\u002Fb>: badge, livelli, premi, interazioni sociali → co-creazione e obiettivi di <b>triple bottom line<\u002Fb> (profitto, persone, pianeta).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">4 · Omnichannel / multichannel<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 41–42<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">L'omnicanale funziona solo se tutti i canali sono coerenti e di qualità simile: il canale più debole trascina giù gli altri.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">ecosistema unico fisico-digitale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">coerenza tra canali (Shen e Ma)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">colpa al brand<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">spillover con simmetria qualitativa (Savastano)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">phygital (Straker e Wrigley)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">emozioni<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Bank 4.0<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">autonomia, competenza, relazionalità<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">personalizzazione contestuale<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Non basta presidiare più canali: serve <b>un unico ambiente<\u002Fb> fisico + digitale senza frizioni (Chung 2022). Se manca la <b>coerenza<\u002Fb> di contenuti, interfacce e stile, fiducia e soddisfazione calano (Shen e Ma 2022), e il cliente ne dà la colpa al <b>brand<\u002Fb>.<\u002Fdiv>\n      <div>L'esperienza cross-canale genera <b>spillover positivi<\u002Fb> solo con <b>simmetria qualitativa<\u002Fb> tra canali; altrimenti il più debole abbassa tutto (Savastano 2019). <b>Phygital<\u002Fb> = immediatezza dell'online + valore esperienziale dell'offline (Straker e Wrigley 2016); conta il passaggio attratto online → coinvolto offline (e viceversa) e le <b>emozioni<\u002Fb> (Cuesta-Valiño).<\u002Fdiv>\n      <div><b>Bank 4.0<\u002Fb>: piattaforme digitali con anima relazionale e accesso all'assistenza umana nei momenti critici. L'esperienza funziona se soddisfa i bisogni psicologici di <b>autonomia, competenza, relazionalità<\u002Fb> (Zheng e Li 2024). Il cliente si aspetta personalizzazione in tempo reale per preferenze, luogo e comportamento; l'omnicanale veicola anche valori (cause-related marketing).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">5 · App (e pagamenti digitali)<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 42–43<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">L'app è diventata il cuore della relazione; i pagamenti digitali la rendono più fluida e riducono l'abbandono.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">crescita per tecnologia e Covid<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">da transazionale a engagement<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">banking, m-commerce, ride-sharing, gaming<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fiducia, abitudini, switching cost<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Gen Z autenticità vs Gen X brand loyalty<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">mobile payment ed e-wallet<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Alipay meno churn<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AR<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Crescita spinta da <b>tecnologia<\u002Fb> (AI, esperienze immersive; Butt 2024) e <b>Covid<\u002Fb> (ruolo protettivo, fiducia; Goel 2022). Da funzione transazionale a strumento di <b>engagement<\u002Fb> cognitivo ed emotivo.<\u002Fdiv>\n      <div>Settori: <b>banking<\u002Fb> (coinvolgimento affettivo), <b>ride-sharing<\u002Fb> (fiducia digitale e interpersonale; abitudini e costi di cambiamento), <b>gaming<\u002Fb> (benessere e connessioni), <b>mobile commerce<\u002Fb> (co-creazione, edonismo e utilità; assurance, reattività, qualità informativa).<\u002Fdiv>\n      <div><b>Generazioni<\u002Fb>: la Gen Z cerca autenticità e personalizzazione (anche via AI); la Gen X ha più brand loyalty.<\u002Fdiv>\n      <div><b>Pagamenti digitali<\u002Fb> (mobile payment, e-wallet): riducono barriere, aumentano fiducia e fluidità. E-wallet: passaparola e soddisfazione (Al-Okaily 2025). <span style=\"color:var(--color-accent-800);font-weight:700\">es.<\u002Fspan> <b>Alipay<\u002Fb>: più frequenza d'uso e meno churn (Xu 2024). Utili anche nelle assicurazioni in crisi e nel retail omnicanale (meno attese); realtà aumentata nei pagamenti per i più giovani.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">6 · Piattaforme<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 43–45<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Le piattaforme fidelizzano creando comunità e co-creazione, ma vanno gestite per qualità, coerenza e sicurezza.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\"> visualizzazioni · peer-to-peer (Airbnb) · B2B2C da push a pull · verticali (salute, lusso, cultura, sport) · rischi brand safety · brand avatar, influencer\"&gt;\n      \n      <div>Oltre la transazione: <b>ecosistemi relazionali<\u002Fb> che alimentano engagement, valore, sicurezza e continuità (Iglesias 2020). CRM classico + social = interazione bidirezionale continua (Arora 2021).<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:6px;font-size:13px\">\n        <div style=\"background:var(--color-accent-100);border-radius:12px;padding:7px 9px\"><b>Di contenuto<\u002Fb>: branded content (YouTube), sinistri digitali nelle assicurazioni, PMI nella supply chain<\u002Fdiv>\n        <div style=\"background:var(--color-accent-100);border-radius:12px;padding:7px 9px\"><b>Relazionali<\u002Fb>: social engagement, congruenza di personalità, ascolto dei reclami. <b>Commenti e condivisioni<\u002Fb> &gt; visualizzazioni passive. <b>Online brand community<\u002Fb>: engagement cognitivo, affettivo, comportamentale; OBC-SiteQUAL (Carlson 2021)<\u002Fdiv>\n        <div style=\"background:var(--color-accent-100);border-radius:12px;padding:7px 9px\"><b>Peer-to-peer e ibride<\u002Fb>: Airbnb, HomeAway (co-creazione); <b>B2B2C<\u002Fb> sposta la strategia da push a pull<\u002Fdiv>\n        <div style=\"background:var(--color-accent-100);border-radius:12px;padding:7px 9px\"><b>Verticali<\u002Fb>: community sanitarie, lusso, musei, club di calcio con iniziative green<\u002Fdiv>\n      <\u002Fdiv>\n      <div>Anche nel <b>B2B<\u002Fb>: la fiducia costruita sui social riduce il rischio percepito. <b>Rischi<\u002Fb>: annunci accanto a contenuti inappropriati riducono fiducia e disponibilità a pagare; marketplace ibridi incoerenti. <b>Trend<\u002Fb>: brand avatar, influencer marketing.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Altri touchpoint e sintesi<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 45–47<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Ogni touchpoint agisce in una fase diversa del journey: la sfida è coordinarli in un'esperienza progressiva.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">QR code (menu: comodi ma meno contatto)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">virtual fitting room<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">digital signage<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">ICT museali<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">blockchain B2B (mediatore + moderatore)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">tracking informativo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">la tecnologia mal progettata danneggia<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">coordinare per fase del journey<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>QR code<\u002Fb> (menu digitali): riducono i costi ma possono ridurre la loyalty di chi vuole contatto umano (Hewage 2024). <b>Virtual fitting room<\u002Fb>: meno incertezza e resi, più conversione. <b>Digital signage<\u002Fb>: emozioni, acquisti d'impulso, fedeltà (Garaus 2017). <b>ICT e social nei musei<\u002Fb>: appartenenza e ritorno.<\u002Fdiv>\n      <div><b>B2B<\u002Fb>: la <b>blockchain<\u002Fb> è insieme <b>mediatore<\u002Fb> (rafforza la fiducia con il monitoraggio) e <b>moderatore<\u002Fb> (amplifica la reattività al mercato) (Kramer 2024); la qualità del <b>tracking<\u002Fb> logistico genera valore d'uso e fedeltà verso il fornitore.<\u002Fdiv>\n      <div><b>Avvertimento<\u002Fb>: la tecnologia non progettata sulle reali aspettative può <b>compromettere<\u002Fb> la fedeltà.<\u002Fdiv>\n      <div><b>Sintesi<\u002Fb>: alcuni touchpoint contano nella scoperta, altri nell'acquisto, altri nel post-vendita. Moltiplicarli senza governo crea percorsi frammentati → serve un'esperienza <b>progressiva e integrata<\u002Fb>.<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85;opacity:1\">LEGGI · Tab. 3.1, p. 36–37<\u002Fspan><span>Tabella dei touchpoint con costrutti e riferimenti<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\"><b style=\"font-family:var(--font-heading);font-size:21px\">Allenati sul capitolo 3<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Ogni risposta conta in Winter Arc<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ p3.tab.tabs }}\" as=\"tb\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border-radius:999px;min-height:38px;padding:6px 14px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <sc-if value=\"{{ p3.tab.is_mc }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Clicca la risposta: la correzione è immediata. {{ p3.mc.punteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p3.mc.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-20

or-accent-2-900)\">{{ p8.audio.rateLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p8.audio.restart }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:transparent;color:var(--color-neutral-700)\">Dall'inizio<\u002Fbutton>\n        <span style=\"margin-left:auto;font-size:12.5px;color:var(--color-neutral-700)\">frase {{ p8.audio.pos }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden\"><div style=\"height:100%;width:{{ p8.audio.pct }};background:var(--color-accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p8.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p8.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> È il caso <b>TCC<\u002Fb>, società globale di loyalty. Margini compressi e shopper esigenti trasformano la loyalty da <b>costo<\u002Fb> (sconti) a <b>motore di profitto<\u002Fb> (dati, engagement, retail media). TCC risponde con campagne omnicanale costruite su tre principi; tre campagne reali anonimizzate mostrano i risultati; poi il focus sull'Italia e la transizione dal <b>bollino fisico al digitale<\u002Fb>. La mappa è un <b>tabellone dei risultati<\u002Fb>: i numeri delle campagne sono il punto da ricordare.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Lo scenario e la risposta di TCC<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 110–111<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">La loyalty diventa un sistema integrato e data-driven: più engagement significa più vendite, dati migliori e nuovi ricavi.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">margini compressi, costi, carenza di personale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">nuovi KPI: scansione carta, adozione app, dati CRM, retail media<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">da centro di costo a motore di profitto<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">TCC: insight → concept → attivazione → engagement → analytics<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">bollini digitali, missioni, sfide, quest<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">community (scuole, società sportive)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">rilevanza, differenziazione, crescita<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">misurazione nativa<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Pressioni<\u002Fb>: margini compressi, costi in aumento, carenza di personale (Castaldo 2024). Ai KPI classici (valore del carrello, frequenza di visita) si aggiungono <b>tasso di scansione della carta, adozione dell'app, raccolta dati CRM, monetizzazione del retail media<\u002Fb>. Gli shopper vogliono riconoscimento immediato e abbandonano programmi statici o generici.<\u002Fdiv>\n      <div><b>TCC<\u002Fb> copre tutto il percorso: insight, concept design, attivazione omnicanale, digital engagement, performance analytics. Collega e misura tutti i touchpoint (app, sito, POS, scontrini, social, CRM). Meccaniche: <b>bollini digitali, missioni, sfide, quest<\u002Fb>; attivazioni per le <b>community<\u002Fb> (scuole, società sportive).<\u002Fdiv>\n      <div>Benefici: shopper → esperienze oltre lo sconto · retailer → più carte scansionate, utenti in app, CRM attivo, retail media misurabile · brand → canali diretti per finanziare attivazioni.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:6px;font-size:13px\">\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:7px 9px\"><b>Rilevanza<\u002Fb>: personalizzazione ed esperienze fluide<\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-900);border-radius:12px;padding:7px 9px\"><b>Differenziazione<\u002Fb>: gamification e contenuti autentici<\u002Fdiv>\n        <div style=\"background:var(--color-neutral-200);color:#201e1d;border-radius:12px;padding:7px 9px\"><b>Crescita<\u002Fb>: vendite, penetrazione, dati, media<\u002Fdiv>\n      <\u002Fdiv>\n      <div>La <b>misurazione è nativa<\u002Fb>: la telemetria di campagna collega l'engagement ai KPI e permette di ottimizzare in corsa.<\u002Fdiv>\n      <div style=\"border:2px dashed var(--color-neutral-400);border-radius:14px;padding:8px 11px;font-size:13px\"><b>Per ricordare ·<\u002Fb> R-D-C: Rilevanza, Differenziazione, Crescita.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Campagna 1 · Retailer nordamericano: omnicanale<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 111<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Integrare i touchpoint omnicanale migliora insieme vendite, scansioni, app e CRM, e genera dati per il ciclo dopo.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">vendite membri +2%<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">scansione carta +14%<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">penetrazione loyalty +1,5%<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">utenti attivi settimanali in app +44%<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">e-mail: open rate +16%, CTR +65%, partecipazione +1,2%<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">sfide: 21% partecipa, engagement +46%, circa 100.000 data point<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));gap:6px;text-align:center\">\n        <div style=\"background:var(--color-accent-500);color:#fff;border-radius:12px;padding:8px\"><b style=\"font-size:22px\">+2%<\u002Fb><br><span style=\"font-size:11.5px\">vendite membri<\u002Fspan><\u002Fdiv>\n        <div style=\"background:var(--color-accent-500);color:#fff;border-radius:12px;padding:8px\"><b style=\"font-size:22px\">+14%<\u002Fb><br><span style=\"font-size:11.5px\">scansione carta<\u002Fspan><\u002Fdiv>\n        <div style=\"background:var(--color-accent-500);color:#fff;border-radius:12px;padding:8px\"><b style=\"font-size:22px\">+1,5%<\u002Fb><br><span style=\"font-size:11.5px\">penetrazione loyalty<\u002Fspan><\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-500);color:#fff;border-radius:12px;padding:8px\"><b style=\"font-size:22px\">+44%<\u002Fb><br><span style=\"font-size:11.5px\">attivi settimanali in app<\u002Fspan><\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-500);color:#fff;border-radius:12px;padding:8px\"><b style=\"font-size:22px\">+65%<\u002Fb><br><span style=\"font-size:11.5px\">CTR e-mail (open +16%)<\u002Fspan><\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-500);color:#fff;border-radius:12px;padding:8px\"><b style=\"font-size:22px\">21%<\u002Fb><br><span style=\"font-size:11.5px\">gioca alle sfide (+46% engagement)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div>I <b>bollini digitali<\u002Fb> spingono l'app; le <b>e-mail personalizzate<\u002Fb> attivano il CRM (+1,2% partecipazione); le <b>sfide<\u002Fb> generano circa <b>100.000 data point<\u002Fb> per profilare e monetizzare il retail media.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Campagna 2 · Grocery europeo: community + gamification<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 112<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Le sfide di gioco dentro un programma per le società sportive riattivano i dormienti e aumentano raccolta e uso dei voucher.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">società sportive<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">1.095 attive su 1.611 (68%)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">14.845 achievement, 12.095 sfide (99% completion)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">409.000 visite, 2.000 interazioni<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">riattivate: voucher +86% raccolti, +100% riscossi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">nuove: +66,1% / +71,8%<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">13,5 achievement e 11,8 sfide per società<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">loyalty purpose-driven<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>1.095<\u002Fb> società attive su <b>1.611<\u002Fb> registrate = <b>68%<\u002Fb> di attivazione; <b>14.845<\u002Fb> achievement e <b>12.095<\u002Fb> sfide completate (<b>99%<\u002Fb> di completion); oltre <b>409.000<\u002Fb> visite ai siti delle società e circa 2.000 interazioni social.<\u002Fdiv>\n      <div>Voucher: società <b>riattivate +86%<\u002Fb> raccolti / <b>+100%<\u002Fb> riscossi; <b>nuove +66,1% / +71,8%<\u002Fb>. In media 13,5 achievement e 11,8 sfide per società → segnali per profilazione e retargeting. Il ROI migliora per gli sponsor (distribuzione e redemption dei voucher). Adatto alla loyalty <b>purpose-driven<\u002Fb>, tipica dell'Europa.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Campagna 3 · Retailer-grossista tedesco: instant win<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 112<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il gioco instant win in app porta le persone in negozio: il digitale si converte in visite fisiche.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">pilota estivo 6 settimane<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">freschi ad alto margine<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">38% degli utenti app coinvolti<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">+7,8% clienti tra i membri partecipanti<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">+5,7% vendite<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">73% dei redeemer compra in negozio al ritiro<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">redeemer +17% affluenza<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">gratificazione immediata + obiettivi lunghi<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Pilota di <b>6 settimane<\u002Fb> sui <b>freschi ad alto margine<\u002Fb>. Coinvolto il <b>38%<\u002Fb> degli utenti attivi in app; <b>+7,8%<\u002Fb> di clienti tra i membri partecipanti; <b>+5,7%<\u002Fb> di vendite; il <b>73%<\u002Fb> dei redeemer ha fatto acquisti in negozio al ritiro del premio; i redeemer hanno un'affluenza <b>+17%<\u002Fb> rispetto ai non redeemer.<\u002Fdiv>\n      <div>Combinare <b>gratificazione immediata<\u002Fb> (spin-to-win) e <b>obiettivi di lungo periodo<\u002Fb> (raccolta bollini) funziona ed è replicabile per retailer regionali e medi; porta attenzione su reparti difficili da gamificare.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Tre takeaway<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 112<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Funziona se l'operatività è senza frizioni, l'esperienza è adattata al segmento e la monetizzazione è progettata da subito.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">assetto operativo: POS-app, data pipeline, frizioni<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">segmenti: club, scuole e shopper rispondono a trigger diversi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">monetizzazione: funding dei brand, retail media e dati primari progettati nell'architettura<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>① <b>Assetto operativo<\u002Fb>: integrazioni POS-app, data pipeline, esecuzione in negozio, governance; la frizione decide fattibilità e velocità.<\u002Fdiv>\n      <div>② <b>Segmenti<\u002Fb>: club, scuole e shopper non rispondono agli stessi trigger; cadenza, premi e UX vanno adattati.<\u002Fdiv>\n      <div>③ <b>Monetizzazione<\u002Fb>: funding dei brand, retail media e dati primari vanno intrecciati nell'architettura, non aggiunti dopo.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Focus Italia: meccaniche, frequenza, premi<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 113–114<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">In Italia le campagne con componente digitale sono raddoppiate; si gioca per estrazione o in classifica, con regole di frequenza diverse.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">iniziative digitali dal 40% all'80%<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">quiz, videogame, missioni, caccia al codice<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">obiettivi: app, iscrizioni, giovani, edutainment<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">meno metaverso e AR<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">titoli digitali (estrazione) vs classifiche a punti<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">crediti convertibili<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">frequenza predefinita, indicizzata agli acquisti, libera<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">premi e complessità tecnologica<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>In cinque anni le iniziative potenziate dal digitale sono passate dal <b>40% all'80%<\u002Fb>. Add-on: quiz, videogame, missioni, caccia al codice → più download e uso dell'app, più iscrizioni, giovani, <b>edutainment<\u002Fb>. Cala l'interesse per <b>metaverso e AR<\u002Fb> (poco semplici). Nuovi fini: spinta alla MDD, visibilità sponsor, traffico in negozio, dati.<\u002Fdiv>\n      <div><b>Meccaniche<\u002Fb>: <b>titoli digitali<\u002Fb> (token ottenuti con quiz o missioni = biglietti per l'estrazione finale) · <b>classifiche a punti<\u002Fb> (i migliori vincono premi garantiti o status) · in prospettiva <b>crediti convertibili<\u002Fb> in un catalogo.<\u002Fdiv>\n      <div><b>Frequenza<\u002Fb>: <b>predefinita<\u002Fb> (es. una giocata al giorno) · <b>indicizzata<\u002Fb> agli acquisti (una giocata ogni tot euro) · <b>libera<\u002Fb> (giocate illimitate, conta il miglior punteggio). Chi prova una meccanica la riprova e se la aspetta.<\u002Fdiv>\n      <div><b>Premi<\u002Fb>: dagli sconti alla cassa ai viaggi e alle auto. I premi fisici in negozio richiedono integrazioni POS-loyalty-stock; i premi a estrazione sono i più semplici da gestire.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:var(--color-accent-2-100);color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;border:2px solid var(--color-accent-2-500);\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Dal bollino fisico al digitale e conclusioni<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 114–115<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il passaggio al bollino digitale è un percorso graduale; la loyalty omnicanale è ormai un «sistema operativo».<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">100% bollini accreditati senza lavoro di cassa<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">tracciamento in tempo reale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">pilota full-digital: partecipazione più bassa ma esperienza più ricca<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">approcci: full-digital su cluster pilota o ibrido carta/app<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">differenziazione per canale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">campagne community<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">percorso, non interruttore<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">personalizzazione adattiva<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">misurazione causale control/treatment<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">monetizzazione<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Bollino digitale<\u002Fb>: sostenibilità, personalizzazione in tempo reale, accredito automatico del <b>100%<\u002Fb> dei bollini senza lavoro di cassa, tracciamento di chi colleziona e dove si trova. I piloti full-digital hanno partecipazione e redemption <b>più basse<\u002Fb>, ma non per questo sono meno efficaci: danno dati ed esperienze più ricche.<\u002Fdiv>\n      <div>Due approcci: <b>full-digital su cluster pilota<\u002Fb> o <b>modelli ibridi<\u002Fb> carta/app su scelta del cliente; anche differenziazione per canale (fisico alla cassa presidiata, digitale su self-checkout e online). Sfida tecnica e culturale. Le <b>campagne community<\u002Fb> (scuole, sport) restituiscono valore al territorio.<\u002Fdiv>\n      <div><b>Direttrici<\u002Fb>: ① migrazione carta → digitale come <b>percorso, non interruttore<\u002Fb> · ② personalizzazione da regole statiche a <b>esperienze adattive<\u002Fb> · ③ misurazione <b>causale e continua<\u002Fb> con disegni <b>control/treatment<\u002Fb> · ④ nuove <b>monetizzazioni<\u002Fb> (sfide finanziate dai brand, retail media, data product).<\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap9\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 9:<\u002Fb> Test su pdv pilota contro pdv di controllo: stesso principio dell'effetto netto.<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\"><b style=\"font-family:var(--font-heading);font-size:21px\">Allenati sul capitolo 8<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Ogni risposta conta in Winter Arc<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ p8.tab.tabs }}\" as=\"tb\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border-radius:999px;min-height:38px;padding:6px 14px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <sc-if value=\"{{ p8.tab.is_mc }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Clicca la risposta: la correzione è immediata. {{ p8.mc.punteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p8.mc.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Rifai<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p8.mc.items }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--color-neutral-200);padding-top:10px\">\n        <div style=\"font-weight:700\">{{ m.num }}. {{ m.q }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px\"><sc-for list=\"{{ m.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;border-radius:14px;min-height:44px;padding:8px 12px;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.txt }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <sc-if value=\"{{ m.done }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:{{ m.esitoColor }}\">{{ m.esito }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p8.tab.is_aperte }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Rispondi a voce o per scritto, poi apri la risposta modello. {{ p8.quiz.conteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p8.quiz.toggleFiltro }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12 style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-family:var(--font-heading);font-size:19px\">Passo 0 · Ascolta il capitolo del libro<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Prima della mappa. {{ p9.audio.info }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ p9.audio.fine }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 12px;border-radius:999px;background:var(--color-accent-2-600);color:#fff;font-weight:700;font-size:12.5px\">✓ Ascoltato · segnato in Winter Arc<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ p9.audio.notReady }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:var(--color-neutral-700)\">Carico il testo del libro…<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p9.audio.ready }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n        <button sc-camel-on-click=\"{{ p9.audio.back10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Indietro di 10 frasi\">« 10<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p9.audio.back }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase precedente\">‹<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p9.audio.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-500);color:#fff;padding:8px 20px\">{{ p9.audio.label }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p9.audio.fwd }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase successiva\">›<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p9.audio.fwd10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Avanti di 10 frasi\">10 »<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p9.audio.cycleRate }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">{{ p9.audio.rateLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p9.audio.restart }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:transparent;color:var(--color-neutral-700)\">Dall'inizio<\u002Fbutton>\n        <span style=\"margin-left:auto;font-size:12.5px;color:var(--color-neutral-700)\">frase {{ p9.audio.pos }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden\"><div style=\"height:100%;width:{{ p9.audio.pct }};background:var(--color-accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p9.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p9.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> È il riepilogo di tutto il libro: ottimo per ripassare prima dell'esame. Prima ricapitola i capitoli, poi fissa i <b>5 pilastri<\u002Fb> della loyalty digitale, poi le <b>9 implicazioni manageriali<\u002Fb>, infine l'agenda comune tra ricerca e imprese. Idea centrale: la loyalty è un <b>processo dinamico<\u002Fb> che nasce dall'interazione tra contesto, tecnologia e scelte organizzative, non il risultato statico delle transazioni. La mappa è un <b>tempio<\u002Fb>: frontone (l'idea), colonne (i pilastri), gradini (le implicazioni).<\u002Fdiv>\n  <div style=\"background:var(--color-accent-500);color:#fff;border-radius:60px 60px 14px 14px;padding:14px 20px;text-align:center;font-size:14px\"><b style=\"font-family:var(--font-heading);font-size:20px\">La loyalty è una risorsa strategica<\u002Fb><br>coerenza tra canali · allineamento ai valori · adattamento alle aspettative · integrazione di digitale e fisico-umano<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px;font-size:13px\">\n    <div style=\"background:var(--color-accent-2-200);border-radius:14px;padding:9px 11px\"><b>P1<\u002Fb> touchpoint + enabler<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-200);border-radius:14px;padding:9px 11px\"><b>P2<\u002Fb> gamification e app come hub<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-200);border-radius:14px;padding:9px 11px\"><b>P3<\u002Fb> semplicità, personalizzazione, previsione<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-200);border-radius:14px;padding:9px 11px\"><b>P4<\u002Fb> fiducia e trasparenza su prodotto, valori, sostenibilità<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-200);border-radius:14px;padding:9px 11px\"><b>P5<\u002Fb> coordinamento organizzativo e dati<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Il libro in una pagina<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 116–117<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Ogni capitolo aggiunge un tassello: contesto, letteratura, ricerca sul campo, casi.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">cap. 1 omnicanale e centralità del cliente<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">cap. 2 retail in scenario fragile<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">cap. 3–4 touchpoint ed enabler (mediatori/moderatori)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">cap. 5–6 ricerca qualitativa con i manager<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">cap. 7 casi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">cap. 8 caso TCC<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">loyalty = processo dinamico<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Cap. 1<\u002Fb> contesto omnicanale e centralità del cliente · <b>cap. 2<\u002Fb> retail tra incertezza geopolitica, tecnologia e consumatori orientati al valore · <b>cap. 3<\u002Fb> touchpoint come punti di incontro lungo il journey · <b>cap. 4<\u002Fb> enabler che trasformano i touchpoint in leve di loyalty, come mediatori o moderatori · <b>cap. 5–6<\u002Fb> ricerca qualitativa con i manager · <b>cap. 7<\u002Fb> casi di aziende che sperimentano tecnologia, gamification, omnicanalità · <b>cap. 8<\u002Fb> TCC: omnicanale, gamification, retail media, transizione digitale.<\u002Fdiv>\n      <div>La loyalty è un <b>processo dinamico<\u002Fb>, non un risultato statico; non è un costo o un mero strumento commerciale ma una <b>risorsa strategica<\u002Fb> e un fattore di competitività nei contesti fragili.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">I 5 pilastri della loyalty digitale<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 117–119<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Nei contesti instabili la fedeltà diventa una base sicura; i pilastri uniscono tecnologia e persone.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">loyalty = fattore di stabilità nei contesti incerti<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">digitale = linguaggio che rende trasparenti i valori (QR, tracciabilità)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">premiare comportamenti virtuosi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">il personale come ambasciatore<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">equilibrio automazione/umanità<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">P1–P5<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Con tensioni geopolitiche e prezzi volatili la fedeltà <b>diventa un fattore di stabilità<\u002Fb>. Il digitale è un <b>linguaggio<\u002Fb> che rende verificabili i valori (QR, schede prodotto, tracciabilità della filiera) e permette di premiare comportamenti virtuosi. Ma un dipendente disattento distrugge in pochi secondi la credibilità: il personale deve essere <b>ambasciatore<\u002Fb> dei valori. Serve equilibrio tra <b>automazione e umanità<\u002Fb>.<\u002Fdiv>\n      <div><b>P1 · Touchpoint ed enabler<\u002Fb>: i touchpoint da soli non bastano; conta orchestrare i canali in modo coerente. Enabler trasversali decisivi: user experience (prerequisito), engagement, brand connection, fiducia anche verso le tecnologie.<\u002Fdiv>\n      <div><b>P2 · Gamification e app come hub<\u002Fb>: il gioco moltiplica i contatti prima e dopo l'acquisto; l'app con push, coupon, QR e wallet diventa ecosistema e crea community; WhatsApp porta verso il one-to-one; serve governance dei dati con il consenso.<\u002Fdiv>\n      <div><b>P3 · Semplicità, personalizzazione, previsione<\u002Fb>: la <b>facilità d'uso<\u002Fb> trasforma la tecnologia in vantaggio, anche per i meno digitali; stesse promesse e stesso tono su ogni touchpoint; post-acquisto (ricette, consigli, promemoria) e attenzione umana per i feedback qualitativi; AI per anticipare bisogni, intercettare l'abbandono, trovare micro-segmenti, ottimizzare promo.<\u002Fdiv>\n      <div><b>P4 · Fiducia e trasparenza<\u002Fb>: valori dichiarati visibili nelle azioni; <b>paperless<\u002Fb> come messaggio di sostenibilità; etichette digitali e QR per la filiera; inclusività e fornitori locali.<\u002Fdiv>\n      <div><b>P5 · Coordinamento e dati<\u002Fb>: marketing, IT, operations e negozi integrati; i dati proprietari sono un vantaggio difficile da copiare se gestiti con processi condivisi.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Le 9 implicazioni manageriali (1–5)<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 119–121<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Le prime cinque riguardano strategia, organizzazione, cultura, engagement ed esperienza.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\"> tecnologia, loyalty come asset e piattaforma di retail media · 2 coordinamento: il personale in cassa come driver · 3 cultura digitale: la resistenza è dentro l'azienda · 4 engagement multidimensionale: cognitivo, emotivo, comportamentale · 5 integrare touchpoint ed enabler\"&gt;\n      \n      <div><b>1 · Digitalizzazione strategica<\u002Fb>: AI e ML non solo per l'efficienza ma per il <b>valore percepito<\u002Fb> (personalizzazione, previsione, logistica intelligente); blockchain per la trasparenza; retail media per nuovi ricavi; wallet e CRM come piattaforme relazionali. La loyalty diventa un <b>asset di business<\u002Fb> e può essere una piattaforma di retail media. Conta l'esperienza, non la tecnologia.<\u002Fdiv>\n      <div><b>2 · Coordinamento organizzativo<\u002Fb>: funzioni che collaborano sui big data. Il <b>personale in cassa<\u002Fb> che spiega le iniziative digitali diffonde l'ecosistema anche tra gli anziani; servono comunicazione interna, formazione, sensibilità dei responsabili di negozio, test preliminari con più dipartimenti.<\u002Fdiv>\n      <div><b>3 · Cultura digitale<\u002Fb>: organizzazioni agili e lean, aperte alla sperimentazione. La resistenza maggiore spesso è <b>dentro l'organizzazione<\u002Fb> e non nel consumatore; con buona guida anche le zone a bassa alfabetizzazione digitale danno ottimi risultati; cultura <b>data-driven<\u002Fb> per misurare e correggere.<\u002Fdiv>\n      <div><b>4 · Engagement multidimensionale<\u002Fb>: shopper selettivi, disillusi, «a geometria variabile» → strategie adattive. Attivare insieme il piano <b>cognitivo<\u002Fb> (contenuti pertinenti), <b>emotivo<\u002Fb> (esperienze gratificanti, identificazione con i valori) e <b>comportamentale<\u002Fb> (community, recensioni, condivisioni, cause). Una sola dimensione dà risultati deboli.<\u002Fdiv>\n      <div><b>5 · Integrare touchpoint ed enabler<\u002Fb>: un'app senza personalizzazione, engagement e gamification resta sterile; una chatbot non utile e affidabile non crea fiducia. Progettare sinergie, non strumenti isolati.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Le 9 implicazioni manageriali (6–9)<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 121–123<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Le ultime quattro dicono dove mettere ogni strumento, come integrare i canali, come misurare e perché le persone restano centrali.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">6 journey: scoperta (sito, motori, social) → acquisto (app, pagamenti) → post-vendita (chatbot, customer care) → fidelizzazione (loyalty program, app, community)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">7 omnicanalità integrata: regole di redemption, pagamenti, phygital, percorso graduale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">8 loyalty strategica: hub relazionale, loyalty fatigue, metriche predittive e attitudinali<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">9 relazione phygital: capitale umano insostituibile<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>6 · Customer journey<\u002Fb>: ogni touchpoint ha la sua fase.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:6px;font-size:13px\">\n        <div style=\"background:var(--color-accent-2-100);border-radius:12px;padding:7px 9px\"><b>Scoperta<\u002Fb><br>siti, motori di ricerca, social<\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-200);border-radius:12px;padding:7px 9px\"><b>Acquisto<\u002Fb><br>app, pagamenti digitali<\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-300);border-radius:12px;padding:7px 9px\"><b>Post-vendita<\u002Fb><br>chatbot, supporto, customer care<\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-500);color:#fff;border-radius:12px;padding:7px 9px\"><b>Fidelizzazione<\u002Fb><br>loyalty program, app, community<\u002Fdiv>\n      <\u002Fdiv>\n      <div><b>7 · Omnicanalità integrata<\u002Fb>: tanti canali sono una sfida, non una garanzia; senza regia i percorsi si frammentano. Regole di <b>redemption<\u002Fb> chiare, pagamenti armonizzati, esperienza phygital, comunicazione con stile riconoscibile, transizione <b>graduale<\u002Fb> dal fisico al digitale.<\u002Fdiv>\n      <div><b>8 · Loyalty strategica<\u002Fb>: le promozioni frequenti hanno reso i clienti cinici → loyalty come <b>hub relazionale<\u002Fb> (gamification, esperienze, community, sostenibilità). Contro la <b>loyalty fatigue<\u002Fb>: rilevanza, semplicità, coerenza. KPI tradizionali (retention, CLV, redemption) non bastano: servono metriche <b>predittive<\u002Fb> (pre-churn, modelli ibridi) e <b>attitudinali<\u002Fb> (soddisfazione, fiducia, connessione, engagement) con survey, sentiment analysis, dashboard, A/B test.<\u002Fdiv>\n      <div><b>9 · Relazione phygital<\u002Fb>: la fiducia nasce dalla corrispondenza tra promesse e realtà in ogni touchpoint; QR e contenuti comunicano sostenibilità e origine (freschi, bio). Il <b>capitale umano è insostituibile<\u002Fb>: competenze emotive, formazione, coinvolgimento. La tecnologia abilita, non sostituisce.<\u002Fdiv>\n      <div style=\"border:2px dashed var(--color-neutral-400);border-radius:14px;padding:8px 11px;font-size:13px\"><b>Per ricordare ·<\u002Fb> Le 9 in ordine: Strategia, Coordinamento, Cultura, Engagement, Integrazione, Journey, Omnicanalità, Loyalty strategica, Phygital.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:var(--color-accent-2-100);color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;border:2px solid var(--color-accent-2-500);\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">L'agenda comune ricerca-imprese<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 123–124<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Imprese e università devono collaborare: le prime hanno i dati, le seconde i metodi per trasformarli in conoscenza.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">le imprese hanno i dati, l'accademia gli strumenti per interpretarli<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">competenze analitiche e interdisciplinari<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">dati → conoscenza → pratiche → teorie<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">temi: misurazione integrata, loyalty fatigue, omnicanalità coerente, cultura data-driven<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">ecosistema di apprendimento<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Loyalty Promotion Monitor con TCC<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Le imprese ricevono un flusso di dati senza precedenti (app, e-commerce, pagamenti, sensori), ma serve saperli leggere: competenze analitiche, approccio <b>interdisciplinare<\u002Fb>, orientamento data-driven. L'accademia ha schemi teorici e metodi ma poco accesso a dati reali.<\u002Fdiv>\n      <div>Insieme creano un ciclo virtuoso: <b>dati → conoscenza → pratiche → nuove teorie<\u002Fb>. Temi: misurazione integrata della fedeltà, prevenzione della loyalty fatigue, esperienze omnicanale coerenti, cultura data-driven, sostenibilità e inclusività. Forma: un <b>ecosistema di apprendimento<\u002Fb> con piattaforme di ricerca condivise e progetti congiunti, come il Loyalty Promotion Monitor sostenuto da TCC.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\"><b style=\"font-family:var(--font-heading);font-size:21px\">Allenati sul capitolo 9<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Ogni risposta conta in Winter Arc<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ p9.tab.tabs }}\" as=\"tb\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border-radius:999px;min-height:38px;padding:6px 14px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <sc-if value=\"{{ p9.tab.is_mc }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Clicca la risposta: la correzione è immediata. {{ p9.mc.punteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p9.mc.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Rifai<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p9.mc.items }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--color-neutral-200);padding-top:10px\">\n        <div style=\"font-weight:700\">{{ m.num }}. {{ m.q }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px\"><sc-for list=\"{{ m.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;border-radius:14px;min-height:44px;padding:8px 12px;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.txt }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <sc-if value=\"{{ m.done }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:{{ m.esitoColor }}\">{{ m.esito }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p9.tab.is_aperte }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Rispondi a voce o per scritto, poi apri la risposta modello. {{ p9.quiz.conteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p9.quiz.toggleFiltro }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ p9.quiz.filtroLabel }}<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p9.quiz.items }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border:2px solid {{ d.bordo }};border-radius:16px;padding:10px 12px\">\n        <div style=\"display:flex;gap:8px;align-items:flex-start\"><span style=\"flex:none;padding:1px 8px;border-radius:999px;background:{{ d.tipoBg }};font-size:11.5px;font-weight:700\">{{ d.tipo }}<\u002Fspan><b style=\"flex:1\">{{ d.num }}. {{ d.q }}<\u002Fb><span style=\"flex:none;font-size:11.5px;color:var(--color-neutral-700)\">{{ d.stato }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><button sc-camel-on-click=\"{{ d.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ d.btnLabel }}<\u002Fbutton><button sc-camel-on-click=\"{{ d.sapevo }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">La sapevo<\u002Fbutton><button sc-camel-on-click=\"{{ d.noSapevo }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-accent-200);color:var(--color-accent-900)\">Non la sapevo<\u002Fbutton><sc-if value=\"{{ d.custom }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ d.del }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:transparent;color:var(--color-neutral-700)\">Elimina<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n        <sc-if value=\"{{ d.open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:var(--color-neutral-100);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.55\">{{ d.a }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n      <sc-if value=\"{{ p9.quiz.vuoto }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:var(--color-accent-2-800)\">Nessuna domanda da rivedere: tutte risposte giuste l'ultima volta.<\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:6px;background:var(--color-neutral-100);border-radius:16px;padding:12px\"><b style=\"font-size:13.5px\">Aggiungi una tua domanda<\u002Fb><input value=\"{{ p9.quiz.dq }}\" sc-camel-on-change=\"{{ p9.quiz.setQ }}\" placeholder=\"Domanda\" style=\"font:inherit;font-size:14px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--color-neutral-300);background:#fff;color:#201e1d;width:100%;box-sizing:border-box\"><textarea value=\"{{ p9.quiz.da }}\" sc-camel-on-change=\"{{ p9.quiz.setA }}\" placeholder=\"Risposta (facoltativa)\" rows=\"2\" style=\"font:inherit;font-size:14px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--color-neutral-300);background:#fff;color:#201e1d;width:100%;box-sizing:border-box;resize:vertical\"><\u002Ftextarea><button sc-camel-on-click=\"{{ p9.quiz.add }}\" style=\"border:0;curso  p9.fc.sapevo }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">La sapevo<\u002Fbutton><button sc-camel-on-click=\"{{ p9.fc.next }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">›<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p9.tab.is_mt }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Trascina un concetto sulla sua definizione, oppure tocca il concetto e poi la definizione. {{ p9.mt.stato }}<\u002Fspan><button sc-camel-on-click=\"{{ p9.mt.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Rifai<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><sc-for list=\"{{ p9.mt.left }}\" as=\"l\" hint-placeholder-count=\"6\"><div draggable=\"true\" sc-camel-on-drag-start=\"{{ l.dragStart }}\" sc-camel-on-click=\"{{ l.pick }}\" style=\"cursor:grab;user-select:none;border-radius:14px;min-height:44px;padding:9px 12px;font-weight:700;font-size:13.5px;display:flex;align-items:center;background:{{ l.bg }};color:{{ l.fg }}\">{{ l.mark }}{{ l.txt }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><sc-for list=\"{{ p9.mt.right }}\" as=\"r\" hint-placeholder-count=\"6\"><div sc-cam nter;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Incerta<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p9.rip2 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">Ricordo<\u002Fbutton>\n      <\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <span style=\"margin-left:auto;font-weight:700;color:var(--color-accent-2-800)\">+{{ p9.xp }} XP<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n\n<section id=\"formulario\" data-screen-label=\"Formulario KPI\" style=\"background:var(--color-neutral-900);color:var(--color-neutral-100);border-radius:var(--radius-md);padding:clamp(16px,4vw,36px);display:flex;flex-direction:column;gap:16px\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px\"><div style=\"font-family:ui-monospace,Menlo,monospace;font-size:70px;line-height:.9;color:var(--color-accent-2-300)\">ƒ<\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-size:clamp(25px,6vw,40px);margin:0;color:#fff;flex:1 1 240px\">Formulario KPI della loyalty<\u002Fh2><a href=\"#indice\" style=\"font-size:12px;font-weight:700;color:var(--color-accent-2-300)\">↑ indice<\u002Fa><\u002Fdiv>\n  <div style=\"font-size:13px;color:var(--color-neutral-300)\">Il libro elenca i KPI (cap. 2, p. 32; cap. 8) senza formule: qui le definizioni standard da usare all'esame.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6\">\n    <div style=\"background:rgba(255,255,255,.07);border-radius:14px;padding:12px\">Retention rate = (clienti fine − nuovi) / clienti inizio<br>Churn rate = clienti persi / clienti inizio = 1 − retention<\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border-radius:14px;padding:12px\">Repeat purchase rate = clienti con ≥ 2 acquisti / clienti<br>Purchase frequency = ordini / clienti<\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border-radius:14px;padding:12px\">CLV ≈ margine per acquisto × frequenza × durata − costi di acquisizione e retention<\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border-radius:14px;padding:12px\">Redemption rate = punti riscattati / punti emessi<br>Valore del punto = valore del premio / punti richiesti (es. 100 $ / 2.500 = 4 cent)<\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border-radius:14px;padding:12px\">Active engagement rate = membri attivi / iscritti<br>Tasso di attivazione = attivi / registrati (es. 1.095 / 1.611 = 68%)<\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border-radius:14px;padding:12px\">Uplift = (trattato − controllo) / controllo<br>Conversione digitale→negozio = redeemer che comprano / redeemer<\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border-radius:14px;padding:12px\">NPS = % promotori (9–10) − % detrattori (0–6)<br>CTR = click / aperture (o invii) · Open rate = aperture / invii<\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border-radius:14px;padding:12px\">Valore d'impresa W = R / i: la fiducia alza R e abbassa i (cap. 1)<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showSolutions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Studio&quot;},&quot;showMkt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Studio&quot;}}\">\nconst KEY = \"dl-mappe\";\nconst TITOLI = {1:\"Omni-channel marketing: il cliente al centro\",2:\"La grande trasformazione del retail\",3:\"Touchpoint digitali per la loyalty\",4:\"Gli enabl > c.ripDue),\n      sync: this.state.sync,\n      piano: this.piano(),\n      tm: this.vistaTM(), s6: this.vistaS6(), s10: this.vistaS10(), s11: this.vistaS11(),\n      modoStudio: (this.state.data.mode || \"studio\") === \"studio\", modoRipasso: this.state.data.mode === \"ripasso\",\n      modoS: (this.state.data.mode || \"studio\") === \"studio\" ? { bg: \"var(--color-neutral-900)\", fg: \"#fff\" } : { bg: \"transparent\", fg: \"var(--color-neutral-900)\" },\n      modoR: this.state.data.mode === \"ripasso\" ? { bg: \"var(--color-neutral-900)\", fg: \"#fff\" } : { bg: \"transparent\", fg: \"var(--color-neutral-900)\" },\n      setStudio: () => this.salva({ ...this.state.data, mode: \"studio\" }), setRipasso: () => this.salva({ ...this.state.data, mode: \"ripasso\" }),\n      esDovuti: caps.filter(c => c.exDue), hasEsDovuti: caps.some(c => c.exDue),\n      wide: this.state.wide, narrow: !this.state.wide,\n      bridgeCols: this.state.wide ? \"minmax(0,.8fr) minmax(0,1.6fr) minmax(0,.8fr)\" : \"minmax(0,1fr)\",\n      gtmHref: (typeof location !== \"undefined\" && /\\.dc\\.html/.test(location.pathname)) ? \"Mappe Go to Market.dc.html\" : \"mappe-gtm.html\",\n      cycleWide: !!this.state.cycleWide, cycleNarrow: !this.state.cycleWide,\n      mosaicCols: this.state.wide ? \"repeat(4,minmax(0,1fr))\" : \"minmax(0,1fr)\",\n      span1: this.state.wide ? \"span 1\" : \"1/-1\", span2: this.state.wide ? \"span 2\" : \"1/-1\",\n      span3: this.state.wide ? \"span 3\" : \"1/-1\", span4: this.state.wide ? \"span 4\" : \"1/-1\",\n      mirrorCols: this.state.wide ? \"minmax(0,1fr) 150px minmax(0,1fr)\" : \"minmax(0,1fr)\",\n      cap2Cols: this.state.wide ? \"260px minmax(0,1fr)\" : \"minmax(0,1fr)\",\n      cap2Pad: this.state.wide ? \"32px 32px 32px 0\" : \"20px 14px\",\n      esporta: () => {\n        const b = new Blob([JSON.stringify(this.state.data, null, 2)], { type: \"application/json\" });\n        const a = document.createElement(\"a\"); a.href = URL.createObjectUR

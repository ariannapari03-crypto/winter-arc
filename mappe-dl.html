 frasi\">« 10<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p6.audio.back }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase precedente\">‹<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p6.audio.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-500);color:#fff;padding:8px 20px\">{{ p6.audio.label }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p6.audio.fwd }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase successiva\">›<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p6.audio.fwd10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Avanti di 10 frasi\">10 »<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p6.audio.cycleRate }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">{{ p6.audio.rateLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p6.audio.restart }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:transparent;color:var(--color-neutral-700)\">Dall'inizio<\u002Fbutton>\n        <span style=\"margin-left:auto;font-size:12.5px;color:var(--color-neutral-700)\">frase {{ p6.audio.pos }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden\"><div style=\"height:100%;width:{{ p6.audio.pct }};background:var(--color-accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p6.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p6.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  \n  <div style=\"background:rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> Sono i <b>risultati<\u002Fb> delle 40 interviste del cap. 5 e seguono le <b>stesse 4 sezioni<\u002Fb> del questionario: ① dal cartaceo al digitale, ② fiducia lungo il customer journey, ③ dati e analisi predittive, ④ nuove frontiere. Si chiude con i <b>5 cluster<\u002Fb> di conclusioni. La mappa è un <b>fumetto<\u002Fb>: quattro vignette (le sezioni) e un finale. Per ogni vignetta ricorda cosa è cambiato, cosa funziona e cosa frena.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Vignetta 1 · Dal cartaceo al digitale: chi è dove<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 71–73<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Tutti stanno digitalizzando la loyalty, ma a velocità diverse: cooperative e farmacie restano ibride, discount e non grocery sono già digitali.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">passaggio graduale nell'ultimo decennio<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">cooperative: strategia duale soci/non soci, inclusività, prestito sociale digitale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">discount nativi digitali (l'app è il programma)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">«convergenza digitale»: l'app contenitore unico<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">non grocery: membership e ghost loyalty<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">farmacie più indietro: QR per iscriversi, CRM con coupon<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Passaggio consolidato nell'ultimo decennio e <b>graduale<\u002Fb>: i primi tentativi di sostituire i punti cartacei non sempre sono riusciti. Oggi anche molte short collection si raccolgono in app.<\u002Fdiv>\n      <div><b>Cooperative<\u002Fb>: campagne CRM «distrettuali» per i <b>soci<\u002Fb>, short collection ancora fisiche per i <b>non soci<\u002Fb>. Spesso ancora cartaceo, per il target e per il rapporto in negozio. Il digitale è <b>complementare<\u002Fb>, per <b>inclusività<\u002Fb>: strategia «<b>duale<\u002Fb>» secondo l'età dei clienti; es. il libretto del prestito sociale digitalizzato solo per chi lo vuole.<\u002Fdiv>\n      <div><b>Discount<\u002Fb>: nativi digitali, «il nostro programma è un'app»; iscrizione solo in app. <b>Convergenza digitale<\u002Fb>: l'app diventa il contenitore unico di punti, coupon, «Prenota e Ritira», mobile scanning, sommelier digitale, gamification, pagamento. Newsletter, push e social informano; la fruizione avviene solo in app.<\u002Fdiv>\n      <div><b>Non grocery<\u002Fb>: digitale avanzato, si passa alla <b>membership<\u002Fb> (una «ghost loyalty»: senza membership non si usa né app né e-commerce). <b>Farmacie<\u002Fb>: più indietro, tessera fisica prevalente; QR per l'iscrizione e CRM con coupon a chi spende meno o compra di rado.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Vignetta 1 · Strumenti, integrazione, ostacoli<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 73–76 · Fig. 6.1<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il digitale si somma al cartaceo; porta personalizzazione e risparmio ma chiede formazione, assistenza e investimenti.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">app, social, e-mail, SMS, WhatsApp<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">WhatsApp integrato nel CRM<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">carta smaterializzata ma supporto fisico mantenuto<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">integrazione, non sostituzione<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">volantino cartaceo ancora forte<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">logica omnichannel dal target<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">vantaggi: personalizzazione, costi, dati, ROI, immagine giovane, sostenibilità<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">svantaggi: anziani, short collection, carico assistenza, capi area, investimenti<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Strumenti<\u002Fb>: app (spesso «sintesi» di tutto, anche per la gamification), campagne social, e-mail, SMS, <b>WhatsApp<\u002Fb> (immediato) integrato nel <b>CRM<\u002Fb> per coerenza tra touchpoint. Tutti hanno smaterializzato la tessera, mantenendo il supporto fisico per chi vuole una transizione meno radicale.<\u002Fdiv>\n      <div><b>Integrazione o separazione?<\u002Fb> Integrazione: il digitale non ha sostituito il cartaceo. Il <b>volantino<\u002Fb> cartaceo resta rilevante; il bollino digitale nelle short collection non sempre piace. La logica è omnichannel: si parte dal <b>target e dagli obiettivi<\u002Fb>, poi si declina su ogni canale (sottocosto su volantino e social; offerte personalizzate in app).<\u002Fdiv>\n      <div><b>Fattori abilitanti<\u002Fb>: promozioni personalizzate, meno costi di tessere, carta e iscrizioni. <b>Ostacoli<\u002Fb>: clientela anziana (silver economy), resistenze nelle short collection più che nella raccolta punti, più <b>carico di assistenza<\u002Fb> per errori di registrazione, ruolo decisivo dei <b>capi area<\u002Fb> verso la rete. Il digitale è <b>strumento, non fine<\u002Fb>: semplice, veloce, coerente.<\u002Fdiv>\n      <div><b>Vantaggi<\u002Fb>: conoscenza del cliente, meno costi di stampa e distribuzione, comunicazione tempestiva, controllo del ROI, immagine più giovane, sostenibilità; supera il <b>trade-off efficienza/efficacia<\u002Fb>. <b>Svantaggi<\u002Fb>: curva di apprendimento di clienti e personale, investimenti notevoli (anche il digitale costa).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Vignetta 2 · Il digitale lungo il customer journey<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 77–80 · Fig. 6.2<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Prima dell'acquisto il digitale attira e porta in negozio, durante semplifica, dopo raccoglie feedback e tiene viva la relazione.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">pre-purchase: SMS, e-mail, volantino digitale, WhatsApp, drive to store, quiz e instant win, clienti digitali di maggior valore, consenso al dato<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">purchase: semplificare, meno code, gamification e geolocalizzazione, coupon e push, cross-selling, etichette elettroniche, QR, connected TV, catalogo premi in app<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">post-purchase: assistenza ancora umana, customer care, feedback, raccomandazioni, ricette, reminder, community<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px\"><b>Pre-purchase<\u002Fb>: SMS ed e-mail + volantino digitale e WhatsApp. Lo smartphone è centrale; il digitale allunga la relazione fuori dal negozio e fa «<b>drive to store<\u002Fb>» (sconti, quiz settimanali sui social, concorsi, instant win). Allarga la base clienti e la conoscenza: i <b>clienti digitali valgono di più<\u002Fb> per frequenza e spesa. Criticità: il <b>consenso<\u002Fb> all'uso dei dati.<\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px\"><b>Purchase<\u002Fb>: <b>semplificare<\u002Fb> e ridurre le frizioni (tempo in cassa); app usabile. Gamification e geolocalizzazione per coinvolgere; coupon personalizzati, push sui prodotti sponsor, punti extra, promo in tempo reale, cross-selling. <b>Etichette elettroniche e QR<\u002Fb> per prezzi aggiornati e fiducia; connected TV in negozio; catalogo premi e saldo punti in app.<\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px\"><b>Post-purchase<\u002Fb>: l'<b>assistenza resta umana<\u002Fb> (digitale più veloce ma più generico); prime sperimentazioni sulle richieste frequenti; customer service → customer care. Il digitale aiuta con <b>feedback e sondaggi<\u002Fb>, <b>raccomandazioni<\u002Fb> e ricette sugli acquisti, <b>reminder<\u002Fb> (scadenza punti, premi, status), community.<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap2\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 2:<\u002Fb> Le tre fasi pre, durante e dopo l'acquisto del processo d'acquisto dello shopper.<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Vignetta 2 · Fiducia: dove il digitale la rafforza<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 80–85 · Tab. 6.1<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il digitale rafforza soprattutto la fiducia nel personale, nella marca commerciale e nei valori dell'insegna, ma non sostituisce il rapporto umano.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fiducia = condizione necessaria non sufficiente<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">coerenza tra dire e fare<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">«fidarsi = risolvere un mio bisogno»<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Covid e inflazione rafforzano trust-PL<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">trasparenza e rapporto umano<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Tab. 6.1: personale 8, prodotto di marca 7, valori 6<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">QR sulla filiera<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">difficile fiducia a 360°<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">privacy concern ↔ fiducia (relazione inversa)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">disservizi tecnici<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>La fiducia è condizione <b>necessaria ma non sempre sufficiente<\u002Fb> per una loyalty stabile: il riacquisto da solo non prova la fedeltà. Per i manager fiducia significa <b>coerenza tra dire e fare<\u002Fb>, non prendere in giro il cliente, «risolvere un mio bisogno». Il legame trust-loyalty si è rafforzato con <b>Covid e inflazione<\u002Fb>, soprattutto sulla <b>marca commerciale<\u002Fb>. Si basa su trasparenza e rapporto umano. I touchpoint digitali (siti, app istituzionali, newsletter) creano trasparenza; la comunicazione deve essere coerente (troppi canali locali nelle cooperative sono un minus).<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:6px;text-align:center\">\n        <div style=\"background:#fff;color:var(--color-accent-800);border-radius:12px;padding:8px\"><b style=\"font-size:22px\">8<\u002Fb><br><span style=\"font-size:12px\">fiducia nel personale<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;color:var(--color-accent-800);border-radius:12px;padding:8px\"><b style=\"font-size:22px\">7<\u002Fb><br><span style=\"font-size:12px\">nel prodotto di marca<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;color:var(--color-accent-800);border-radius:12px;padding:8px\"><b style=\"font-size:22px\">6<\u002Fb><br><span style=\"font-size:12px\">nei valori trasmessi<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px\">Poi: a 360° (3), con il consumatore grazie a una comunicazione continua (3), in certe categorie come fresco e gastronomia (2), in un certo store (2), nell'insegna (1).<\u002Fdiv>\n      <div><b>Personale<\u002Fb>: il digitale supporta ma non sostituisce; non deve spersonalizzare. <b>Marca commerciale<\u002Fb>: QR con origine delle materie prime e filiera (bio, fair trade); «una promessa mantenuta crea una fiducia immensa». <b>Categorie<\u002Fb>: informazioni sui freschi ampliano il portafoglio del cliente nell'insegna. La fiducia nel personale diventa fiducia nello <b>store<\u002Fb>, difficile estenderla all'intera insegna. Il <b>cliente digitalizzato è più fedele<\u002Fb>.<\u002Fdiv>\n      <div><b>Sfiducia<\u002Fb>: dati e privacy; relazione <b>inversa<\u002Fb> tra privacy concern e fiducia; timore che i dati finiscano ad altri (spam), richiesta di più regole. E disservizi tecnici, soprattutto all'inizio. Nelle farmacie fiducia e sfiducia passano dal <b>farmacista<\u002Fb>.<\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap5\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 5:<\u002Fb> Fiducia, antecedenti e circolarità con la soddisfazione: qui vista nel rapporto insegna-cliente.<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Vignetta 2 · Store loyalty o brand loyalty?<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 85–86<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">L'app rafforza insieme la fedeltà all'insegna e alle marche: il digitale crea valore per industria, distribuzione e cliente.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">grocery: loyalty nata contro la brand loyalty industriale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">il digitale rafforza entrambe<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">«non è la digitalizzazione a creare squilibri, ma come la usi»<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">app = brand + store<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">win-win-win<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">farmacie: tasso di ritorno ↑, tempo tra visite ↓, clienti che concentrano gli acquisti<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Nel grocery la loyalty è nata per contrastare la <b>brand loyalty<\u002Fb> verso le marche industriali rafforzando la <b>store loyalty<\u002Fb> (Castaldo 2024). Oggi i manager vedono nel digitale la possibilità di rafforzarle <b>entrambe<\u002Fb>: convivono shopper con la lista scritta a mano e shopper digitali. «Non è la digitalizzazione a creare squilibri ma <b>come la utilizzi<\u002Fb>».<\u002Fdiv>\n      <div>L'app esprime brand loyalty ma lavora anche sul punto vendita → sinergie <b>win-win-win<\u002Fb> tra industria, distribuzione e consumatore, da dosare con equilibrio. <b>Farmacie<\u002Fb>: il digitale ha aumentato il <b>tasso di ritorno<\u002Fb> e ridotto il tempo tra le visite; i clienti solidi concentrano tutti gli acquisti, prescrizioni comprese, in una sola farmacia.<\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap3\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 3:<\u002Fb> Store loyalty contro brand loyalty e ruolo della marca commerciale.<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Vignetta 3 · Dati, decisioni, previsioni<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 86–88<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">I dati digitali guidano già scelte concrete, ma la capacità predittiva è ancora limitata da consenso, competenze e cultura.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">«la loyalty è la strategia»<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">customer centricity<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">dati della carta → cluster e retention<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">dati dei non possessori → acquisition<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">geomarketing per nuove aperture<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">KPI digitali poco usati<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">«troppa informazione rischia di disinformare»<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">casi: scelta prodotti delle collection, monitoraggio PL, recupero inattivi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AI e ML in valutazione<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">consenso<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">cultura data-driven<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Dalla ricerca 2024: «la loyalty <b>è<\u002Fb> la strategia» per i retailer. Il digitale aumenta i dati e la <b>customer centricity<\u002Fb>. Dati della <b>carta fedeltà<\u002Fb> → cluster di clienti e azioni di <b>retention<\u002Fb>; dati di chi non ha la carta → <b>acquisition<\u002Fb> (volantini, short collection); dati di <b>geomarketing<\u002Fb> per pianificare aperture. I KPI di digital marketing sono studiati ma poco sfruttati: «troppa informazione rischia di disinformare».<\u002Fdiv>\n      <div><b>Casi concreti<\u002Fb>: scegliere i prodotti delle prossime <b>collection<\u002Fb> dai comportamenti d'acquisto; misurare il successo delle referenze <b>private label<\u002Fb> con acquisto e riacquisto (correlati a promo, packaging, scaffale); CRM per segmenti, es. <b>recupero dei clienti inattivi<\u002Fb>.<\u002Fdiv>\n      <div><b>Previsione<\u002Fb>: la loyalty è solo una parte del journey; il digitale è un mezzo per conoscere il target. AI e machine learning per personalizzare e prevedere, e agenti intelligenti per leggere i dati, ma ancora in <b>valutazione<\u002Fb>. Limiti: quantità di dati legata al <b>consenso<\u002Fb>, sistemi per far circolare le analisi in fretta, bisogno di una <b>cultura data-driven<\u002Fb>.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Vignetta 4 · Nuove frontiere<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 88–93 · Tab. 6.2<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">AI, gioco, retail media e app sono il futuro della loyalty, se integrati nella strategia e senza perdere il rapporto umano.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AI: customer care e raccomandazioni 7, semplificazione e automazione 7, analisi dati 6, supply chain 3, personalizzazione 3, contenuti 2<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">rischi: etica, GDPR, paura di sostituire il lavoro<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">gamification: engagement 3, community 2, cross-generazionale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">retail media: schermi, totem, vetrine, digital signage<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">app: da utilitaristica a love brand<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fisico + digitale insieme<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">loyalty = marketing<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>AI<\u002Fb> (Tab. 6.2): customer care e raccomandazioni (<b>7<\u002Fb>), semplificazione e automazione dei processi (<b>7<\u002Fb>), apprendimento e analisi dati (<b>6<\u002Fb>), supply chain: scorte, riordino, prezzi (3), personalizzazione (3), creazione di contenuti (2), comunicazione one-to-one (1). Compensa la carenza di personale ed è un fattore competitivo se integrata nella strategia. Rischi: <b>etica e GDPR<\u002Fb>, paura che <b>sostituisca il lavoro<\u002Fb> → formazione e condivisione interna; il rapporto umano con il cliente resta cruciale.<\u002Fdiv>\n      <div><b>Gamification<\u002Fb>: engagement (3), community (2); piace a tutte le generazioni; anche giochi semplici danno ottimi risultati; meglio se integrata in app e unita al fisico.<\u002Fdiv>\n      <div><b>Retail media<\u002Fb> (2): spazi pubblicitari digitali (banner in app e sito, push, contenuti brandizzati) e fisici (totem, schermi, scaffali intelligenti, scontrini, POS); il <b>digital signage<\u002Fb> è molto efficace.<\u002Fdiv>\n      <div><b>App<\u002Fb>: da strumento utilitaristico a <b>love brand<\u002Fb> e customer centricity, profilazione dinamica col consenso; un vero ecosistema.<\u002Fdiv>\n      <div><b>Prospettive<\u002Fb>: tecnologie coerenti con la strategia; «la coesistenza di tutti e due i mondi è la ricetta per il successo»; comunicazione sempre più one-to-one (WhatsApp, target su Meta); la <b>loyalty diventa marketing<\u002Fb> e comunicazione.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:var(--color-accent-2-100);color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;border:2px solid var(--color-accent-2-500);\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Finale · I 5 cluster di conclusioni<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 93–95 · Fig. 6.3<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">La loyalty del futuro è una relazione coerente con i valori, alimentata da omnicanalità, tecnologia e dati, che restano mezzi.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">1 omnicanalità come imperativo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">2 digitale mezzo, non fine<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">3 innovare i programmi: da tattica a pilastro strategico<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">4 personalizzazione e centralità del dato<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">5 dalla transazione alla relazione<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">nuove generazioni come motore<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px\">\n        <li><b>Omnicanalità come imperativo<\u002Fb>: fisico e digitale complementari che si rafforzano; ostacoli generazionali e culturali interni.<\u002Fli>\n        <li><b>Digitalizzazione come mezzo, non fine<\u002Fb>: conta il contenuto, coerente con valori e posizionamento; senza eccedere con comunicazioni invadenti.<\u002Fli>\n        <li><b>Innovare i programmi<\u002Fb>: oltre punti e catalogo premi, da tattica a <b>pilastro strategico<\u002Fb> contro il nomadismo; non più affare di un solo team.<\u002Fli>\n        <li><b>Personalizzazione e centralità del dato<\u002Fb>: profilazione, analisi predittiva, cluster dinamici → iper-personalizzazione, con etica e competenze.<\u002Fli>\n        <li><b>Dalla transazione alla relazione<\u002Fb>: relazioni autentiche, coerenti, valoriali; app, AI e gamification devono mantenere le promesse (sostenibilità, inclusione).<\u002Fli>\n      <\u002Fol>\n      <div><b>Sintesi<\u002Fb>: superare i modelli tradizionali → relazione coerente con la strategia → alimentata da omnicanalità, tecnologie e dati → la tecnologia è abilitatore, non fine → le <b>nuove generazioni<\u002Fb> spingono la trasformazione.<\u002Fdiv>\n      <div style=\"border:2px dashed var(--color-neutral-400);border-radius:14px;padding:8px 11px;font-size:13px\"><b>Per ricordare ·<\u002Fb> O-M-I-P-R: Omnicanalità, Mezzo, Innovazione, Personalizzazione, Relazione.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\"><b style=\"font-family:var(--font-heading);font-size:21px\">Allenati sul capitolo 6<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Ogni risposta conta in Winter Arc<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ p6.tab.tabs }}\" as=\"tb\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border-radius:999px;min-height:38px;padding:6px 14px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <sc-if value=\"{{ p6.tab.is_mc }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Clicca la risposta: la correzione è immediata. {{ p6.mc.punteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p6.mc.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Rifai<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p6.mc.items }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--color-neutral-200);padding-top:10px\">\n        <div style=\"font-weight:700\">{{ m.num }}. {{ m.q }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px\"><sc-for list=\"{{ m.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ ansparent;color:var(--color-neutral-700)\">Dall'inizio<\u002Fbutton>\n        <span style=\"margin-left:auto;font-size:12.5px;color:var(--color-neutral-700)\">frase {{ p7.audio.pos }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden\"><div style=\"height:100%;width:{{ p7.audio.pct }};background:var(--color-accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p7.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p7.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> Quasi tutti i programmi usano gli stessi touchpoint (app, sito, gioco, social), quindi i touchpoint non bastano a distinguerli. I casi sono raggruppati per <b>obiettivo strategico<\u002Fb> e letti lungo il <b>funnel<\u002Fb> con quattro driver: <b>attrattività, retention, customer experience, referral<\u002Fb>. La mappa è un <b>album di figurine<\u002Fb>: sette pagine (una per obiettivo), due figurine per pagina. Per ogni caso ricorda: <b>obiettivo → meccanica distintiva → driver<\u002Fb>.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;font-size:13px\">\n    <div style=\"background:var(--color-accent-500);color:#fff;border-radius:14px;padding:9px 12px\"><b>Attrarre<\u002Fb> prospect e clienti labili verso la brand community<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-600);color:#fff;border-radius:14px;padding:9px 12px\"><b>Trattenere<\u002Fb>: relazione più assidua e consistente<\u002Fdiv>\n    <div style=\"background:var(--color-accent-300);color:#201e1d;border-radius:14px;padding:9px 12px\"><b>Allargare<\u002Fb> la base con l'«apostolato» dei clienti (referral)<\u002Fdiv>\n    <div style=\"background:var(--color-neutral-900);color:#fff;border-radius:14px;padding:9px 12px\"><b>Deliziare<\u002Fb> con vantaggi, servizi, contenuti su misura<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px;color:var(--color-neutral-700)\">Beneficio implicito di tutti i casi: <b>sostenibilità<\u002Fb> economica e ambientale della digitalizzazione (niente carta, bollini, spedizioni, inserimento manuale dei dati). Ultimo obiettivo: rafforzare il rapporto <b>industria-distribuzione<\u002Fb> (p. 96).<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Pagina 1 · Innovazione come posizionamento: Bennet NFT Club<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 97<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Bennet usa NFT e metaverso per essere vista come l'insegna più innovativa dai clienti più giovani.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">blockchain e NFT<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">2 mln soci Bennet Club<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">millennial e clienti «antenna»<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">3 collezioni, 2.700 NFT dalle shopping bag IED<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">caccia al tesoro nel metaverso (dic. 2023)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">premi unici<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Lanciato nel 2023 per gli oltre <b>2 milioni<\u002Fb> di soci Bennet Club (poi aperto anche ai non soci), per attrarre appassionati di tecnologia, <b>millennial<\u002Fb> e clienti <b>«antenna»<\u002Fb> che anticipano i trend. Tre collezioni, <b>2.700 NFT<\u002Fb> (sold out) ispirati alle shopping bag disegnate con IED; a dicembre 2023 una <b>caccia al tesoro nel metaverso<\u002Fb> con avatar per vincere buoni sconto.<\u002Fdiv>\n      <div><b>Driver<\u002Fb>: attrattività (base digitalizzata, NFT, metaverso) · retention (premi unici) · experience (alto ingaggio virtuale) · referral (invito gamificato).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Pagina 2 · Cura della relazione: LuisaViaRoma, Spotify, OVS<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 98–100<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Premiare l'interazione (non solo l'acquisto) e restituire al cliente la sua storia crea relazione e passaparola.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">LVR Privilege: punti anche senza acquisto, missioni, badge, livelli Bronze-Silver-Gold, referral<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Spotify Wrapped: dati reali raccontati, autenticità, +21% download 2020, Contagious (Berger)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Esselunga EsseLover Year<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">OVS Friends: 1 mln utenti, «cuori», tier, RFM, personal shopper, riciclo, retargeting<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>LuisaViaRoma · LVR Privilege<\u002Fb> (luxury e-retailer): punti anche <b>senza acquisti<\u002Fb> (vedere prodotti, wishlist, quiz, sfide, social); gamification spinta (missioni a tempo, badge, livelli <b>Bronze, Silver, Gold<\u002Fb>, premi esperienziali come sfilate); <b>referral virale<\u002Fb> con punti quando l'amico fa il primo acquisto; dati granulari per retargeting.<\u002Fdiv>\n      <div><b>Spotify · Wrapped<\u002Fb>: algoritmi e embedding per i suggerimenti, e ogni dicembre un <b>racconto personalizzato<\u002Fb> dell'anno di ascolto, da condividere. Comunica <b>autenticità<\u002Fb> (Morhart 2015) perché basato su dati reali e unico per ogni utente → <b>brand stickiness<\u002Fb>. Nel 2020 circa <b>+21% di download<\u002Fb> grazie ai contenuti condivisi: un dato oggettivo che fa apparire bene si condivide (Berger, <i>Contagious<\u002Fi>). Imitato da <b>Esselunga<\u002Fb> con «Your EsseLover Year» (2024).<\u002Fdiv>\n      <div><b>OVS Friends<\u002Fb>: oltre <b>1 milione<\u002Fb> di utenti; app al centro (saldo, promo geolocalizzate, push). Punti «<b>cuori<\u002Fb>» per euro speso e per interazioni (personal shopper digitale, sfide, <b>riciclo abiti<\u002Fb>); tier crescenti; codici sconto da modelli predittivi <b>RFM<\u002Fb> (recency, frequency, monetary); premi Wellness, Food, Fun, Travel, Home, Charity; retargeting su carrello abbandonato; outfit suggeriti per alzare lo scontrino.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"> rap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Sephora Beauty Insider: forum, prosumer, premi a tempo, moltiplicatori per 4 tier, Rewards Bazaar, Rouge Reward 2.500 punti = 100 $<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Veralab: sincerità, punti «Fagiana», punti per azioni non transazionali, CRM, eventi (Beauty Truck, Sagra Fagiana), Estetista Cinica<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Sephora · Beauty Insider<\u002Fb> (USA e Canada): community con forum dove i membri si scambiano consigli → l'insegna raccoglie opinioni per prodotti, servizi e conversione. Essere «insider» è già un premio (<b>prosumer<\u002Fb>). Premi personalizzati <b>«a tempo»<\u002Fb> che spingono ad aprire l'app; <b>moltiplicatori<\u002Fb> di punti diversi per i <b>4 tier<\u002Fb>; <b>Rewards Bazaar<\u002Fb> per riscattare campioni; i membri Rouge scambiano <b>2.500 punti con 100 $<\u002Fb> di sconto.<\u002Fdiv>\n      <div><b>Veralab<\u002Fb>: brand della <b>sincerità<\u002Fb>, divulgazione scientifica con ironia. Punti «<b>Fagiana<\u002Fb>» per acquisti e per azioni non transazionali (newsletter, sondaggi, recensioni); CRM con e-mail su compleanno, carrello abbandonato, prodotto preferito tornato; campioncini a scelta; eventi phygital (<b>Beauty Truck, Sagra Fagiana<\u002Fb>, gratta e vinci in negozio); referral organico attorno alla fondatrice (l'<b>Estetista Cinica<\u002Fb>, Cristina Fugazzi).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-be ;padding:3px 10px;font-size:12.5px\">«ritorna entro 5 giorni»<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">premi last minute<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">giochi da TV<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Risparmio Casa<\u002Fb>: UX minimalista, obiettivo <b>frequenza<\u002Fb> d'acquisto più che scontrino medio. Raccolta 100% digitale (scansione dello scontrino o <b>QR<\u002Fb> alla cassa); notifiche e giochi su <b>WhatsApp, Telegram, TikTok<\u002Fb>; gratta e vinci virtuali, sfide, concorsi come FantaSanremo e «Premia la tua spesa».<\u002Fdiv>\n      <div><b>PiùMe<\u002Fb> (IperSoap e altre insegne): CRM che divide i clienti in <b>cluster giornalieri, settimanali, mensili<\u002Fb> con incentivi dedicati (<span style=\"color:var(--color-accent-800);font-weight:700\">es.<\u002Fspan> «Ritorna entro 5 giorni, ottieni 10% extra»); al raggiungimento dei punti uno sconto in valore assoluto, anche pari all'intera spesa; premi <b>«last minute»<\u002Fb> solo in app; giochi ispirati alla TV (memory, ruota della fortuna). Community quasi assente: premialità di <b>convenienza<\u002Fb>.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Pagina 6 · Divertimento e gaming: Roadhouse, Old Wild West<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span \u002Fb> («cowboy estivo», «sceriffo d'autunno»); sfide con countdown (<b>3 visite in 10 giorni = panino omaggio<\u002Fb>); concorsi («Disegna il tuo burger»); referral con incentivi raddoppiati a Halloween e Natale.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-700)\">Pagina 7 · Partnership industria-distribuzione: Nike, Samsung<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 107–108<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Brand e distributore gestiscono insieme il programma: il cliente ha vantaggi, il retailer lo coccola, il brand viene preferito e tutti ottengono dati.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">win-win-win<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Nike Membership collegata a Zalando e JD Sports (test con Dick's)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">prodotti esclusivi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">dati condivisi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Prisma di Kapferer<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Samsung Rewards + MediaWorld Club<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Samsung Days<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">3,2 mln carte attive, engagement 33%, +5% attivi al mese<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">destination platform, gaming room<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Nike con Zalando e JD Sports<\u002Fb>: si collega l'account <b>Nike Membership<\u002Fb> a quello del retailer → prodotti esclusivi e notifiche anticipate; Nike ottiene dati sugli acquisti, condivisi con i partner. Testato prima negli USA con Dick's Sporting Goods. Ricordare gli acquisti rafforza la relazione (<b>Prisma della marca<\u002Fb> di Kapferer: relazione, riflesso, rappresentazione). Metriche: sentiment ed engagement.<\u002Fdiv>\n      <div><b>Samsung Rewards con MediaWorld Club<\u002Fb>: serve essere socio MediaWorld e avere un account Samsung → sconti nei <b>Samsung Days<\u002Fb>, punti su entrambi i programmi, regali di compleanno, reso più lungo. MediaWorld Club 2025 passa dal premiare l'acquisto al premiare l'<b>engagement<\u002Fb>: <b>3,2 milioni<\u002Fb> di carte attive (almeno un acquisto in 12 mesi), coinvolgimento medio <b>33%<\u002Fb>, <b>+5%<\u002F int<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">da transazionale a relazionale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">beauty e fashion = community<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">drugstore = semplicità e convenienza<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">ristorazione = gaming<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">da verificare: conoscenza, cambiamento dei comportamenti, trust<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Quasi tutti gli attori presidiano gran parte dei touchpoint: il digitale crea un <b>ecosistema<\u002Fb> attorno al programma. L'analisi è osservazionale (senza dati di redemption), ma il passaggio da logiche <b>transazionali a relazionali<\u002Fb> è in corso.<\u002Fdiv>\n      <div><b>Per settore<\u002Fb>: beauty e fashion → <b>community<\u002Fb> · drugstore → <b>semplicità e convenienza<\u002Fb>, community quasi assente · ristorazione → <b>gaming<\u002Fb> per un pubblico giovane.<\u002Fdiv>\n      <div><b>Da verificare in futuro<\u002Fb>: quanto le funzioni sono conosciute e apprezzate, quanto cambiano i comportamenti e quanto aumentano percezione del brand e <b>trust<\u002Fb>.<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85;opacity:1\">LEGGI · Tabella riepilogativa, p. 108–109<\u002Fspan><span>Settore, obiettivo e touchpoint di o

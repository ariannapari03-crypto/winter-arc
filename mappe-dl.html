  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: :1.25\">Formulario KPI<\u002Fspan><span style=\"font-size:11px;opacity:.85\">tutte le formule<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n  <div id=\"avanzamento\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <div style=\"background:var(--color-accent-2-700);color:#fff;border-radius:var(--radius-lg);padding:20px 22px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\"><b style=\"font-family:var(--font-heading);font-size:22px\">Avanzamento<\u002Fb><span style=\"font-size:11.5px;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px\">{{ sync }}<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:56px;line-height:1\">{{ totPct }}<\u002Fdiv>\n      <div style=\"height:10px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden\"><div style=\"height:100%;width:{{ totPct }};background:var(--color-accent-300);border-radius:999px\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px;font-size:12px\">\n        <div><b style=\"font-size:18px\">{{ totStudiati }}<\u002Fb>/11<br>capitoli<\u002Fdiv>\n        <div><b style=\"font-size:18px\">{{ totMin }}<\u002Fb><br>minuti<\u002Fdiv>\n        <div><b style=\"font-size:18px\">{{ totQuiz }}<\u002Fb><br>quiz giusti<\u002Fdiv>\n        <div><b style=\"font-size:18px\">{{ totXp }}<\u002Fb><br>XP<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasDovuti }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.12);border-radius:16px;padding:10px 12px;font-size:12.5px\">\n        <b>Ripassi di oggi<\u002Fb>\n        <sc-for list=\"{{ dovuti }}\" as=\"d\" hint-placeholder-count=\"1\"><a href=\"{{ d.href }}\" style=\"color:#fff\">Cap. {{ d.n }} · {{ d.titolo }}<\u002Fa><\u002Fsc-for>\n der-bottom:1px solid var(--color-neutral-200);font-size:12.5px\">\n          <span style=\"width:26px;height:26px;border-radius:50%;background:{{ c.dot }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px\">{{ c.n }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;min-width:0\"><b style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.titolo }}<\u002Fb><span style=\"color:var(--color-neutral-700);font-size:11.5px\">{{ c.stato }} · {{ c.minuti }} min · quiz {{ c.quizOk }}<\u002Fspan><\u002Fspan>\n          <span style=\"font-weight:700;color:var(--color-accent-2-800)\">{{ c.pct }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n<section id=\"cap1\" data-screen-label=\"DL 1\" style=\"background:var(--color-accent-2-100);border:3px solid var(--color-accent-2-400);border-radius:clamp(28px,6vw,64px);padding:clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:18px\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:20px\">\n    <div style=\"position:relative;width:120px;height:120px;flex:none\">\n      <div style=\"position:absolute;inset:0;border-radius:50%;border:4px dashed var(--color-accent-2-500)\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:18px;border-radius:50%;border:4px solid var(--color-accent-2-400)\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:36px;border-radius:50%;background:var(--color-accent-2-700);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:30px\">1<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;flex:1 1 280px\">\n      <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800)\">Digital Loyalty · Castaldo e Grosso · pp. 13–19<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-heading);font-size:clamp(25px,6vw,40px);margin:0;line-height:1.05\">Omni-channel marketing: il cliente al centro dei canali<\u002Fh2>\n    <\u002Fdiv>\n    <a href=\"#indice\" style=\"font-size:12px;font-weight:700\">↑ indice<\u002Fa>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-family:var(--font-heading);font-size:19px\">Passo 0 · Ascolta il capitolo del libro<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Prima della mappa. {{ p1.audio.info }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ p1.audio.fine }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 12px;border-radius:999px;background:var(--color-accent-2-600);color:#fff;font-weight:700;font-size:12.5px\">✓ Ascoltato · segnato in Winter Arc<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ p1.audio.notReady }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:var(--color-neutral-700)\">Carico il testo del libro…<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p1.audio.ready }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n        <button sc-camel-on-click=\"{{ p1.audio.back10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Indietro di 10 frasi\">« 10<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p1.audio.back }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase precedente\">‹<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p1.audio.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-500);color:#fff;padding:8px 20px\">{{ p1.audio.label }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p1.audio.fwd }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase successiva\">›<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p1.audio.fwd10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Avanti di 10 frasi\">10 »<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p1.audio.cycleRate }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">{{ p1.audio.rateLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p1.audio.restart }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:transparent;color:var(--color-neutral-700)\">Dall'inizio<\u002Fbutton>\n        <span style=\"margin-left:auto;font-size:12.5px;color:var(--color-neutral-700)\">frase {{ p1.audio.pos }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden\"><div style=\"height:100%;width:{{ p1.audio.pct }};background:var(--color-accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p1.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p1.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> I punti di contatto tra impresa e cliente si sono moltiplicati (negozio, app, sito, social). Il capitolo spiega perché i canali non vanno più gestiti come alternative in competizione ma come pezzi di <b>un'unica esperienza<\u002Fb> costruita attorno al cliente, e come questo cambia le leve per ottenere <b>soddisfazione e fedeltà<\u002Fb>. Chiude con il ruolo di dati e AI nel loyalty management e presenta la struttura del libro. La mappa è a <b>cerchi concentrici<\u002Fb>: il cliente al centro, i canali intorno, la loyalty all'esterno.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">① Un nuovo scenario di canale<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 13–14<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">I canali non sono più alternativi: sono parti di una proposta di valore unica che segue il customer journey.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">touchpoint fisici e digitali<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">canali integrati, non alternativi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">servizi commerciali logistici, informativi, accessori<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">ubiquità<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">rischio conflitto<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Le tecnologie moltiplicano i <b>punti di contatto<\u002Fb> fisici e digitali (app, siti, e-commerce, digital signage, totem, anche dentro il negozio). Per capire il customer journey bisogna tracciarli tutti. Come in passato il negozio è passato da «scatola nera» a oggetto di studio dello shopper marketing, oggi nascono gli approcci su <b>omnicanalità e customer journey<\u002Fb> (Verhoef et al., 2015).<\u002Fdiv>\n      <div>Questa <b>ubiquità distributiva<\u002Fb> aumenta awareness, prossimità e vendite, ma porta il rischio di <b>conflitto tra canali<\u002Fb>. Per evitarlo bisogna riconoscere che ogni canale produce servizi commerciali specifici (Pellegrini 1990):<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:6px;font-size:13px\">\n        <div style=\"background:var(--color-accent-2-100);border-radius:12px;padding:7px 9px\"><b>Logistici<\u002Fb>: prossimità, orari, ampiezza dell'assortimento<\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-100);border-radius:12px;padding:7px 9px\"><b>Informativi<\u002Fb>: pre-selezione, profondità, consulenza<\u002Fdiv>\n        <div style=\"background:var(--color-accent-2-100);border-radius:12px;padding:7px 9px\"><b>Accessori<\u002Fb>: post-vendita, garanzie, soluzioni finanziarie<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:flex-start;background:var(--color-accent-100);border-radius:12px;padding:8px 10px\"><span style=\"flex:none;padding:0 8px;border-radius:999px;background:var(--color-accent-200);color:var(--color-accent-900);font-weight:700;font-size:12px\">es.<\u002Fspan><div>Edicola = prossimità · negozio specializzato = consulenza e selezione · vending machine = rapidità · GSS = ampiezza e profondità · e-tailer = velocità, varietà, prossimità virtuale.<\u002Fdiv><\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap3\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 3:<\u002Fb> Gli attributi del servizio commerciale (Tab. 3.1) sono gli stessi: qui vengono applicati a ogni touchpoint.<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">② Da multicanale competitivo a omnicanale coopetitivo<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 14<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Prima i canali si separavano per non cannibalizzarsi; oggi collaborano per creare valore insieme.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">paura di cannibalizzazione<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">multicanale = canali separati<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">logica coopetitiva (Yami 2010)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">strategie multi-point<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">seamless experience<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">punti online = offline<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>In passato le imprese temevano <b>cannibalizzazione<\u002Fb> e conflitti con gli intermediari tradizionali. Ne è nata una visione <b>multicanale competitiva<\u002Fb>: canali differenziati per ridurre le sovrapposizioni e limitare il passaggio del cliente da uno all'altro, spesso a scapito del valore.<\u002Fdiv>\n      <div>Oggi si passa a una logica <b>coopetitiva<\u002Fb> (Yami et al., 2010): strategie <b>multi-point<\u002Fb> che aumentano l'ubiquità e valorizzano la differenziazione. L'<b>omni-channel marketing<\u002Fb> è l'evoluzione della multicanalità: riconosce che il cliente usa i canali in modo <b>simultaneo e intercambiabile<\u002Fb> e gestisce i canali in sinergia per una <b>seamless experience<\u002Fb> personalizzata. Anche canali che vendono lo stesso prodotto possono creare valore.<\u002Fdiv>\n      <div>Il Loyalty Promotion Monitor conferma: per il cliente i punti o bollini raccolti online e in negozio sono <b>equivalenti<\u002Fb>. Il cliente multicanale è un <b>asset strategico<\u002Fb> (Penco e Testa, 2025).<\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap6\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 6:<\u002Fb> Mono → multi → cross → omnicanale (Tab. 6.4): qui il passaggio è letto dal lato del cliente.<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <div style=\"grid-column:1/-1;display:flex;justify-content:center\"><div style=\"background:var(--color-accent-2-700);color:#fff;border-radius:999px;padding:16px 28px;text-align:center;max-width:640px;display:flex;flex-direction:column;gap:4px\"><b style=\"font-family:var(--font-heading);font-size:22px\">Customer centricity<\u002Fb><span style=\"font-size:13.5px\">il cliente al centro di ogni decisione · canali integrati intorno · soddisfazione, fiducia e loyalty come risultato<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">③ La centralità del cliente<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 14–15<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Capire tutto il viaggio del cliente serve a trovare i gap e a progettare esperienze di valore.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">customer journey (Voorhees 2017)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">risposte cognitive, emozionali, relazionali<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">coerenza online/offline<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">customer centricity (Valdani e Busacca)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">insight (Hamilton)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fiducia duratura<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Il <b>customer journey<\u002Fb> è l'insieme delle esperienze vissute in tutti i punti di contatto, dal primo contatto fino al ricordo (Voorhees et al., 2017). Ogni interazione, diretta o indiretta, genera risposte <b>cognitive, emozionali e relazionali<\u002Fb>; l'insieme dei touchpoint forma la <b>customer experience<\u002Fb>. Il digitale li ha moltiplicati e resi più complessi (Anderl et al., 2016), quindi serve coerenza di messaggi e immagine su tutti i canali e nel tempo.<\u002Fdiv>\n      <div>La <b>customer centricity<\u002Fb> mette il cliente al centro di ogni decisione, anticipando bisogni e costruendo esperienze memorabili (Valdani e Busacca, 1999). Si basa su <b>insight<\u002Fb> profondi (Hamilton, 2016): bisogni latenti, sacrifici per accedere ai prodotti, difficoltà di reperimento, modi migliori di comunicare. Sposta il focus dal prodotto al cliente e, in un contesto omnicanale, è una <b>necessità competitiva<\u002Fb>.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">④ Le leve di soddisfazione e fedeltà in ottica omnicanale<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 15–16<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">La soddisfazione omnicanale nasce dalla coerenza: canali accessibili, messaggi uniformi, esperienza senza strappi, valore percepito alto.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">accessibilità dei canali<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">coerenza di contenuti e messaggi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">coerenza dell'esperienza<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">valore percepito<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">assortimento e long tail<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">resi<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">comunicazione e recensioni<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AI + persone<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div><b>1 Disponibilità e accessibilità dei canali.<\u002Fb> Il cliente vuole scegliere liberamente il canale; chi percepisce un servizio omogeneo è più soddisfatto e più fedele (Yin et al., 2024).<\u002Fdiv>\n        <div><b>2 Coerenza di contenuti e messaggi.<\u002Fb> Immagine di marca uniforme su tutti i canali (Busacca e Castaldo, 2023); le incoerenze creano sfiducia. Chi comunica in modo coerente vende di più (Šerić et al., 2020); la coerenza rafforza fiducia e <b>impegno affettivo<\u002Fb>.<\u002Fdiv>\n        <div><b>3 Coerenza dell'esperienza<\u002Fb> pre, durante e post-vendita. <span style=\"color:var(--color-accent-800);font-weight:700\">es.<\u002Fspan> una promo online ma non in negozio genera frustrazione. Coerenti anche prezzi, servizio e disponibilità. Le esperienze positive creano fedeltà (Pine e Gilmore, 1998) e l'omnicanale le amplifica: meno abbandoni, più acquisti d'impulso.<\u002Fdiv>\n        <div><b>4 Valore percepito<\u002Fb> = benefici / costi, arricchito da qualità del servizio, personalizzazione, esperienza. Si agisce su tre pratiche:<\u002Fdiv>\n        <ul>\n          <li><b>Assortimento<\u002Fb>: l'e-commerce sfrutta la <b>long tail<\u002Fb> (prodotti di nicchia) e le raccomandazioni; ma troppo assortimento crea costi logistici e di stoccaggio.<\u002Fli>\n          <li><b>Resi<\u002Fb> semplici e cross-canale (reso in negozio di un acquisto online); incentivarli in-store riduce i costi; l'AI aiuta a prevederli.<\u002Fli>\n          <li><b>Comunicazione<\u002Fb>: più media, social, voce del cliente. Recensioni e passaparola pesano più dei messaggi istituzionali. Risposte rapide, autentiche, non automatizzate. Personalizzazione con dati e AI, ma bilanciata dal fattore <b>umano<\u002Fb>.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showMkt }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Già visto a Marketing:<\u002Fb> Valore per il cliente = benefici funzionali ed emotivi al netto dei costi percepiti; passaparola e fiducia del Trust Oriented Marketing.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">⑤ Loyalty management digitale e omnicanale<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 16–17<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Dati e AI rendono la loyalty personalizzata e predittiva, ma servono competenze, privacy e un cambio culturale.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">big data<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AI e marketing automation<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">chatbot<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">metriche predittive<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">business intelligence e cluster<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">competenze data science<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">privacy e GDPR<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">da transazione a relazione<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Secondo il Loyalty Promotion Monitor (Channel &amp; Retail Lab, SDA Bocconi) i touchpoint digitali migliorano <b>efficienza<\u002Fb>, <b>personalizzazione<\u002Fb> e <b>coinvolgimento<\u002Fb> (Acconciamessa 2025; Castaldo 2024). I <b>big data<\u002Fb> permettono offerte su misura che soddisfano e anticipano i bisogni.<\u002Fdiv>\n      <div>L'<b>AI<\u002Fb> automatizza i programmi, trova pattern, segmenta da sola e invia promo mirate (<b>marketing automation<\u002Fb>); chatbot e assistenti virtuali danno supporto in tempo reale. Prossimo passo: metriche <b>predittive<\u002Fb> e query automatiche, business intelligence per definire <b>cluster<\u002Fb>.<\u002Fdiv>\n      <div><b>Sfide<\u002Fb>: competenze di data science e machine learning, <b>privacy<\u002Fb> e GDPR, ritardo di chi non investe in infrastrutture e formazione. La digitalizzazione è un processo continuo.<\u002Fdiv>\n      <div><b>Esito<\u002Fb>: più centralità del cliente → cambio culturale e collaborazione tra funzioni → segmentazione fine, <b>buyer personas<\u002Fb>, loyalty promotion personalizzate. La fedeltà si misura nel lungo periodo (relazionale, valoriale, comportamentale): <b>dalla transazione all'interazione, alla relazione, al coinvolgimento emotivo<\u002Fb>.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">⑥ Fiducia, loyalty e valore d'impresa<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 17–18<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">La fiducia porta fedeltà, e la fedeltà aumenta il capitale economico dell'impresa.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">antecedenti della fiducia<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fiducia → loyalty → valore economico<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">reddito atteso ↑<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">durata ↑<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">tasso di capitalizzazione ↓<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">struttura del libro<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Per progettare la loyalty, anche phygital, bisogna conoscere i suoi driver, a partire dalla <b>fiducia e dai suoi antecedenti<\u002Fb> (Castaldo 2002, 2024; Grosso e Castaldo 2015). Isolando i fattori che aumentano la fiducia si aumenta la fedeltà.<\u002Fdiv>\n      <div>Effetti sul valore (Reichheld e Schefter 2000; Castaldo 2024; Busacca e Bertoli 2025): <b>reddito atteso e tasso di profitto più alti<\u002Fb>, <b>durata<\u002Fb> più lunga, maggiore <b>potenziale di crescita<\u002Fb>, <b>tasso di capitalizzazione più basso<\u002Fb> → cresce il capitale economico.<\u002Fdiv>\n      <div style=\"background:#201e1d;color:var(--color-neutral-100);border-radius:12px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6\"><b style=\"color:var(--color-accent-300)\">ƒ<\u002Fb> W = R / i → con fiducia R ↑ (reddito atteso) e i ↓ (rischio, tasso di capitalizzazione) ⇒ W ↑ (formula di capitalizzazione standard: il libro dà solo la logica)<\u002Fdiv>\n      <div><b>Struttura del libro<\u002Fb>: cap. 2 contesto retail italiano · cap. 3–4 letteratura su touchpoint ed enabler · cap. 5–6 ricerca sui manager · cap. 7 casi aziendali · cap. 8 caso TCC · cap. 9 linee guida.<\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap5\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 5:<\u002Fb> Fiducia, antecedenti e conseguenze (Fig. 5.7) sono la base: qui la fiducia è quella del cliente finale verso l'insegna.<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\"><b style=\"font-family:var(--font-heading);font-size:21px\">Allenati sul capitolo 1<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Ogni risposta conta in Winter Arc<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ p1.tab.tabs }}\" as=\"tb\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border-radius:999px;min-height:38px;padding:6px 14px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <sc-if value=\"{{ p1.tab.is_mc }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Clicca la risposta: la correzione è immediata. {{ p1.mc.punteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p1.mc.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Rifai<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p1.mc.items }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--color-neutral-200);padding-top:10px\">\n        <div style=\"font-weight:700\">{{ m.num }}. {{ m.q }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px\"><sc-for list=\"{{ m.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;border-radius:14px;min-height:44px;padding:8px 12px;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.txt }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <sc-if value=\"{{ m.done }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:{{ m.esitoColor }}\">{{ m.esito }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p1.tab.is_aperte }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Rispondi a voce o per scritto, poi apri la risposta modello. {{ p1.quiz.conteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p1.quiz.toggleFiltro }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ p1.quiz.filtroLabel }}<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p1.quiz.items }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border:2px solid {{ d.bordo }};border-radius:16px;padding:10px 12px\">\n        <div style=\"display:flex;gap:8px;align-items:flex-start\"><span style=\"flex:none;padding:1px 8px;border-radius:999px;background:{{ d.tipoBg }};font-size:11.5px;font-weight:700\">{{ d.tipo }}<\u002Fspan><b style=\"flex:1\">{{ d.num }}. {{ d.q }}<\u002Fb><span style=\"flex:none;font-size:11.5px;color:var(--color-neutral-700)\">{{ d.stato }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><button sc-camel-on-click=\"{{ d.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ d.btnLabel }}<\u002Fbutton><button sc-camel-on-click=\"{{ d.sapevo }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">La sapevo<\u002Fbutton><button sc-camel-on-click=\"{{ d.noSapevo }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-accent-200);color:var(--color-accent-900)\">Non la sapevo<\u002Fbutton><sc-if value=\"{{ d.custom }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ d.del }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:transparent;color:var(--color-neutral-700)\">Elimina<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n        <sc-if value=\"{{ d.open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:var(--color-neutral-100);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.55\">{{ d.a }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n      <sc-if value=\"{{ p1.quiz.vuoto }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:var(--color-accent-2-800)\">Nessuna domanda da rivedere: tutte risposte giuste l'ultima volta.<\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:6px;background:var(--color-neutral-100);border-radius:16px;padding:12px\"><b style=\"font-size:13.5px\">Aggiungi una tua domanda<\u002Fb><input value=\"{{ p1.quiz.dq }}\" sc-camel-on-change=\"{{ p1.quiz.setQ }}\" placeholder=\"Domanda\" style=\"font:inherit;font-size:14px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--color-neutral-300);background:#fff;color:#201e1d;width:100%;box-sizing:border-box\"><textarea value=\"{{ p1.quiz.da }}\" sc-camel-on-change=\"{{ p1.quiz.setA }}\" placeholder=\"Risposta (facoltativa)\" rows=\"2\" style=\"font:inherit;font-size:14px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--color-neutral-300);background:#fff;color:#201e1d;width:100%;box-sizing:border-box;resize:vertical\"><\u002Ftextarea><button sc-camel-on-click=\"{{ p1.quiz.add }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;align-self:flex-start;background:var(--color-neutral-900);color:#fff\">Aggiungi<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p1.tab.is_fc }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;font-size:12.5px;color:var(--color-neutral-700)\"><span>Carta {{ p1.fc.pos }}<\u002Fspan><span>{{ p1.fc.stato }}<\u002Fspan><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ p1.fc.gira }}\" style=\"border:0;cursor:pointer;font:inherit;text-align:left;border-radius:24px;min-height:200px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--color-accent-2-100);color:#201e1d;box-shadow:var(--shadow-md)\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-800)\">Domanda · tocca per girare<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:21px;line-height:1.25\">{{ p1.fc.q }}<\u002Fspan><sc-if value=\"{{ p1.fc.flip }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:14.5px;line-height:1.55;border-top:2px dashed var(--color-accent-2-400);padding-top:10px\">{{ p1.fc.a }}<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n lex-direction:column;gap:6px\"><sc-for list=\"{{ p1.mt.left }}\" as=\"l\" hint-placeholder-count=\"6\"><div draggable=\"true\" sc-camel-on-drag-start=\"{{ l.dragStart }}\" sc-camel-on-click=\"{{ l.pick }}\" style=\"cursor:grab;user-select:none;border-radius:14px;min-height:44px;padding:9px 12px;font-weight:700;font-size:13.5px;display:flex;align-items:center;background:{{ l.bg }};color:{{ l.fg }}\">{{ l.mark }}{{ l.txt }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><sc-for list=\"{{ p1.mt.right }}\" as=\"r\" hint-placeholder-count=\"6\"><div sc-camel-on-drag-over=\"{{ r.over }}\" sc-camel-on-drop=\"{{ r.drop }}\" sc-camel-on-click=\"{{ r.pick }}\" style=\"cursor:pointer;border:2px dashed var(--color-neutral-300);border-radius:14px;min-height:44px;padding:8px 12px;font-size:13px;display:flex;align-items:center;background:{{ r.bg }}\">{{ r.mark }}{{ r.txt }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p1.tab.is_cs }}\" hint-placeholder-val=\"{{ false }}\"><sc-if value=\"{{ p1.cs.ready }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px\"><b style=\"font-family:var(--font-heading);font-size:18px\">{{ p1.cs.titolo }}<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">{{ p1.cs.pos }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ p1.cs.inCorso }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:14.5px;line-height:1.5\">{{ p1.cs.q }}<\u002Fdiv><sc-for list=\"{{ p1.cs.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;border-radius:14px;min-height:44px;padding:9px 12px;background:{{ o.bg }};color:{{ o.fg }}\">{{ nt-family:var(--font-heading);font-size:84px;line-height:.85;color:#fff;margin-left:8px\">2<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;flex:1 1 280px\">\n      <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-300)\">Digital Loyalty · Acconciamessa e Castaldo · pp. 20–33<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-heading);font-size:clamp(25px,6vw,40px);margin:0;line-height:1.05;color:#fff\">La grande trasformazione del retail in uno scenario fragile<\u002Fh2>\n    <\u002Fdiv>\n    <a href=\"#indice\" style=\"font-size:12px;font-weight:700;color:var(--color-accent-300)\">↑ indice<\u002Fa>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-family:var(--font-heading);font-size:19px\">Passo 0 · Ascolta il capitolo del libro<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Prima della mappa. {{ p2.audio.info }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ p2.audio.fine }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 12px;border-radius:999px;background:var(--color-accent-2-600);color:#fff;font-weight:700;font-size:12.5px\">✓ Ascoltato · segnato in Winter Arc<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ p2.audio.notReady }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:var(--color-neutral-700)\">Carico il testo del libro…<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p2.audio.ready }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;ali

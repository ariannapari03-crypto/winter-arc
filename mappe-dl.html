    <span>Risposte: <b>{{ p3.quizOk }}<\u002Fb> giuste · <b>{{ p3.quizKo }}<\u002Fb> sbagliate<\u002Fspan>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 280px\">\n      <span style=\"color:var(--color-neutral-700)\">{{ p3.ripTxt }}<\u002Fspan>\n      <sc-if value=\"{{ p3.ripDue }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ p3.toggleRidis }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:{{ p3.ridisBg }};color:{{ p3.ridisFg }}\">{{ p3.ridisLabel }}<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ p3.canVote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ p3.rip0 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-200);color:var(--color-accent-900)\">Non ricordo<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p3.rip1 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Incerta<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p3.rip2 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">Ricordo<\u002Fbutton>\n      <\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <span style=\"margin-left:auto;font-weight:700;color:var(--color-accent-2-800)\">+{{ p3.xp }} XP<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"cap4\" data-screen-label=\"DL 4\" style=\"background:var(--color-accent-2-700);color:#fff;border-radius:var(--radius-lg) 4px var(--radius-lg) 4px;padding:clamp(16px,4vw,36px);display:flex;flex-direction:column;gap:18px\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:20px\">\n    <div style=\"display:flex;align-items:center;gap:0;flex:none\">\n      <div style=\"width:44px;height:44px;border-radius:12px;background:var(--color-accent-2-300)\"><\u002Fdiv>\n      <div style=\"width:40px;height:6px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px)\"><\u002Fdiv>\n      <div style=\"width:64px;height:64px;border-radius:50%;background:#fff;color:var(--color-accent-2-800);font-family:var(--font-heading);font-size:38px;display:flex;align-items:center;justify-content:center\">4<\u002Fdiv>\n      <div style=\"width:40px;height:6px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px)\"><\u002Fdiv>\n      <div style=\"width:44px;height:44px;border-radius:50%;background:var(--color-accent-300)\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;flex:1 1 280px\">\n      <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-200)\">Digital Loyalty · Mantovani, Ciacci, Branca · pp. 48–58<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-heading);font-size:clamp(25px,6vw,40px);margin:0;line-height:1.05\">I fattori abilitanti della loyalty (enabler) nei contesti digitali<\u002Fh2>\n    <\u002Fdiv>\n    <a href=\"#indice\" style=\"font-size:12px;font-weight:700;color:var(--color-accent-2-200)\">↑ indice<\u002Fa>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-family:var(--font-heading);font-size:19px\">Passo 0 · Ascolta il capitolo del libro<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Prima della mappa. {{ p4.audio.info }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ p4.audio.fine }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 12px;border-radius:999px;background:var(--color-accent-2-600);color:#fff;font-weight:700;font-size:12.5px\">✓ Ascoltato · segnato in Winter Arc<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ p4.audio.notReady }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:var(--color-neutral-700)\">Carico il testo del libro…<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p4.audio.ready }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n        <button sc-camel-on-click=\"{{ p4.audio.back10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Indietro di 10 frasi\">« 10<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p4.audio.back }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase precedente\">‹<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p4.audio.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-500);color:#fff;padding:8px 20px\">{{ p4.audio.label }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p4.audio.fwd }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Frase successiva\">›<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p4.audio.fwd10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Avanti di 10 frasi\">10 »<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p4.audio.cycleRate }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">{{ p4.audio.rateLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p4.audio.restart }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:transparent;color:var(--color-neutral-700)\">Dall'inizio<\u002Fbutton>\n        <span style=\"margin-left:auto;font-size:12.5px;color:var(--color-neutral-700)\">frase {{ p4.audio.pos }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden\"><div style=\"height:100%;width:{{ p4.audio.pct }};background:var(--color-accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p4.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p4.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"background:rgba(255,255,255,.12);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> Un touchpoint da solo non basta: diventa fedeltà solo se intervengono certe <b>condizioni<\u002Fb>, gli enabler. Il capitolo ne descrive <b>otto<\u002Fb>, spiega che possono agire come <b>mediatori<\u002Fb> (sono il passaggio intermedio) o <b>moderatori<\u002Fb> (rafforzano o indeboliscono l'effetto), e unisce cap. 3 e 4 in un <b>framework touchpoint-enabler<\u002Fb>. La mappa è un <b>ponte<\u002Fb>: a sinistra i touchpoint, al centro gli enabler, a destra la loyalty.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:{{ bridgeCols }};gap:10px;align-items:stretch\">\n    <div style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-900);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13px\">\n      <b style=\"font-family:var(--font-heading);font-size:17px\">Touchpoint (cap. 3)<\u002Fb>\n      <span>siti web ed e-commerce<\u002Fspan><span>conversazionali<\u002Fspan><span>loyalty program<\u002Fspan><span>omni/multicanale<\u002Fspan><span>app<\u002Fspan><span>piattaforme<\u002Fspan><span>altri<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:#fff;color:#201e1d;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13px\">\n      <b style=\"font-family:var(--font-heading);font-size:17px;color:var(--color-accent-2-800)\">Enabler<\u002Fb>\n      <div style=\"display:flex;flex-wrap:wrap;gap:5px\">\n        <span style=\"background:var(--color-accent-2-100);border-radius:999px;padding:3px 10px\">user experience<\u002Fspan><span style=\"background:var(--color-accent-2-100);border-radius:999px;padding:3px 10px\">customer engagement<\u002Fspan><span style=\"background:var(--color-accent-2-100);border-radius:999px;padding:3px 10px\">brand connection<\u002Fspan><span style=\"background:var(--color-accent-2-100);border-radius:999px;padding:3px 10px\">soddisfazione e qualità percepita<\u002Fspan><span style=\"background:var(--color-accent-2-100);border-radius:999px;padding:3px 10px\">trust<\u002Fspan><span style=\"background:var(--color-accent-2-100);border-radius:999px;padding:3px 10px\">prezzo e costo<\u002Fspan><span style=\"background:var(--color-accent-2-100);border-radius:999px;padding:3px 10px\">gamification<\u002Fspan><span style=\"background:var(--color-accent-2-100);border-radius:999px;padding:3px 10px\">personalizzazione<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\">\n        <div style=\"background:var(--color-accent-200);border-radius:12px;padding:7px 9px\"><b>Mediatore<\u002Fb>: spiega il processo. touchpoint → soddisfazione/fiducia → loyalty<\u002Fdiv>\n        <div style=\"background:var(--color-neutral-200);border-radius:12px;padding:7px 9px\"><b>Moderatore<\u002Fb>: amplifica o attenua l'effetto del touchpoint secondo il contesto<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Mnemonico <b>U-E-B-S-T-P-G-P<\u002Fb>: «Un Enabler Buono Sostiene Touchpoint Poco Graditi Prima».<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-accent-300);color:var(--color-accent-900);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13px\">\n      <b style=\"font-family:var(--font-heading);font-size:17px\">Loyalty<\u002Fb>\n      <span><b>attitudinale<\u002Fb>: cognitiva, affettiva, conativa<\u002Fspan><span><b>comportamentale<\u002Fb>: rivisita, riutilizzo, riacquisto, advocacy<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">E1 · User experience<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 50–51<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Un'esperienza d'uso fluida, emozionante e coerente tra canali è la prima condizione della fedeltà digitale.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">esperienza sensoriale, affettiva, intellettuale, comportamentale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">approccio emozionale (Straker e Wrigley)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">co-costruzione nei forum<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">realtà aumentata<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">avatar<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">omnicanale coerente<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fattore umano nel lusso<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">generazioni<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">mobile payment → meno churn<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">comodità di ordini e resi<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>L'esperienza ha dimensioni <b>sensoriali, affettive, intellettuali, comportamentali<\u002Fb> (Alqayed 2022). Approccio <b>emozionale<\u002Fb>: il coinvolgimento emotivo nei canali digitali rafforza l'engagement (Straker e Wrigley 2016); approccio <b>esperienziale-discorsivo<\u002Fb>: la loyalty nasce come co-costruzione sociale nei forum (Obiegbu 2019).<\u002Fdiv>\n      <div><b>Realtà aumentata<\u002Fb> e <b>avatar<\u002Fb> aumentano soddisfazione, uso continuativo e appartenenza. L'<b>omnicanale coerente<\u002Fb> alimenta soddisfazione e fedeltà, ma bisogna rispettare le preferenze individuali per i touchpoint (Ieva e Ziliani 2017). Nel lusso phygital servono dipendenti attenti all'interazione (Pangarkar 2022).<\u002Fdiv>\n      <div>Contano generazioni ed empowerment tecnologico, funzionalità, estetica e semplicità. Un journey intuitivo aumenta la loyalty; il <b>mobile payment<\u002Fb> riduce i costi transazionali e il churn (Xu 2024); la <b>comodità di ordini e resi<\u002Fb> aumenta la soddisfazione (Al-Okaily 2025).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">E2 · Customer engagement<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 51<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il coinvolgimento trasforma un'esperienza positiva in impegno e comportamenti fedeli.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\"> informativi/promozionali · social CRM e co-creazione · psychological ownership → advocacy · live streaming · reclami gestiti con empatia\"&gt;\n      \n      <div>Tre dimensioni: <b>affettiva, cognitiva, comportamentale<\u002Fb> (Carlson 2021; Jun e Yi 2020). Nasce da elementi immersivi: <b>flow, enjoyment, novelty<\u002Fb>. Nel retail omnicanale e phygital l'engagement <b>media<\u002Fb> la relazione tra customer experience e fedeltà.<\u002Fdiv>\n      <div>Sui social i <b>contenuti relazionali<\u002Fb> generano più engagement, loyalty e passaparola di quelli informativi o promozionali (Kulikovskaja 2023). Nel social CRM aiutano partecipazione, co-creazione, attaccamento emotivo. Nelle community: identità condivisa e <b>psychological ownership<\u002Fb> → advocacy anche senza relazione tradizionale con la marca.<\u002Fdiv>\n      <div>Conta l'intuitività dell'interfaccia. Un <b>reclamo<\u002Fb> online gestito con empatia può trasformare un'esperienza negativa in nuova fedeltà (Matute 2021).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">E3 · Brand connection<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 51–52<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il cliente resta fedele al brand in cui si riconosce: autentico, emozionante, con valori condivisi.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">self-brand connection<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">appartenenza alla community<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">journey coerente e tematico (Kuehnl)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">autenticità ed emozione<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">lusso<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">dipendenti presenti online (Herhausen)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">CSR → advocacy<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">narrazione co-costruita<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Self-brand connection<\u002Fb>: identificazione personale ed emotiva con il brand → più engagement e fedeltà (Bowden e Mirzaei 2021); la favorisce il senso di <b>appartenenza<\u002Fb> alle community digitali.<\u002Fdiv>\n      <div>Un customer journey <b>coerente e tematicamente coeso<\u002Fb> crea esperienze armoniche e attitudine positiva (Kuehnl 2019). Aiutano l'<b>autenticità<\u002Fb> percepita e i contenuti sensoriali ed emotivi (soprattutto nel lusso), la <b>presenza digitale dei dipendenti<\u002Fb> (Herhausen 2020), le campagne di <b>CSR<\u002Fb> (advocacy; Jiang 2025), una <b>narrazione co-costruita<\u002Fb> con il consumatore.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">E4 · Soddisfazione e qualità percepita<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 52–53<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">La soddisfazione, nata dalla qualità percepita, è spesso il passaggio intermedio tra touchpoint e fedeltà.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">mediatore tra touchpoint e loyalty<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">qualità del sito, informativa, di sistema, esperienziale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">potenziata o attenuata da coerenza, supporto, resistenza al cambiamento<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">prezzi personalizzati e privacy la riducono<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Gen Z: separa fedeli e volatili<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Funziona spesso da <b>mediatore<\u002Fb>. Dimensioni della qualità: del sito e dell'interfaccia, <b>informativa e di sistema<\u002Fb>, <b>esperienziale e immersiva<\u002Fb>. Ben progettate → soddisfazione digitale → riacquisto, engagement, attaccamento.<\u002Fdiv>\n      <div>Nelle architetture omnicanale media anche tra fiducia, utilità percepita, reputazione e loyalty. Il suo effetto è <b>moderato<\u002Fb> da coerenza tra canali, supporto percepito, resistenza al cambiamento.<\u002Fdiv>\n      <div>Scende con percezioni di <b>iniquità<\u002Fb> e violazioni della privacy (prezzi personalizzati: efficienti nel breve, dannosi nel lungo). Nella Gen Z distingue nettamente i clienti fedeli da quelli volatili.<\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap10\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 10:<\u002Fb> Soddisfazione = percezioni − aspettative (gap di valore).<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">E5 · Trust<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 53<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">In digitale la fiducia è decisiva in ogni canale: media tra la qualità dell'esperienza e la fedeltà.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">mediatore tra qualità dell'esperienza e loyalty (Hussein)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">digital banking e payment<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">co-creazione con il distributore<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">CSR → trust → loyalty<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">human touch nel lusso<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">e-CRM e reputazione compensano l'assenza fisica<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">trasparenza sui social<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">influencer credibili<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Il trust <b>media<\u002Fb> tra qualità dell'esperienza digitale e loyalty (Hussein 2023). Nel banking e nei pagamenti influenza sicurezza, soddisfazione e fedeltà.<\u002Fdiv>\n      <div>Nel retail la fiducia nel distributore apre alla <b>co-creazione<\u002Fb>, dal feedback alla co-innovazione (Rubio 2021). Nella CSR il trust media tra attività di CSR e loyalty (Iglesias 2020). Nel lusso phygital serve lo <b>«human touch»<\u002Fb>; altrove una forte fiducia digitale, costruita con e-CRM e reputazione, <b>compensa l'assenza di contatto fisico<\u002Fb>.<\u002Fdiv>\n      <div>Sui social: comunicazione trasparente, anche B2B. <b>Influencer<\u002Fb>: credibilità, autenticità e coinvolgimento emotivo precedono la fiducia.<\u002Fdiv>\n      <a href=\"{{ gtmHref }}#cap5\" style=\"display:block;text-decoration:none;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:14px;padding:9px 12px;font-size:13px\"><b>↔ Go to Market, cap. 5:<\u002Fb> Antecedenti della fiducia (competenza, assenza di opportunismo, comunicazione) e circolarità fiducia ↔ soddisfazione.<\u002Fa>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">E6 · Prezzo e costo<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 53–54<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Prezzo percepito come equo, convenienza e costi di cambiamento tengono il cliente; il prezzo personalizzato opaco lo allontana.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">convenienza: prezzi accessibili + meno tempo e sforzo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Gen Z più sensibile al prezzo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Gen X/Y premium price<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fair price perception<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">pricing personalizzato: utile se trasparente, dannoso se penalizza i fedeli<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">switching cost rafforzano la loyalty<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">costi transazionali ↓<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div><b>Convenienza percepita<\u002Fb> = prezzi competitivi accessibili + risparmio di tempo e sforzo (Sharma e Dutta 2025). La <b>Gen Z<\u002Fb> è più sensibile al prezzo; <b>Gen Y e X<\u002Fb> più fedeli e disposte a pagare un premium price.<\u002Fdiv>\n      <div><b>Fair price perception<\u002Fb>: dipende da trasparenza ed etica. Il pricing personalizzato ben gestito aumenta soddisfazione e riacquisto (Victor 2021); se fa pagare di più clienti ricorrenti o abbonati senza trasparenza, crea preoccupazioni di privacy e riduce la loyalty (Chen 2023).<\u002Fdiv>\n      <div>Gli <b>switching cost<\u002Fb> (sforzi e rischi per cambiare app o piattaforma) <b>rafforzano<\u002Fb> la fedeltà, soprattutto con esperienze soddisfacenti e abitudini (Wu 2021). Le piattaforme riducono i costi transazionali.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">E7 · Gamification<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 54<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il gioco rende l'interazione gratificante: punti, badge e missioni aumentano coinvolgimento e fedeltà.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">punti, badge, classifiche, missioni<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">engagement e co-creazione (Dreher e Ströbel; Adidas)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">impatti sociali, economici, ambientali<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">alleanze cross-industry (Tsai): empowerment, epic meaning, social influence<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AR<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">divertimento<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Elementi: <b>punti, badge, classifiche, missioni<\u002Fb> → engagement e co-creazione (Dreher e Ströbel 2023). <span style=\"color:var(--color-accent-800);font-weight:700\">es.<\u002Fspan> <b>Adidas<\u002Fb>: effetti anche sociali, economici e ambientali.<\u002Fdiv>\n      <div>In servizi online-merge-offline di alleanze retail cross-industry migliora esperienza e fedeltà (Tsai 2024), soprattutto con <b>empowerment, epic meaning, social influence<\u002Fb>. La realtà aumentata aumenta immersione e appagamento. Divertimento e coinvolgimento emotivo rafforzano la relazione.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">E8 · Personalizzazione<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 54<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Personalizzare significa far sentire il cliente curato, non solo offrirgli il prezzo giusto.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">non solo vantaggi funzionali: cura e attenzione<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">co-creazione tramite feedback (Rubio)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">avatar con calore, competenza, credibilità (Aman)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">AI antropomorfa → soddisfazione e uso continuativo nei giovani<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Oltre ai vantaggi funzionali (prezzo, accessibilità) deve attivare dinamiche <b>relazionali ed emotive<\u002Fb> che rispondono al bisogno di cura (Filotto 2021). Forme: <b>co-creazione<\u002Fb> del servizio via feedback (Rubio 2021); <b>avatar<\u002Fb> con calore, competenza e credibilità nella ristorazione (Aman 2025); AI più senziente e antropomorfa → più soddisfazione e uso continuativo nei giovani (Bhatnagr e Rajesh 2024).<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:var(--color-accent-2-100);color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;border:2px solid var(--color-accent-2-500);\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Il framework e le conclusioni<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 55–58 · Fig. 4.1<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">I touchpoint offrono l'occasione, gli enabler decidono se diventa fedeltà: per questo strumenti simili funzionano in un contesto e falliscono in un altro.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">senza enabler i touchpoint restano strumenti<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">mappa per collocare, sovrapporre, tracciare<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">2 messaggi: coerenza omnicanale, trasparenza ed equità<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">7 direzioni di ricerca<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">4 implicazioni manageriali<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Il framework (Fig. 4.1) mette i touchpoint sull'asse <b>impresa → cliente<\u002Fb> (linea continua) e gli enabler come condizioni che rafforzano o indeboliscono il percorso (linee tratteggiate). Non è un elenco ma una <b>mappa di progettazione e diagnosi<\u002Fb>: colloca i touchpoint, sovrappone gli enabler, traccia i meccanismi (Van Doorn e Hoekstra 2013).<\u002Fdiv>\n      <div><b>Due messaggi trasversali<\u002Fb>: ① la <b>coerenza omnicanale<\u002Fb> non è accessoria (dati frammentati ed esperienze disallineate erodono fiducia anche se i singoli touchpoint funzionano); ② <b>trasparenza ed equità<\u002Fb>: personalizzazione e gamification funzionano se regole, privacy e redemption sono chiare e i prezzi percepiti come corretti.<\u002Fdiv>\n      <div><b>Ricerca futura<\u002Fb>: meccanismi per fase del journey · quando gli enabler rafforzano o indeboliscono · complementarità o sostituzione tra touchpoint · touchpoint poco studiati · indicatori attitudinali + comportamentali · trade-off personalizzazione AI ed etica · meccanismi di fiducia (trasparenza algoritmica, blockchain, antropomorfismo).<\u002Fdiv>\n      <div><b>Implicazioni manageriali<\u002Fb>: ① allineare i touchpoint alle fasi del journey e trovare gli enabler decisivi · ② journey coerente e visibile (regole uniformi, continuità online-offline, privacy, meccaniche eque) · ③ combinare touchpoint che si rafforzano (app come contenitore del programma, piattaforme per estendere il sito, supporto conversazionale) · ④ monitorare insieme atteggiamenti (soddisfazione, fiducia, connessione, engagement) e comportamenti (rivisita, riuso, riacquisto, advocacy).<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85;opacity:1\">LEGGI · Tab. 4.1, p. 49–50 · Fig. 4.1, p. 56<\u002Fspan><span>Tabella degli enabler e schema del framework<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\"><b style=\"font-family:var(--font-heading);font-size:21px\">Allenati sul capitolo 4<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Ogni risposta conta in Winter Arc<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ p4.tab.tabs }}\" as=\"tb\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border-radius:999px;min-height:38px;padding:6px 14px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <sc-if value=\"{{ p4.tab.is_mc }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Clicca la risposta: la correzione è immediata. {{ p4.mc.punteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p4.mc.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Rifai<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p4.mc.items }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--color-neutral-200);padding-top:10px\">\n        <div style=\"font-weight:700\">{{ m.num }}. {{ m.q }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px\"><sc-for list=\"{{ m.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;border-radius:14px;min-height:44px;padding:8px 12px;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.txt }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <sc-if value=\"{{ m.done }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:{{ m.esitoColor }}\">{{ m.esito }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p4.tab.is_aperte }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Rispondi a voce o per scritto, poi apri la risposta modello. {{ p4.quiz.conteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p4.quiz.toggleFiltro }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ p4.quiz.filtroLabel }}<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p4.quiz.items }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border:2px solid {{ d.bordo }};border-radius:16px;padding:10px 12px\">\n        <div style=\"display:flex;gap:8px;align-items:flex-start\"><span style=\"flex:none;padding:1px 8px;border-radius:999px;background:{{ d.tipoBg }};font-size:11.5px;font-weight:700\">{{ d.tipo }}<\u002Fspan><b style=\"flex:1\">{{ d.num }}. {{ d.q }}<\u002Fb><span style=\"flex:none;font-size:11.5px;color:var(--color-neutral-700)\">{{ d.stato }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><button sc-camel-on-click=\"{{ d.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ d.btnLabel }}<\u002Fbutton><button sc-camel-on-click=\"{{ d.sapevo }}\" style=\"border:0;cursor:pointer;font: ppercase;color:var(--color-accent-2-800)\">Digital Loyalty · Penco e Testa · pp. 59–70<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-heading);font-size:clamp(25px,6vw,40px);margin:0;line-height:1.05\">Analisi qualitativa su loyalty e trust: il metodo della ricerca<\u002Fh2>\n    <\u002Fdiv>\n    <a href=\"#indice\" style=\"font-size:12px;font-weight:700\">↑ indice<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><b style=\"font-family:var(--font-heading);font-size:19px\">Passo 0 · Ascolta il capitolo del libro<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Prima della mappa. {{ p5.audio.info }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ p5.audio.fine }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:3px 12px;border-radius:999px;background:var(--color-accent-2-600);color:#fff;font-weight:700;font-size:12.5px\">✓ Ascoltato · segnato in Winter Arc<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ p5.audio.notReady }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:var(--color-neutral-700)\">Carico il testo del libro…<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p5.audio.ready }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n        <button sc-camel-on-click=\"{{ p5.audio.back10 }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;background:var(--color-neutral-200);color:var(--color-neutral-900)\" aria-label=\"Indietro di 10 frasi\">« 10<\u002Fbutton>\n        <button sc -accent-500)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6\">\n        <div style=\"color:var(--color-neutral-600)\">{{ p5.audio.prima }}<\u002Fdiv>\n        <div style=\"background:var(--color-accent-200);color:var(--color-accent-900);border-radius:12px;padding:8px 12px\">{{ p5.audio.frase }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Riprende da dove eri rimasta. Durante la lettura lo schermo resta acceso; se blocchi il telefono il browser di solito si ferma.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  \n  <div style=\"background:#fff;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.55\"><b>Il filo del capitolo.<\u002Fb> È il capitolo del <b>metodo<\u002Fb>: spiega come è stata costruita la ricerca empirica del Loyalty Promotion Monitor 2025 che il cap. 6 racconterà. Perché una ricerca qualitativa, come è stato costruito il questionario (4 sezioni), chi sono i 40 informant, come sono stati analizzati i dati e come si garantisce la validità. All'esame conta saper raccontare il <b>disegno della ricerca come una sequenza<\u002Fb>. La mappa è una <b>lente d'ingrandimento<\u002Fb>: sei passi in fila, dal perché al rigore.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px;font-size:13px\">\n    <div style=\"background:var(--color-accent-2-200);border-radius:14px;padding:9px 11px\"><b>1 · Perché<\u002Fb><br>domanda di ricerca<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-300);border-radius:14px;padding:9px 11px\"><b>2 · Come<\u002Fb><br>qualitativo, case study, grounded theory<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-400);border-radius:14px;padding:9px 11px\"><b>3 · Strumento<\u002Fb><br>questionario in 4 sezioni<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-500);color:#fff;border-radius:14px;padding:9px 11px\"><b>4 · Chi<\u002Fb><br>40 informant, purposive sampling<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-600);color:#fff;border-radius:14px;padding:9px 11px\"><b>5 · Analisi<\u002Fb><br>NVivo 14, codici → categorie → temi<\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-800);color:#fff;border-radius:14px;padding:9px 11px\"><b>6 · Rigore<\u002Fb><br>5 fasi di validità<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px\">\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Da dove nasce la ricerca<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 59–60<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">La prima fase dell'Osservatorio ha mostrato che il digitale cambia la loyalty dal lato della domanda e dell'offerta; questa ricerca lo approfondisce con i manager.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">Loyalty Promotion Monitor 2024 (SDA Bocconi)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">demand side: digitale → relazione trust-based<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">supply side: big data, AI, ML nel CRM<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">input dai cap. 1–4<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">trust = enabler principale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">pochi studi qualitativi lato offerta<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Nel Loyalty Promotion Monitor 2024 (SDA Bocconi) gli informant avevano indicato il digitale come tema dirompente su due fronti. <b>Demand side<\u002Fb>: abilita un rapporto più profondo e <b>trust-based<\u002Fb> con l'insegna (smaterializzazione della carta, app, e-commerce, pagamenti digitali, touchpoint lungo il journey). <b>Supply side<\u002Fb>: dati (big data) e strumenti (AI, machine learning collegati al CRM) per decidere le strategie di loyalty.<\u002Fdiv>\n      <div>Input dei capitoli precedenti: scenario omnicanale (cap. 1), mappe cognitive delle interviste 2024 (cap. 2), letteratura su <b>touchpoint<\u002Fb> (cap. 3) ed <b>enabler<\u002Fb> (cap. 4). Tra gli enabler si approfondisce il più importante, il <b>trust<\u002Fb>, tralasciando gli altri (soddisfazione, engagement, qualità, brand).<\u002Fdiv>\n      <div>Gap: pochi studi qualitativi <b>«dal lato dell'offerta»<\u002Fb>, cioè che descrivono le iniziative delle imprese.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Il disegno: perché qualitativo<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 60–61 · Fig. 5.1<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Per capire «come» e «perché» i retailer cambiano la loyalty servono interviste in profondità, non numeri.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">interviste in profondità<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">comprensione olistica (Corbin e Strauss)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">domande «come» e «perché»<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">case study (Eisenhardt)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">grounded theory (Glaser e Strauss)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">confronto grocery / non grocery<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>La ricerca qualitativa dà una <b>comprensione olistica<\u002Fb> del fenomeno (Corbin e Strauss 2008), tenendo insieme forze diverse come la resistenza del cartaceo e la pervasività del digitale, e risponde anche a domande difficili. Solo le interviste in profondità fanno emergere somiglianze e differenze tra tipi di impresa (grocery e non grocery).<\u002Fdiv>\n      <div>Il <b>case study<\u002Fb> è coerente con domande su «come» e «perché» (Eisenhardt 1989). Partendo dai dati si costruisce una <b>grounded theory<\u002Fb>: raccolta, analisi sistematica, interpretazione, nuova teoria (Glaser e Strauss). Il contatto diretto serve perché le imprese tendono a non divulgare informazioni strategiche.<\u002Fdiv>\n      <div><b>Domanda di ricerca<\u002Fb>: come i retailer gestiscono la loyalty in un contesto di digital transformation, con quali potenzialità di creazione di valore e quali criticità nell'adozione?<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Il questionario: 4 sezioni<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 62–66 · Tab. 5.1<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Quattro sezioni seguono un filo: transizione al digitale, fiducia lungo il journey, uso dei dati, futuro.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">semistrutturato, domande aperte<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">fonti: campo (interviste 2024) + desk (letteratura)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">S1 dal cartaceo al digitale<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">S2 trasformazione digitale e trust<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">S3 business intelligence e analisi predittive<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">S4 nuove frontiere<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">conclusione: take away<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Questionario <b>semistrutturato<\u002Fb> a domande aperte, con esempi per stimolare la conversazione. Variabili da due fonti: <b>sul campo<\u002Fb> (insight delle interviste 2024) e <b>desk<\u002Fb> (letteratura dei cap. 3–4).<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <div><b>S1 · Dal cartaceo al digitale<\u002Fb>: evoluzione dei programmi (1A), strumenti digitali usati (1B), integrazione o separazione con il cartaceo (1C), ostacoli e fattori di spinta lato consumatore, organizzazione centrale, negozio, capo area (1D), vantaggi (1E) e svantaggi (1F).<\u002Fdiv>\n        <div><b>S2 · Trasformazione digitale e trust<\u002Fb>: impatto su pre-purchase, purchase, post-purchase (2A–2C); «un cliente realmente fedele riacquista perché si fida» (2D); privacy (2E); fiducia verso insegna, personale, marca commerciale, categorie e marche industriali (win-win), azienda del premio (win-win-win), strumenti digitali (2F); sfiducia e squilibri store/brand loyalty (2G).<\u002Fdiv>\n        <div><b>S3 · Business intelligence e analisi predittive<\u002Fb>: decisioni prese con i dati, casi concreti, dati per personalizzare e costruire fiducia, previsioni, quanto ci si sente predittivi, velocità nel trasformare insight in azioni, cosa servirebbe (3A–3G).<\u002Fdiv>\n        <div><b>S4 · Nuove frontiere<\u002Fb>: tecnologie promettenti per fase del journey, AR, wallet, token, NFC, blockchain, AI, gamification, retail media, futuro a 5 anni (4A–4H). Chiusura: <b>take away<\u002Fb> finali.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>Il consumatore senza alternative che riacquista comunque è «<b>prigioniero<\u002Fb>», non fedele.<\u002Fdiv>\n      <div style=\"border:2px dashed var(--color-neutral-400);border-radius:14px;padding:8px 11px;font-size:13px\"><b>Per ricordare ·<\u002Fb> Le 4 sezioni: Carta → Fiducia → Dati → Futuro.<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85;opacity:1\">LEGGI · Tab. 5.1, p. 64–66<\u002Fspan><span>Protocollo completo di intervista con tutte le domande<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Il campione: 40 informant<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 66–68 · Tab. 5.2<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">40 top manager scelti di proposito, che rappresentano oltre l'85% del grocery italiano, intervistati fino a saturazione.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\"> 85% del mercato · maggio–luglio 2025 su Teams · circa 45 minuti · saturazione teorica\"&gt;\n      \n      <div>Protocollo prima <b>validato<\u002Fb> con esperti e professionisti. Campionamento mirato (<b>purposive sampling<\u002Fb>): si scelgono casi rilevanti e persone competenti, i «<b>knowledgeable agent<\u002Fb>» (Gehman 2018), in ruoli apicali di marketing, vendite e loyalty in GD e GDO. Usare organizzazioni diverse riduce il bias e migliora validità e generalizzabilità. Nel qualitativo l'adeguatezza del campione dipende dalla ricchezza delle informazioni, non dal numero.<\u002Fdiv>\n      <div><b>40 informant<\u002Fb>: <b>32<\u002Fb> retailer grocery, <b>7<\u002Fb> non grocery, <b>1<\u002Fb> grossista/produttore (per la visione di filiera). I grocery coprono <b>oltre l'85%<\u002Fb> del mercato italiano. Anonimato con codice numerico.<\u002Fdiv>\n      <div>Interviste <b>maggio–luglio 2025<\u002Fb> su Microsoft Teams, circa <b>45 minuti<\u002Fb>, uno o due intervistatori esperti; partecipazione volontaria, dati aggregati, GDPR. Si parte da domande ampie e poi si va nello specifico. Registrazione, trascrizione integrale, traduzione in inglese, follow-up se serve. Stop alla <b>saturazione teorica<\u002Fb>: quando nuove interviste non aggiungono nulla.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">L'analisi dei dati<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 68–69<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Dai testi delle interviste si estraggono frasi, si codificano, si raggruppano in categorie e poi in temi.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">approccio induttivo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">grounded theory<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">codifica manuale da più ricercatori<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">NVivo 14<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">verbatim + frequenze<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">content analysis su vantaggi/svantaggi, touchpoint per fase, take away<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">codici → categorie → temi (Braun e Clarke)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">saturazione tematica<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <div>Approccio <b>induttivo<\u002Fb> (grounded theory). Codifica <b>manuale<\u002Fb> da più ricercatori per ridurre la soggettività, con il supporto di <b>NVivo 14<\u002Fb> (gestione dei codici e grafici).<\u002Fdiv>\n      <div>Si estraggono i <b>verbatim<\u002Fb> più rilevanti e per le domande chiave si calcolano le <b>frequenze assolute<\u002Fb>. <b>Content analysis<\u002Fb> su tre temi: vantaggi e svantaggi della transizione digitale, touchpoint usati in pre-purchase, purchase e post-purchase, take away finali. Serve a passare da percezioni soggettive a un'analisi strutturata e riproducibile (Hsieh e Shannon 2005).<\u002Fdiv>\n      <div><b>Iter<\u002Fb> (Braun e Clarke): familiarizzazione con i dati grezzi → estrazione dei verbatim → codici → categorie → temi → rifinitura → stesura. Si ripete finché tutto è codificato.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n    <details open=\"{{ true }}\" style=\"background:var(--color-accent-2-100);color:#201e1d;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;border:2px solid var(--color-accent-2-500);\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px\"><h4 style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin:0;color:var(--color-accent-2-800)\">Le 5 fasi di validità<\u002Fh4><span style=\"display:flex;gap:6px;align-items:center;flex:none\"><span style=\"padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;font-weight:700;font-size:11.5px;white-space:nowrap;opacity:.85\">p. 69–70 · Tab. 5.3<\u002Fspan><span style=\"font-size:13px;opacity:.6\">▾<\u002Fspan><\u002Fspan><\u002Fsummary><div style=\"display:flex;flex-direction:column;gap:9px;margin-top:10px;font-size:14px;line-height:1.55\"><div style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;background:var(--color-accent-100);border-radius:14px;padding:9px 12px;text-wrap:pretty\">Il rigore si garantisce in ogni passaggio, dalla scrittura delle domande alla doppia codifica.<\u002Fdiv><sc-if value=\"{{ modoRipasso }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-wrap:wrap;gap:5px\"><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">1 creazione del questionario (letteratura + revisione esperti)<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">2 formulazione: niente domande complesse o suggestive<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">3 conduzione: privacy e GDPR, clima di fiducia<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">4 gestione: registrazione, trascrizione, traduzione, NVivo<\u002Fspan><span style=\"background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:12.5px\">5 analisi: doppia codifica e follow-up<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ modoStudio }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px\">\n        <li><b>Creazione del questionario<\u002Fb> da letteratura e input di retailer ed esperti, rivisto da accademici e professionisti → domande coerenti con gli obiettivi.<\u002Fli>\n        <li><b>Formulazione<\u002Fb>: niente domande complesse o suggestive, linguaggio accessibile e imparziale → risposte sincere, meno bias.<\u002Fli>\n        <li><b>Conduzione<\u002Fb>: tutela della privacy (GDPR) ed etica → clima di fiducia.<\u002Fli>\n        <li><b>Gestione delle risposte<\u002Fb>: registrazione, trascrizione, pulizia, traduzione → analisi oggettiva con NVivo 14.<\u002Fli>\n        <li><b>Analisi e verifica<\u002Fb>: <b>doppia codifica<\u002Fb>, divergenze risolte con il confronto, follow-up → accuratezza e coerenza.<\u002Fli>\n      <\u002Fol>\n      <div style=\"border:2px dashed var(--color-neutral-400);border-radius:14px;padding:8px 11px;font-size:13px\"><b>Per ricordare ·<\u002Fb> C-F-C-G-A: Creo, Formulo, Conduco, Gestisco, Analizzo.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n  <div style=\"background:#fff;color:#201e1d;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);font-size:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between\"><b style=\"font-family:var(--font-heading);font-size:21px\">Allenati sul capitolo 5<\u002Fb><span style=\"font-size:12.5px;color:var(--color-neutral-700)\">Ogni risposta conta in Winter Arc<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ p5.tab.tabs }}\" as=\"tb\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border-radius:999px;min-height:38px;padding:6px 14px;background:{{ tb.bg }};color:{{ tb.fg }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <sc-if value=\"{{ p5.tab.is_mc }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Clicca la risposta: la correzione è immediata. {{ p5.mc.punteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p5.mc.reset }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">Rifai<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p5.mc.items }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--color-neutral-200);padding-top:10px\">\n        <div style=\"font-weight:700\">{{ m.num }}. {{ m.q }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px\"><sc-for list=\"{{ m.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13.5px;text-align:left;border-radius:14px;min-height:44px;padding:8px 12px;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.txt }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <sc-if value=\"{{ m.done }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:{{ m.esitoColor }}\">{{ m.esito }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ p5.tab.is_aperte }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:13px\"><span style=\"color:var(--color-neutral-700)\">Rispondi a voce o per scritto, poi apri la risposta modello. {{ p5.quiz.conteggio }}<\u002Fspan><button sc-camel-on-click=\"{{ p5.quiz.toggleFiltro }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ p5.quiz.filtroLabel }}<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ p5.quiz.items }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:7px;border:2px solid {{ d.bordo }};border-radius:16px;padding:10px 12px\">\n        <div style=\"display:flex;gap:8px;align-items:flex-start\"><span style=\"flex:none;padding:1px 8px;border-radius:999px;background:{{ d.tipoBg }};font-size:11.5px;font-weight:700\">{{ d.tipo }}<\u002Fspan><b style=\"flex:1\">{{ d.num }}. {{ d.q }}<\u002Fb><span style=\"flex:none;font-size:11.5px;color:var(--color-neutral-700)\">{{ d.stato }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><button sc-camel-on-click=\"{{ d.toggle }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-neutral-200);color:var(--color-neutral-900)\">{{ d.btnLabel }}<\u002Fbutton><button sc-camel-on-click=\"{{ d.sapevo }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-accent-2-200);color:var(--color-accent-2-900)\">La sapevo<\u002Fbutton><button sc-camel-on-click=\"{{ d.noSapevo }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:var(--color-accent-200);color:var(--color-accent-900)\">Non la sapevo<\u002Fbutton><sc-if value=\"{{ d.custom }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ d.del }}\" style=\"border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;min-height:40px;padding:8px 14px;min-height:36px;padding:5px 12px;font-size:12.5px;background:transparent;color:var(--color-neutral-700)\">Elimina<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n        <sc-if value=\"{{ d.open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:var(--color-neutral-100);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.55\">{{ d.a }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv><\u002Fsc-for>\n      <sc-if value=\"{{ p5.quiz.vuoto }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:var(--color-accent-2-800)\">Nessuna domanda da rivedere: tutte risposte giuste l'ultima volta.<\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:6px;background:var(--color-neutral-100);border-radius:16px;padding:12px\"><b style=\"font-size:13.5px\">Aggiungi una tua domanda<\u002Fb><input value=\"{{ p5.quiz.dq }}\" sc-camel-on-change=\"{{ p5.quiz.setQ }}\" placeholder=\"Domanda\" style=\"font:inherit;font-size:14px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--color-neutral-300);background:#fff;color:#201e1d;width:100%;box-sizing:border-box

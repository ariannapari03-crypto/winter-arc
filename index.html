<script>// Fuori da claude.ai: stessa interfaccia che l'app usa dentro gli artifact (claude.use),
// ma i dati restano nel telefono e Claude si chiama tramite /api/claude.
(function () {
  if (window.claude) return;
  const CHIAVE_PW = "winter-arc-password";
  const leggiPw = () => { try { return localStorage.getItem(CHIAVE_PW); } catch (e) { return null; } };
  const password = () => {
    let p = leggiPw();
    if (!p) {
      p = window.prompt("Password dell'app (quella che hai messo in APP_PASSWORD su Vercel)");
      if (p) try { localStorage.setItem(CHIAVE_PW, p); } catch (e) {}
    }
    return p;
  };
  const inBase64 = (blob) => new Promise((ok, ko) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1]);
    r.onerror = ko;
    r.readAsDataURL(blob);
  });

  async function chiama(input, opts = {}) {
    const prompt = typeof input === "string" ? input : input.map((m) => m.content).join("\n\n");
    const images = opts.images
      ? await Promise.all([...opts.images].map(async (b) => ({ media_type: b.type || "image/jpeg", data: await inBase64(b) })))
      : [];
    const pw = password();
    if (!pw) throw { code: "password" };
    let r;
    try {
      r = await fetch("/api/claude", {
        method: "POST",
        headers: { "content-type": "application/json", "x-app-password": pw },
        body: JSON.stringify({ prompt, images, tier: opts.modelTier || "default" }),
        signal: opts.signal,
      });
    } catch (e) {
      throw { code: e && e.name === "AbortError" ? "cancelled" : "upstream_error" };
    }
    const j = await r.json().catch(() => ({ code: "upstream_error" }));
    if (r.status === 401) { try { localStorage.removeItem(CHIAVE_PW); } catch (e) {} throw { code: "password" }; }
    if (!r.ok) throw { code: j.code || "upstream_error", message: j.message };
    if (j.code === "refusal") throw { code: "refusal" };
    if (opts.onText) opts.onText({ text: j.text, delta: j.text });
    return { text: j.text, truncated: !!j.truncated };
  }

  const sample = (input, opts) => chiama(input, opts);
  sample.json = async (input, opts) => {
    const { text, truncated } = await chiama(input, opts);
    if (truncated) throw { code: "invalid_json", text };
    const t = text.trim();
    const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
    const prove = [t, (t.match(/```(?:json)?\s*([\s\S]*?)```/) || [])[1], a >= 0 && b > a ? t.slice(a, b + 1) : null];
    for (const x of prove) { if (!x) continue; try { return JSON.parse(x); } catch (e) {} }
    throw { code: "invalid_json", text };
  };
  sample.limits = async () => ({ maxPromptBytes: 262144, images: { maxCount: 4, maxInputBytes: 5e6, mediaTypes: ["image/jpeg", "image/png", "image/webp"] } });

  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return { saved: true };
    },
  };

  // Archivio condiviso tra dispositivi (/api/db). Se non è configurato su Vercel, l'app resta sul dispositivo.
  async function dbApi(body) {
    const pw = password();
    if (!pw) throw { code: "not_granted" };
    let r;
    try {
      r = await fetch("/api/db", { method: "POST", headers: { "content-type": "application/json", "x-app-password": pw }, body: JSON.stringify(body) });
    } catch (e) { throw { code: "unavailable" }; }
    if (r.status === 401) { try { localStorage.removeItem(CHIAVE_PW); } catch (e) {} throw { code: "not_granted" }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: r.status === 501 ? "capability_disabled" : j.code || "unavailable" };
    return j;
  }
  const istantanea = (id, data) => ({ id, exists: data != null, data: () => (data == null ? undefined : data), metadata: { fromCache: false, hasPendingWrites: false } });
  function documento(path) {
    const i = path.lastIndexOf("/"), col = path.slice(0, i), id = path.slice(i + 1);
    const leggi = async () => istantanea(id, (await dbApi({ op: "get", col, id })).data);
    return {
      id, path,
      get: leggi,
      set: async (data) => { await dbApi({ op: "set", col, id, data }); },
      update: async (parte) => { const s = await leggi(); await dbApi({ op: "set", col, id, data: { ...(s.data() || {}), ...parte } }); },
      delete: async () => { await dbApi({ op: "del", col, id }); },
      onSnapshot(next, errore) {
        // Controlla quando l'app torna in primo piano e ogni 20 secondi mentre è aperta.
        let ultimo = null;
        const giro = async () => {
          try { const s = await leggi(); const t = JSON.stringify(s.data() ?? null); if (t !== ultimo) { ultimo = t; next(s); } }
          catch (e) { if (errore && e && e.code === "not_granted") errore(e); }
        };
        giro();
        const timer = setInterval(() => { if (document.visibilityState === "visible") giro(); }, 20000);
        const visibile = () => { if (document.visibilityState === "visible") giro(); };
        document.addEventListener("visibilitychange", visibile);
        return () => { clearInterval(timer); document.removeEventListener("visibilitychange", visibile); };
      },
    };
  }
  const collezione = (path) => ({
    path,
    doc: (id) => documento(path + "/" + id),
    get: async () => { const docs = Object.entries((await dbApi({ op: "list", col: path })).data || {}).map(([id, d]) => istantanea(id, d)); return { docs, size: docs.length, empty: !docs.length }; },
  });
  const db = { doc: documento, collection: collezione };
  const utente = { id: async () => "io", isOwner: () => true, canEdit: () => true, can: () => true };
  let dbPronto = null;
  const usaDb = () => (dbPronto ||= dbApi({ op: "ping" }).then(() => db).catch(() => null));

  window.claude = {
    use: async (n) => (n === "sample" ? sample : n === "downloads" ? downloads : n === "db" ? usaDb() : n === "user" ? usaDb().then((d) => (d ? utente : null)) : null),
  };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
})();
</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: una colonna da telefono, navigazione in basso. Winter arc: notte fredda come base, ghiaccio come accento, oro solo per i traguardi; condensato pesante per i numeri, corsivo serif come contrappunto elegante. */
:root{
  --bg:#090b0f; --surface:#11151b; --ink:#eef2f6; --muted:#8994a1; --line:#222a34;
  --sand:#1a212a; --sand-ink:#dfe8f1; --accent:#a8d2ff; --accent-ink:#06121f; --gold:#d9b871;
  --ok:#7fd6a8; --warn:#e8c46a; --bad:#ff8a8a; --glow:rgba(168,210,255,.10);
  --c-fr:#b9a3ff; --c-tm:#7fb8ff; --c-eb:#ff9cc0; --c-b2b:#7fd6a8; --c-en:#e8cf7a; --c-lux:#ebab88;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --on-sc:#090b0f; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f5f8; --surface:#ffffff; --ink:#0b0f14; --muted:#5a6572; --line:#dbe1e8;
  --sand:#e4e9ef; --sand-ink:#0b0f14; --accent:#1d5a94; --accent-ink:#ffffff; --gold:#946f1f;
  --ok:#23784e; --warn:#9a6a10; --bad:#b23a3a; --glow:rgba(29,90,148,.08);
  --c-fr:#6b4fb0; --c-tm:#22609a; --c-eb:#b8456f; --c-b2b:#2f7d55; --c-en:#80661a; --c-lux:#9b4d2e;
  --on-sc:#ffffff; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#0b0f14; --muted:#5a6572; --line:#dbe1e8;
  --sand:#e4e9ef; --sand-ink:#0b0f14; --accent:#1d5a94; --accent-ink:#ffffff; --gold:#946f1f;
  --ok:#23784e; --warn:#9a6a10; --bad:#b23a3a; --glow:rgba(29,90,148,.08);
  --c-fr:#6b4fb0; --c-tm:#22609a; --c-eb:#b8456f; --c-b2b:#2f7d55; --c-en:#80661a; --c-lux:#9b4d2e;
  --on-sc:#ffffff; color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05;text-transform:uppercase}
h1{font-size:2.2rem}
h2{font-size:1.5rem;margin-block:28px 10px}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

header.top{padding-block:20px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sync{font-size:.78rem;color:var(--muted)}

/* esame più vicino */
.next{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:12px}
.next .big{font-family:var(--f-display);font-size:3.2rem;font-weight:800;line-height:.9}
.next .big small{display:block;font-size:.9rem;letter-spacing:.08em}
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px}
.chip{flex:0 0 auto;border-radius:10px;background:var(--sand);color:var(--sand-ink);padding:6px 10px;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.02em;border-left:5px solid var(--sc,var(--accent))}
.chip.past{opacity:.45}

/* blocchi della giornata */
.day{display:flex;flex-direction:column;gap:8px}
.blk{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.blk .t{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.1;color:var(--muted)}
.blk .w{min-width:0}
.blk .w b{display:block}
.blk.kind-work{background:transparent;border-style:dashed}
.blk.kind-exam{border:2px solid var(--bad)}
.tick{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-weight:700}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc);margin-right:6px;vertical-align:baseline}

/* unità */
.unit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.unit:first-child{border-top:0}
.unit .meta{font-size:.8rem;color:var(--muted)}
.phases{display:flex;gap:4px}
.ph{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:.72rem;font-weight:700;color:var(--muted)}
.ph.on{background:var(--sc);border-color:var(--sc);color:var(--on-sc)}
.late{color:var(--bad);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.subj{border-left:6px solid var(--sc)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--lc);vertical-align:-1px}

/* settimane */
.wk{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.wk.now{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:var(--r);padding-inline:10px;border-top-color:transparent}
.wk .d{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.1}
.wk .items{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:.92rem}

/* metodo */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px}
.step::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:800;font-size:1.6rem;width:40px;height:40px;border-radius:10px;background:var(--sand);color:var(--sand-ink);display:grid;place-items:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* form */
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:7px 11px;font-size:.85rem}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:140px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:60px;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}

/* navigazione */
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bot .in{display:flex;gap:2px;max-width:720px;width:100%;justify-content:space-between}
nav.bot button{flex:1;border:0;background:transparent;padding:8px 2px;border-radius:10px;font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
nav.bot button[aria-current="page"]{background:var(--sand);color:var(--sand-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.88rem;z-index:6}
@media (prefers-reduced-motion:no-preference){.blk,.card{transition:background .15s}}

/* gioco: livello, percorso a caselle, medaglie */
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;width:100%;text-align:left}
.lvl .n{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;background:var(--accent);color:var(--accent-ink);border-radius:10px;width:44px;height:44px;display:grid;place-items:center}
.lvl .tt{font-family:var(--f-display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.xpbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.streak{text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1}
.streak small{display:block;font-family:var(--f-body);font-weight:400;font-size:.68rem;color:var(--muted)}
.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.board svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.board svg.path polyline{fill:none;stroke:var(--sand);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.cell{position:relative;aspect-ratio:1;border-radius:12px;border:2px solid var(--sc,var(--line));background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;min-width:0;text-align:left;color:var(--ink);overflow:hidden}
.cell .no{font-family:var(--f-display);font-weight:800;font-size:1rem;line-height:1}
.cell .lb{font-family:var(--f-display);font-weight:600;font-size:.72rem;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell .dt{font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.done{background:var(--sc,var(--accent));color:var(--on-sc)}
.cell.done .dt{color:var(--on-sc);opacity:.85}
.cell.k-esame{background:var(--ink);color:var(--bg);border-color:var(--sc)}
.cell.k-esame .dt{color:var(--bg);opacity:.75}
.cell.k-esame.done{background:var(--sc);color:var(--on-sc)}
.cell.k-laurea,.cell.k-start{background:var(--sand);color:var(--sand-ink);border-color:var(--sand-ink)}
.cell.k-laurea .dt,.cell.k-start .dt{color:var(--sand-ink)}
.cell.sel{outline:3px solid var(--accent);outline-offset:2px}
.cell.ghost::after{content:"OGGI";position:absolute;right:4px;top:4px;font-size:.55rem;font-weight:700;letter-spacing:.06em;padding:1px 4px;border-radius:4px;background:var(--bg);color:var(--ink);border:1px dashed var(--ink)}
.pawn{position:absolute;right:3px;bottom:3px;width:46%;max-width:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
@media (prefers-reduced-motion:no-preference){.pawn{animation:hop 1.6s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}}
.sheet{position:sticky;bottom:84px;z-index:3;margin-top:12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.badge b{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.badge.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge:not(.on){opacity:.55}
.die{width:64px;height:64px;border-radius:14px;border:2px solid var(--ink);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:2.2rem;display:grid;place-items:center;color:var(--ink)}
.die:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1}
.stats span{font-size:.72rem;color:var(--muted)}
.lvlup{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px}
.lvlup .box{background:var(--surface);color:var(--ink);border-radius:18px;padding:24px;text-align:center;max-width:340px;width:100%}
.lvlup .box .big{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:1;color:var(--accent)}
/* ---- winter arc ---- */
body{margin:0;background:radial-gradient(120% 50% at 50% 0%,var(--glow),transparent 60%) no-repeat,var(--bg);letter-spacing:.005em}
h1{font-size:clamp(2.8rem,13vw,4.2rem);font-weight:900;line-height:.86;letter-spacing:-.005em}
h1 em{font-family:var(--f-serif);font-weight:400;font-style:italic;text-transform:none;letter-spacing:0;color:var(--accent)}

const MOTTI=["Disciplina, non motivazione.","Un blocco alla volta.","Il lavoro di oggi è l'esame di gennaio.","Nessuno lo vede. Tu sì.","Pochi minuti, ogni giorno.","Fai la cosa difficile per prima.","Silenzio, cuffie, avanti.","Costante batte intenso.","Il percorso si fa una casella per volta.","Prima la mappa, poi il mondo."];
/* ============ PALAZZI PER MATERIA ============ */
// Ogni materia ha il suo palazzo; quando un blocco arriva a P gli si assegnano le prossime tappe libere.
// Assegnazione scelta dalla studentessa: chi ha bisogno di più tappe prende i luoghi più grandi.
const PAL_PROPOSTI=[["Scuola di ballo","eb"],["Palestra Vanilla","b2b"],["Campus Bocconi","lux"],["Casa a Milano","fr"],["Casa a Maranello","en"]];
const nuovoPid=()=>"p"+Math.random().toString(36).slice(2,8);
const palDaPid=pid=>S.palazzi.find(p=>p.id===pid);
const palDi=mid=>palDaPid(S.palMat?.[mid]);
function prossimaTappa(pid){return 1+Math.max(0,...Object.values(S.tappe||{}).filter(t=>t.pid===pid).map(t=>t.a))}
function avviaPalazzi(){
  let cambiato=false; S.palMat=S.palMat||{}; S.tappe=S.tappe||{};
  S.palazzi.forEach(p=>{if(!p.id){p.id=nuovoPid(); cambiato=true}});
  if((S.palV||0)<2){ // palazzi per materia: campus intero, scuola di ballo, palestra; niente Quadrilatero
    const trova=n=>S.palazzi.find(x=>x.nome.toLowerCase()===n.toLowerCase());
    const bocc=trova("Bocconi"); if(bocc && !trova("Campus Bocconi")) bocc.nome="Campus Bocconi";
    const quad=trova("Milano · Quadrilatero della moda"); if(quad && !quad.loci.length) S.palazzi.splice(S.palazzi.indexOf(quad),1);
    if(S.palazzi[0] && !S.palMat.tm) S.palMat.tm=S.palazzi[0].id;
    for(const [nome,...mats] of PAL_PROPOSTI){
      let p=trova(nome); if(!p){p={id:nuovoPid(),nome,loci:[]}; S.palazzi.push(p)}
      mats.forEach(m=>S.palMat[m]=p.id);
    }
    for(const u of unita()) if(S.tappe[u.id] && S.tappe[u.id].pid!==S.palMat[u.s]) delete S.tappe[u.id];
    S.palV=2; cambiato=true;
  }
  if(S.palV<3){ // francese e inglese in due palazzi diversi
    const mar=S.palazzi.find(x=>x.nome.toLowerCase()==="casa a maranello")||(()=>{const p={id:nuovoPid(),nome:"Casa a Maranello",loci:[]}; S.palazzi.push(p); return p})();
    S.palMat.en=mar.id; for(const u of unita()) if(u.s==="en" && S.tappe[u.id] && S.tappe[u.id].pid!==mar.id) delete S.tappe[u.id];
    S.palV=3; cambiato=true;
  }
  if(S.palV<4){ // palazzo di riserva
    if(!S.palazzi.some(x=>x.nome.toLowerCase()==="palestra di milano")) S.palazzi.push({id:nuovoPid(),nome:"Palestra di Milano",loci:[]});
    S.palV=4; cambiato=true;
  }
  const daAssegnare=unita().filter(u=>!u.l && fase(u)>=3 && !S.tappe[u.id] && palDi(u.s)).sort((x,y)=>(x.a||99)-(y.a||99));
  for(const u of daAssegnare){const pid=S.palMat[u.s], k=Math.min(8,Math.max(4,Math.ceil((u.p||30)/6))), da=prossimaTappa(pid);
    S.tappe[u.id]={pid,da,a:da+k-1}; cambiato=true}
  return cambiato;
}
function tappeTesto(u){const t=S.tappe?.[u.id], p=t&&palDaPid(t.pid); if(!p) return "";
  const nomi=[p.loci[t.da-1],p.loci[t.a-1]];
  return `${esc(p.nome)} · tappe ${t.da}–${t.a}${nomi[0]?`: ${esc(nomi[0])}${nomi[1]?" → "+esc(nomi[1]):""}`:""}${t.a>p.loci.length?' <span class="late">(aggiungi tappe al palazzo)</span>':""}`}
/* ============ RIPASSI DILAZIONATI ============ */
// Ogni blocco di studio entra in calendario quando arriva alla Mappa. Intervalli che crescono (≈1, 3, 7, 14, 30 giorni)
// in base al voto; l'ultimo ripasso cade sempre 2 giorni prima dell'esame della materia.
const RIP_MIN=5;
const capRip=s=>{const d=parse(s).getDay(); return d===0?12:d===6?5:3};
function ripAttivo(u){const m=materia(u.s); return !u.l && m && !S.superati?.[m.id]}
function avviaRip(){ let cambiato=false; S.rip=S.rip||{};
  for(const u of unita()) if(!u.l && fase(u)>=2 && !S.rip[u.id]){S.rip[u.id]={n:0,int:1,ease:2.3,next:addDays(OGGI,1),log:[]}; cambiato=true}
  return cambiato }
function ripDovuti(s){
  return unita().filter(u=>{const r=S.rip?.[u.id]; if(!r||!ripAttivo(u)) return false; const m=materia(u.s); if(m.esame<s) return false; return s===OGGI?r.next<=s:r.next===s})
    .sort((a,b)=>{const ra=S.rip[a.id], rb=S.rip[b.id]; return ra.next!==rb.next?(ra.next<rb.next?-1:1):(materia(a.s).esame<materia(b.s).esame?-1:1)});
}
function ripassa(id,voto){
  const r=S.rip?.[id], u=unita().find(x=>x.id===id); if(!r||!u) return;
  let int;
  if(voto===2){int=r.n===0?3:Math.round(Math.max(r.int,1)*r.ease); r.ease=Math.min(2.8,r.ease+.1)}
  else if(voto===1){int=Math.max(2,Math.round(r.int*1.2)); r.ease=Math.max(1.3,r.ease-.15)}
  else {int=1; r.ease=Math.max(1.3,r.ease-.2)}
  let next=addDays(OGGI,int); const lim=addDays(materia(u.s).esame,-2);
  if(OGGI<lim && next>lim) next=lim;
  r.n++; r.int=int; r.next=next; r.log=[...(r.log||[]),[OGGI,voto]].slice(-20);
  if(r.n>=3 && voto===2 && fase(u)<4) S.fasi[id]=4;
  salva(); render();
}
function ripRiga(u){const r=S.rip[u.id], m=materia(u.s), rit=diff(r.next,OGGI);

        <button class="btn" type="submit">Aggiungi</button></form>

function vMetodo(){

  <p class="muted">Il tuo problema non è il tempo: è che leggere ti spegne. Quindi la lettura sparisce quasi del tutto. Ogni blocco passa per quattro fasi, e solo la seconda richiede di stare seduta.</p>
  <div class="steps" style="margin-top:14px">

    <div class="step"><div><b>Mappa (M)</b><p class="small muted">La sera dopo, 2 pomodori da 20'. Prima scrivi a memoria lo scheletro del capitolo, poi apri il testo solo per controllare titoli, grafici e definizioni. Così il testo lo consulti, non lo leggi, e non ti addormenti. L'Assistente può prepararti lo schema da incollare in MindMeister o Xmind.</p></div></div>
    <div class="step"><div><b>Palazzo (P)</b><p class="small muted">Liste, framework e nomi (es. le leve del category management, i casi Gucci/Bottega Veneta/Ferrari) vanno nelle tappe del palazzo. Un palazzo diverso per materia, o un'ala diversa. Le tappe le scrivi nella scheda Altro; l'Assistente propone le immagini.</p></div></div>
    <div class="step"><div><b>Ripassa (R)</b><p class="small muted">Da quando fai la mappa, l'app ti programma i ripassi: dopo circa 1, 3, 7, 14 e 30 giorni. Se non ricordavi tornano prima, se ricordavi bene si allontanano, e l'ultimo cade sempre 2 giorni prima dell'esame. Ogni ripasso dura circa 5 minuti: giro del palazzo a mente e 2 domande a voce. Al terzo ripasso andato bene il blocco diventa R da solo.</p></div></div>
  </div>
  <p class="small muted" style="margin-top:12px"><b>Blocchi a pagine (≈):</b> sono indicativi. Chiudi sempre a fine paragrafo o capitolo, anche se sfori di qualche pagina, e riparti da lì il blocco dopo.</p>
  <h2>Trasformare i materiali in audio</h2>

    <tr><td>The Future of Luxury CX</td><td>ProQuest</td><td>Di solito ProQuest permette di scaricare i capitoli in PDF entro un limite: scaricali e caricali nel lettore. Altrimenti lettura vocale del browser.</td></tr>

  <p class="small muted" style="margin-top:8px">Scegli una voce inglese: una voce italiana su testi inglesi è faticosa. Nell'Assistente c'è anche un lettore: incolli un testo e lo ascolti.</p>
  <h2>Se devi proprio leggere</h2>
  <div class="card stack small">
    <p><b>Leggi e ascolta insieme.</b> Testo davanti e audio a 1,3×: l'audio ti trascina e non ti lascia scivolare.</p>

    <p><b>Parte 2:</b> rispondi sempre con parole tue e conta le parole. Copiare dal testo vale zero.</p>

  <h2>La settimana tipo</h2>

const AZIONI={
  mappa:{lab:"Schema per la mappa",tier:"default",p:`Trasforma il materiale in uno schema per una mappa concettuale. Formato: elenco indentato con due spazi per livello, massimo 4 livelli, etichette brevi (max 6 parole), niente frasi lunghe, così che si possa incollare in MindMeister o Xmind. Il nodo centrale è il tema del testo. Mantieni in inglese i termini tecnici del corso e aggiungi la traduzione italiana tra parentesi solo se aiuta. Alla fine, una riga "Da fissare nel palazzo:" con le 5–8 liste o nomi più difficili da ricordare.`},
  palazzo:{lab:"Immagini per il palazzo",tier:"default",p:`Aiutami a fissare i concetti chiave nel mio palazzo della memoria. Scegli dal materiale i concetti più importanti (al massimo uno per tappa, nell'ordine logico del testo) e per ognuno inventa un'immagine mentale vivida, esagerata, concreta, con movimento e possibilmente buffa, ambientata in quella tappa. Formato per ogni riga: "Tappa — concetto — immagine". Poi una riga finale "Percorso in una frase" che li ripassa tutti.`},

  mail:{lab:"Correggi il mio mail di prova (francese)",tier:"default",libero:true,p:`Il materiale è un mail scritto da me in francese per l'esame (consegna tipica: reclamo, prenotazione, comunicazione professionale, min. 150 parole). Correggilo con la griglia d'esame: formato /2 (mittente, destinatario, oggetto, formula d'apertura tipo "Madame, Monsieur", formula di chiusura tipo "Bien cordialement", firma), contenuto /3, lingua /3. Dai il punteggio per voce, elenca gli errori di lingua con la correzione e una spiegazione breve in italiano, conta le parole, poi riscrivi il mail corretto.`},

function parla(t){
  const note=document.getElementById("ai-note");
  try{ if(!("speechSynthesis" in window)){note.textContent="Questo browser non ha la sintesi vocale.";return}
    speechSynthesis.cancel();
    const rate=+document.getElementById("ai-rate").value||1.2;
    const parti=t.match(/[^.!?\n]{1,220}[.!?\n]*/g)||[t];
    const voci=speechSynthesis.getVoices();
    const ingl=(t.match(/\b(the|and|of|is|to)\b/gi)||[]).length > (t.match(/\b(il|e|di|che|la)\b/gi)||[]).length;
    const voce=voci.find(v=>v.lang?.startsWith(ingl?"en":"it"));
    parti.forEach(p=>{const u=new SpeechSynthesisUtterance(p);u.rate=rate;u.lang=ingl?"en-GB":"it-IT";if(voce)u.voice=voce;speechSynthesis.speak(u)});
  }catch(e){note.textContent="La lettura ad alta voce non è disponibile qui."}
}

function carScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error("script"));document.head.appendChild(s)})}
async function pdfjs(){ if(window.pdfjsLib) return window.pdfjsLib;
  await carScript(PDFJS+"pdf.worker.min.js"); await carScript(PDFJS+"pdf.min.js"); return window.pdfjsLib }
function aBlob(canvas){return new Promise(ok=>canvas.toBlob(b=>ok(b),"image/jpeg",.75))}
async function rimpicciolisci(src,w,h){const sc=Math.min(1,1400/Math.max(w,h)), c=document.createElement("canvas");
  c.width=Math.round(w*sc); c.height=Math.round(h*sc); c.getContext("2d").drawImage(src,0,0,c.width,c.height); return aBlob(c)}
async function pagineDa(files,log){
  const out=[];
  for(const f of files){
    if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
      const lib=await pdfjs(); const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
      for(let i=1;i<=doc.numPages;i++){ log(`Preparo ${f.name}: pagina ${i} di ${doc.numPages}`);
        const pg=await doc.getPage(i), v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:Math.min(2,1400/Math.max(v0.width,v0.height))});
        const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
        await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        const tc=await pg.getTextContent();
        out.push({n:out.length+1, testo:tc.items.map(t=>t.str).join(" ").replace(/\s+/g," ").trim().slice(0,2500), img:await aBlob(c)}) }
    } else if(f.type.startsWith("image/")){
      const bm=await createImageBitmap(f); out.push({n:out.length+1, testo:"", img:await rimpicciolisci(bm,bm.width,bm.height)})
    }
  }
  return out;
}

/* ============ GIOCO ============ */
const TITOLI=[[1,"Matricola in trasferta"],[3,"Pendolare dell'ascolto"],[5,"Cartografa di mappe"],[7,"Custode del palazzo"],[10,"Sopravvissuta alla sessione"],[13,"Laureanda"],[16,"Quasi dottoressa"],[19,"Dottoressa"]];
const vals=o=>Object.values(o||{});
function giorniFatti(){return Object.entries(S.fatti||{}).filter(([k,v])=>k!=="prep"&&vals(v).some(Boolean)).map(([k])=>k)}
function xpTotale(){
  let x=0;
  for(const v of vals(S.fatti)) x+=vals(v).filter(Boolean).length*10;
  x+=vals(S.fasi).reduce((a,f)=>a+f,0)*15;
  x+=vals(S.tesi).filter(Boolean).length*50 + vals(S.stageFatti).filter(Boolean).length*30;
  x+=Object.keys(S.superati||{}).length*200;
  x+=Object.keys(S.palestra||{}).length*10;
  x+=vals(S.dadi).reduce((a,n)=>a+n,0)*5;
  x+=vals(S.rip).reduce((a,r)=>a+(r.n||0),0)*5;
  x+=xpMappe();
  return x;
}
const livelloDi=x=>Math.floor(Math.sqrt(x/50))+1, sogliaLiv=l=>50*(l-1)*(l-1);
const titoloDi=l=>TITOLI.filter(t=>t[0]<=l).pop()[1];
function serie(){ // giorni consecutivi con almeno un blocco fatto, fino a oggi (o ieri)
  const set=new Set(giorniFatti()); let d=set.has(OGGI)?OGGI:addDays(OGGI,-1), n=0;
  while(set.has(d)){n++; d=addDays(d,-1)}
  return n;
}
function caselle(){
  const L=[];
  unita().forEach(u=>{ if(!u.a) return;
    L.push({k:u.l?"lingua":"u",id:u.id,s:u.s,lb:materia(u.s)?.breve||"",t:u.t,due:addDays(lunediDi(u.l?u.a:u.a+1),6),done:fase(u)>=(u.l?1:3),u}) });
  MATERIE.forEach(m=>L.push({k:"esame",id:"x-"+m.id,s:m.id,lb:m.breve,t:"Esame · "+m.nome,due:m.esame,done:!!S.superati?.[m.id],m}));
  TESI.forEach(t=>L.push({k:"tesi",id:t.id,lb:"Tesi",t:t.t,x:t.x,due:scadTesi(t)||"2027-06-30",done:!!S.tesi?.[t.id]}));
  STAGE.forEach(t=>L.push({k:"stage",id:t.id,lb:"Stage",t:t.t,x:t.x,due:addDays(fineStage(),t.off),done:!!S.stageFatti?.[t.id]}));
  MATERIE.forEach(m=>L.push({k:"iscr",id:"i-"+m.id,s:m.id,lb:"Iscrizione",t:`Iscriviti all'esame di ${m.nome} (${fmtLong(m.esame)}) su yoU@B`,x:`Iscrizioni aperte dal ${fmtD(m.iscr[0])} al ${fmtD(m.iscr[1])}. Puoi farle tutte il 2 novembre.`,due:m.iscr[1],done:!!S.iscritto?.[m.id]}));
  PREP.forEach(([id,t])=>L.push({k:"prep",id,lb:"Preparazione",t,due:addDays(W1,-1),done:!!S.fatti.prep?.[id]}));
  const ord={prep:-1,u:0,lingua:1,iscr:2,stage:3,tesi:4,esame:5};
  L.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:ord[a.k]-ord[b.k]);
  return [{k:"start",id:"start",lb:"Partenza",t:"Primo giorno di stage",due:W1,done:true}, ...L, {k:"laurea",id:"laurea",lb:"Laurea",t:"Laurea · luglio 2027",due:"2027-07-31",done:false}];
}
const MEDAGLIE=[
  ["Primo passo","Il primo blocco spuntato",c=>c.giorni>=1],
  ["Prima mappa","Una mappa completata",c=>c.mappe>=1],

  ["Primo esame","Il primo esame superato",c=>c.superati>=1],

function contesto(){
  const C=caselle(), fatte=C.filter((c,i)=>i>0&&c.k!=="laurea"&&c.done).length, attese=C.filter((c,i)=>i>0&&c.k!=="laurea"&&c.due<OGGI).length;
  const gymWeek=[...Array(Math.max(settimana(OGGI),1))].some((_,i)=>{const l=lunediDi(i+1);return [...Array(7)].filter((_,j)=>S.palestra?.[addDays(l,j)]).length>=S.palestraTarget});
  return {C,fatte,attese,avanti:fatte-attese,giorni:giorniFatti().length,mappe:unita().filter(u=>!u.l&&fase(u)>=2).length,palazzo:unita().filter(u=>!u.l&&fase(u)>=3).length,
    serie:serie(),gymWeek,faccende:vals(S.casa).reduce((a,w)=>a+vals(w).filter(Boolean).length,0),sei:vals(S.dadi).includes(6),superati:Object.keys(S.superati||{}).length};
}
let selCasella=null; var prevXp=null, prevLiv=null;
const PEDINA=`<svg class="pawn" viewBox="0 0 24 30" aria-hidden="true"><circle cx="12" cy="7" r="5.5" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/><path d="M6 27 L8.5 14 h7 L18 27 Z" fill="var(--accent)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><rect x="4" y="25.5" width="16" height="3.5" rx="1.5" fill="var(--accent)" stroke="#fff" stroke-width="1.2"/></svg>`;
function renderLvl(){
  const x=xpTotale(), l=livelloDi(x), a=sogliaLiv(l), b=sogliaLiv(l+1), sr=serie();
  document.getElementById("lvl").innerHTML=`<span class="eyebrow">Liv. ${l} · ${x} XP</span><span class="big num">${sr}</span><span class="sub">${sr===1?"giorno":"giorni"} di fila</span><span class="xpbar" style="display:block" title="${esc(titoloDi(l))}"><i style="width:${Math.round((x-a)/(b-a)*100)}%"></i></span><span class="tt">${esc(titoloDi(l))}</span>`;
  if(prevXp!==null && x>prevXp){ toast(`+${x-prevXp} XP`); if(l>prevLiv) festa(l) }
  prevXp=x; prevLiv=l;

function festa(l){
  const o=document.createElement("div"); o.className="lvlup";
  o.innerHTML=`<div class="box"><p class="small muted">Livello raggiunto</p><div class="big num">${l}</div><h3 style="margin-top:6px">${esc(titoloDi(l))}</h3><button class="btn" style="margin-top:16px">Avanti</button></div>`;
  o.addEventListener("click",()=>o.remove()); document.body.appendChild(o); coriandoli();

function coriandoli(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const W=c.width=innerWidth, H=c.height=innerHeight, x=c.getContext("2d");
  const cs=getComputedStyle(document.documentElement), col=["--accent","--gold","--ink","--c-tm","--c-lux"].map(v=>cs.getPropertyValue(v).trim()||"#888");
  const P=[...Array(90)].map(()=>({x:W/2,y:H/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,r:Math.random()*6+3,c:col[Math.floor(Math.random()*col.length)],a:Math.random()*6}));
  let t=0; (function f(){ x.clearRect(0,0,W,H); P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++t<90) requestAnimationFrame(f); else c.remove() })();
}
function vPercorso(){
  const K=contesto(), C=K.C, n=C.length, cols=4, rows=Math.ceil(n/cols), pawn=Math.min(K.fatte,n-1), ghost=Math.min(K.attese,n-1);
  const pos=i=>{const r=Math.floor(i/cols), c=r%2?cols-1-i%cols:i%cols; return [r,c]};
  const pts=C.map((_,i)=>{const [r,c]=pos(i);return `${(c+.5)/cols*100},${(r+.5)/rows*100}`}).join(" ");
  let h=`<h2>Il percorso fino alla laurea</h2>
  <div class="stats"><div><b class="num">${pawn}</b><span>casella su ${n-1}</span></div><div><b class="num" style="color:${K.avanti>=0?"var(--ok)":"var(--bad)"}">${K.avanti>0?"+":""}${K.avanti}</b><span>${K.avanti>=0?"avanti":"indietro"} rispetto al piano</span></div><div><b class="num">${K.superati}/6</b><span>esami superati</span></div></div>
  <p class="small muted" style="margin-top:12px">Ogni casella ha una scadenza: un blocco di studio si chiude quando arriva al palazzo. «OGGI» è dove vuole il piano.</p>
  <div class="board" style="grid-template-rows:repeat(${rows},auto)"><svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" vector-effect="non-scaling-stroke"/></svg>`;
  C.forEach((c,i)=>{const [r,co]=pos(i);
    h+=`<button class="cell k-${c.k} ${c.done&&c.k!=="start"?"done":""} ${i===ghost&&ghost!==pawn?"ghost":""} ${selCasella===i?"sel":""}" style="grid-row:${r+1};grid-column:${co+1};${c.s?sc(c.s):c.k==="tesi"||c.k==="prep"?"--sc:var(--accent)":c.k==="stage"?"--sc:var(--muted)":""}" data-cas="${i}" aria-label="Casella ${i}: ${esc(c.t)}">
      <span class="no num">${i}</span><span class="lb">${esc(c.lb)}</span><span class="dt">${c.k==="laurea"?"LUGLIO":c.k==="start"?fmtD(c.due).toUpperCase():c.k==="esame"?"ESAME "+fmtD(c.due).toUpperCase():"ENTRO "+fmtD(c.due).toUpperCase()}</span>${i===pawn?PEDINA:""}</button>`});

  h+=`<h2>Il dado del giorno</h2><div class="card row" style="flex-wrap:nowrap;gap:14px"><button class="die num" id="dado" ${dado||!oggiOk?"disabled":""} aria-label="Tira il dado">${dado||"?"}</button>
    <p class="small">${dado?`Oggi hai tirato ${dado}: +${dado*5} XP. Il prossimo tiro domani.`:oggiOk?"Hai chiuso almeno un blocco oggi: tira il dado per un bonus da 5 a 30 XP.":"Si sblocca quando spunti il primo blocco di oggi nella scheda Oggi."}</p></div>`;
  const on=MEDAGLIE.filter(m=>m[2](K)).length;
  h+=`<h2>Medaglie · ${on}/${MEDAGLIE.length}</h2><div class="badges">${MEDAGLIE.map(([t,d,f])=>`<div class="badge ${f(K)?"on":""}"><b>${esc(t)}</b><span class="small muted">${esc(d)}</span></div>`).join("")}</div>
  <h2>Come si fanno punti</h2><div class="card small stack">
    <p>Blocco della giornata <b>+10</b> · fase di un blocco di studio <b>+15</b> · tappa della tesi <b>+50</b> · tappa dello stage <b>+30</b> · esame superato <b>+200</b> · palestra <b>+10</b> · dado <b>+5 per punto</b> · ripasso <b>+5</b></p>
    <p class="muted">Livelli: ${TITOLI.map(t=>`${t[0]} ${t[1]}`).join(" · ")}</p></div>`;
  return h;
}
function schedaCasella(c){
  let a="";
  if(c.u) a=`<div style="margin-top:8px">${unitRow(c.u)}</div>`;

      :`<form class="row" data-sup="${c.m.id}" style="margin-top:8px;flex-wrap:nowrap"><input type="text" id="voto-${c.m.id}" name="voto" placeholder="${c.m.lingua?"Superato":"Voto, es. 28"}" style="max-width:150px"><button class="btn" type="submit">Superato</button></form>`}
  else if(c.k==="iscr") a=OGGI<c.due&&OGGI<MATERIE.find(m=>"i-"+m.id===c.id).iscr[0]?`<p class="small muted" style="margin-top:8px">Si apre il ${fmtD(MATERIE.find(m=>"i-"+m.id===c.id).iscr[0])}.</p>`:`<div class="row" style="margin-top:8px"><button class="btn ${c.done?"ghost":""}" data-iscr="${c.id.slice(2)}">${c.done?"Segna da fare":"Iscritta"}</button></div>`;
  else if(c.k==="prep") a=`<div class="row" style="margin-top:8px"><button class="btn ${c.done?"ghost":""}" data-prep="${c.id}">${c.done?"Segna da fare":"Fatto"}</button></div>`;
  else if(c.k==="tesi"||c.k==="stage") a=`<div class="row" style="margin-top:8px"><button class="btn ${c.done?"ghost":""}" data-${c.k==="tesi"?"tesi":"stagef"}="${c.id}">${c.done?"Segna da fare":"Fatto"}</button></div>`;
  return `<div class="card sheet" style="${c.s?sc(c.s):""}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tag">${esc(c.lb)} · ${c.k==="laurea"?"luglio 2027":fmtLong(c.due)}</span><button class="btn ghost" data-cas="-1" aria-label="Chiudi">×</button></div>
    <h3 style="margin-top:8px">${esc(c.t)}</h3>${c.x?`<p class="small muted" style="margin-top:4px">${esc(c.x)}</p>`:""}${c.k==="laurea"?`<p class="small muted" style="margin-top:4px">L'ultima casella. Ci arrivi chiudendo tutte le altre.</p>`:""}${a}</div>`;
}

  if(t.id==="sl-quiz"){const ls=lezioni.filter(l=>l.materia===slMateria), qs=ls.flatMap(l=>(l.note.domande||[]).map(q=>({...q,lez:l.titolo})));
    const pick=qs.sort(()=>Math.random()-.5).slice(0,5);
    document.getElementById("sl-quizbox").innerHTML=pick.map(q=>`<details class="flash"><summary>${esc(q.q)}</summary><p class="small" style="margin-top:6px">${esc(q.a)} <span class="sl">${esc(q.lez)}${q.slide?" · sl. "+esc(q.slide):""}</span></p></details>`).join(""); return}
  if(d.iscr){S.iscritto=S.iscritto||{}; S.iscritto[d.iscr]=!S.iscritto[d.iscr]; salva(); render(); return}
  if(d.rip){ripassa(d.rip,+d.voto); return}
  if(d.cas!==undefined){selCasella=+d.cas<0?null:+d.cas; render(); return}
  if(d.nonsup){delete S.superati[d.nonsup]; salva(); render(); return}
  if(t.id==="dado"){if(S.dadi?.[OGGI]) return; S.dadi=S.dadi||{}; let k=0; const el=t;
    const giro=setInterval(()=>{el.textContent=1+Math.floor(Math.random()*6); if(++k>10){clearInterval(giro); const n=1+Math.floor(Math.random()*6); S.dadi[OGGI]=n; salva(); render(); if(n===6) coriandoli()}},70); return}
  if(d.g){giornoVisto=addDays(giornoVisto,+d.g); render(); return}
  if(d.fatto){const s=giornoVisto; S.fatti[s]=S.fatti[s]||{}; S.fatti[s][d.fatto]=!S.fatti[s][d.fatto]; salva(); render(); return}
  if(d.prep){S.fatti.prep=S.fatti.prep||{}; S.fatti.prep[d.prep]=!S.fatti.prep[d.prep]; salva(); render(); return}
  if(d.u){const cur=S.fasi[d.u]||0, f=+d.f; S.fasi[d.u]= cur>=f ? f-1 : f;
    if(S.fasi[d.u]<2 && S.rip) delete S.rip[d.u];
    if(S.fasi[d.u]<3 && S.tappe) delete S.tappe[d.u]; avviaPalazzi(); avviaRip(); salva();
    const det=t.closest("details"); materiaAperta=det?.dataset.mat||materiaAperta; render(); return}
  if(d.stagef){S.stageFatti=S.stageFatti||{}; S.stageFatti[d.stagef]=!S.stageFatti[d.stagef]; salva(); render(); return}
  if(d.tesi){S.tesi=S.tesi||{}; S.tesi[d.tesi]=!S.tesi[d.tesi]; salva(); render(); return}
  if(d.wcasa){S.weekendCasa=S.weekendCasa||{}; if(S.weekendCasa[d.wcasa]) delete S.weekendCasa[d.wcasa]; else S.weekendCasa[d.wcasa]=true; salva(); render(); return}
  if(d.natale){S.natale=d.natale; salva(); render(); return}
  if(d.gym){S.palestra[d.gym]=!S.palestra[d.gym]; if(!S.palestra[d.gym]) delete S.palestra[d.gym]; salva(); render(); return}
  if(d.paldel){const pid=S.palazzi[+d.paldel]?.id; S.palazzi.splice(+d.paldel,1);
    for(const m in S.palMat) if(S.palMat[m]===pid) delete S.palMat[m];
    for(const u in S.tappe) if(S.tappe[u].pid===pid) delete S.tappe[u]; salva(); render(); return}
  if(d.del){S.extra=S.extra.filter(u=>u.id!==d.del); delete S.fasi[d.del]; salva(); render(); toast("Materiale tolto"); return}
  if(d.ai){chiedi(d.ai); return}
  if(t.id==="ai-stop"){ctl?.abort(); return}
  if(t.id==="ai-say"){const o=ultimoOut||document.getElementById("ai-txt").value; if(o.trim()) parla(o); return}
  if(t.id==="ai-shh"){try{speechSynthesis.cancel()}catch(_){}; return}
  if(t.id==="ai-copy"){const o=document.getElementById("ai-out").textContent;
    try{await navigator.clipboard.writeText(o); toast("Copiato")}catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById("ai-out"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Testo selezionato: copialo")} return}
  if(t.id==="pal-add"){S.palazzi.push({id:nuovoPid(),nome:"Nuovo palazzo",loci:[]}); salva(); render(); return}
  if(t.id==="ics"){scaricaIcs(); return}
  if(t.id==="bk-exp"){esportaBackup(); return}
  if(t.id==="bk-ok"){ripristinaBackup(); return}
  if(t.id==="bk-no"){bkInAttesa=null; render(); return}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="sl-form"){e.preventDefault(); const files=document.getElementById("sl-file").files; if(!files.length) return;
    const tit=document.getElementById("sl-tit").value.trim()||files[0].name.replace(/\.[^.]+$/,"");
    creaLezione(files,tit,slMateria).then(l=>{slLavoro=null; slAperta=l.id; render(); coriandoli(); toast("Dispensa pronta")})
      .catch(err=>{slLavoro=null; render(); const c=err?.code;
        toast(c==="cancelled"?"Fermato":c==="vuoto"?"Nessuna pagina leggibile nei file":c==="not_granted"?"Serve il permesso di usare Claude":c==="rate_limited"?"Troppe richieste: riprova tra un minuto":c==="password"?"Password errata: riprova":c==="refusal"?"Claude non ha risposto: prova con meno slide":c==="invalid_json"?"Risposta incompleta: prova con meno slide alla volta":err?.message==="script"?"Non riesco a caricare il lettore PDF: controlla la connessione":"Qualcosa non è andato: riprova")});
    render(); return}
  const sp=e.target.closest("form[data-sup]");
  if(sp){e.preventDefault(); S.superati=S.superati||{}; S.superati[sp.dataset.sup]={voto:String(new FormData(sp).get("voto")||"").trim(),il:OGGI}; salva(); render(); coriandoli(); return}
  const f=e.target.closest("form[data-add]"); if(!f) return; e.preventDefault();
  const s=f.dataset.add, fd=new FormData(f);
  S.extra.push({id:"x"+Date.now().toString(36), s, t:String(fd.get("t")).trim(), p:+fd.get("p")||null, fmt:String(fd.get("f")), a:Math.min(16,Math.max(1,+fd.get("a")||1)), extra:true});
  materiaAperta=s; salva(); render(); toast("Aggiunto al piano");
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="gym-t"){S.palestraTarget=Math.min(7,Math.max(1,+t.value||4)); salva(); render()}
  if(t.dataset.palmat){const m=t.dataset.palmat; if(t.value) S.palMat[m]=t.value; else delete S.palMat[m];
    for(const u of unita()) if(u.s===m && S.tappe?.[u.id] && S.tappe[u.id].pid!==t.value) delete S.tappe[u.id];
    avviaPalazzi(); salva(); render()}
  if(t.id==="ai-mat"){const sel=document.getElementById("ai-pal"); if(sel&&S.palMat?.[t.value]) sel.value=S.palMat[t.value]}
  if(t.dataset.paln){S.palazzi[+t.dataset.paln].nome=t.value.trim()||"Palazzo"; salva()}
  if(t.dataset.pall){S.palazzi[+t.dataset.pall].loci=t.value.split("\n").map(x=>x.trim()).filter(Boolean); salva()}
  if(t.id==="note"){S.note=t.value; salva()}
  if(t.id==="bk-imp"&&t.files?.[0]){const r=new FileReader(); r.onload=()=>{try{const b=JSON.parse(r.result); if(b.app!=="winter-arc"||!b.stato) throw 0; bkInAttesa=b; render()}catch(_){toast("Questo file non è un backup di Winter arc")}}; r.readAsText(t.files[0])}
  if(t.id==="dopoStage"){S[t.id]=t.value; salva(); render()}
  if(t.id==="consegna"||t.id==="prenotazione"||t.id==="fineStage"){const v=dataValida(t.value);
    if(t.value&&!v){toast("Data non valida: scrivi l'anno per intero, es. 2027"); return}
    S[t.id]=v; salva(); render(); if(v!==t.value) toast("Anno corretto in "+v.slice(0,4))}
});
document.addEventListener("toggle",e=>{if(e.target.dataset?.lez&&e.target.open) slAperta=e.target.dataset.lez},true);
document.addEventListener("toggle",e=>{if(e.target.dataset?.mat&&e.target.open) materiaAperta=e.target.dataset.mat},true);

async function scaricaIcs(){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ev=[];
  MATERIE.forEach(m=>{const d=m.esame.replace(/-/g,""), d2=addDays(m.esame,1).replace(/-/g,"");
    ev.push(["BEGIN:VEVENT",`UID:esame-${m.id}@sessione-inverno`,`DTSTAMP:${stamp}`,`DTSTART:${d}T${m.ora.replace(":","")}00`,`DTEND:${d}T${String(+m.ora.slice(0,2)+(m.lingua&&m.id==="fr"?3:2)).padStart(2,"0")}${m.ora.slice(3)}00`,`SUMMARY:ESAME ${m.nome}`,"LOCATION:Università Bocconi, Milano",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Esame tra una settimana: chiedi il permesso in azienda","TRIGGER:-P7D","END:VALARM","END:VEVENT"].join("\r\n"));
    ev.push(["BEGIN:VEVENT",`UID:iscrizione-${m.id}@sessione-inverno`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${m.iscr[1].replace(/-/g,"")}`,`DTEND;VALUE=DATE:${addDays(m.iscr[1],1).replace(/-/g,"")}`,`SUMMARY:Ultimo giorno iscrizione esame ${m.breve} (yoU@B)`,"END:VEVENT"].join("\r\n"));
    const r=RIPASSO[m.id]; ev.push(["BEGIN:VEVENT",`UID:ripasso-${m.id}@sessione-inverno`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${r[0].replace(/-/g,"")}`,`DTEND;VALUE=DATE:${addDays(r[1],1).replace(/-/g,"")}`,`SUMMARY:Ripasso ${m.breve}`,"TRANSP:TRANSPARENT","END:VEVENT"].join("\r\n"));
  });
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sessione d'inverno//IT","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n");
  try{const dl=await claude?.use?.("downloads"); if(!dl){toast("Download non disponibile qui");return}
    await dl.save({filename:"esami-inverno.ics",data:new Blob([ics],{type:"text/calendar"})}); toast("Calendario pronto");
  }catch(e){toast("Download annullato")}
}

render();
avviaDb().then(caricaLezioni); avviaSample();
setInterval(()=>{const n=iso(new Date()); if(n!==OGGI){if(giornoVisto===OGGI) giornoVisto=n; OGGI=n; render()}},60000);
</script>

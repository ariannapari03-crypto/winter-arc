document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-bottom:1px solid #1b2522;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n      <span style=\"font-weight:700;font-size:16px;color:#3dff8b;letter-spacing:.04em\">PES//C1 TERMINAL<\u002Fspan>\n      <span style=\"font-size:12px;color:#7f9b8b\">20637 · Non-Attending · 120'<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:22px;flex-wrap:wrap;font-size:13px;align-items:center\">\n      <span style=\"color:#7f9b8b\">T-<span style=\"color:#ffb020;font-weight:700\">{{ cd.d }}D {{ cd.hms }}<\u002Fspan><\u002Fspan>\n      <span style=\"color:#7f9b8b\">RANK <span style=\"color:#d6f5e3;font-weight:700\">{{ rankName }}<\u002Fspan><\u002Fspan>\n      <span style=\"color:#7f9b8b\">EQ <span style=\"color:#3dff8b;font-weight:700\">{{ eqLabel }}<\u002Fspan><\u002Fspan>\n      <span style=\"color:#7f9b8b\">STREAK <span style=\"color:#d6f5e3;font-weight:700\">{{ streak }}d<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <nav style=\"display:flex;flex-wrap:wrap;border-bottom:1px solid #1b2522;background:#0a0e0d\">\n    <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"8\">\n      <button sc-camel-on-click=\"{{ n.onClick }}\" style=\"background:{{ n.bg }};color:{{ n.fg }};border:none;border-right:1px solid #1b2522;padding:11px 16px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center\" style-hover=\"background:#13201b\">\n        <span style=\"background:{{ n.keyBg }};color:{{ n.keyFg }};padding:1px 6px;font-size:11px;font-weight:700\">{{ n.key }}<\u002Fspan>{{ n.label }}\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n  <sc-if value=\"{{ inMock }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#2a1d00;border-bottom:1px solid #ffb020;color:#ffb020;padding:10px 20px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between\">\n      <span style=\"font-weight:700\">FINAL BOSS · NON-ATTENDING MOCK · {{ mockStep }}<\u002Fspan>\n      <span>TIME LEFT <span style=\"font-weight:700\">{{ mockLeft }}<\u002Fspan> · SCORE SO FAR {{ mockScore }}/12<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <main style=\"flex:1;width:100%;max-width:1240px;margin:0 auto;padding:24px 20px 60px\">\n    <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"color:#7f9b8b\">LOADING DATA FEED<span style=\"animation:pesBlink 1s infinite\">_<\u002Fspan><\u002Fp><\u002Fsc-if>\n\n    <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px\">\n        <section style=\"background:#0c1110;border:1px solid #1b2522;padding:20px\">\n          <div style=\"font-size:11px;letter-spacing:.14em;color:#7f9b8b\">COUNTDOWN · EXAM 28 JAN 2027 · 11:30<\u002Fdiv>\n          <div style=\"font-family:VT323,monospace;font-size:96px;line-height:.9;color:#ffb020;margin-top:12px\">{{ cd.d }}<span style=\"font-size:40px;color:#7f9b8b\"> DAYS<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:VT323,monospace;font-size:36px;color:#d6f5e3\">{{ cd.hms }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#7f9b8b;margin-top:14px;line-height:1.6\">Part 1 Listening → Summary (4) · Part 2 Reading (4) · Part 3 Report/Email (4) · Pass ≥ 9/12<\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"background:#0c1110;border:1px solid #1b2522;padding:20px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\">\n            <div style=\"font-size:11px;letter-spacing:.14em;color:#7f9b8b\">PROJECTED SCORE (FROM SKILL MAP)<\u002Fdiv>\n            <span style=\"font-size:12px;font-weight:700;color:{{ proj.color }}\">{{ proj.label }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:VT323,monospace;font-size:80px;line-height:1;color:{{ proj.color }};margin-top:8px\">{{ proj.total }}<span style=\"font-size:36px;color:#7f9b8b\">/12<\u002Fspan><\u002Fdiv>\n          <div style=\"position:relative;height:10px;background:#16201c;margin:10px 0 18px\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:{{ proj.pct }};background:{{ proj.color }}\"><\u002Fdiv>\n            <div style=\"position:absolute;left:75%;top:-4px;bottom:-4px;width:2px;background:#d6f5e3\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ proj.parts }}\" as=\"pp\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;font-size:13px;align-items:center\">\n                <span style=\"color:#a9c7b6\">{{ pp.name }}<\u002Fspan><span style=\"text-align:right;font-weight:700;color:{{ pp.color }}\">{{ pp.val }}/4<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"background:#0c1110;border:1px solid #1b2522;padding:20px\">\n          <div style=\"font-size:11px;letter-spacing:.14em;color:#7f9b8b;margin-bottom:12px\">ORDER BOOK · NEXT ACTIONS<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ actions }}\" as=\"ac\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ ac.onClick }}\" style=\"text-align:left;background:#0f1715;border:1px solid #1b2522;color:#d6f5e3;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:13px\" style-hover=\"border-color:#3dff8b\">\n                <span><span style=\"color:{{ ac.color }};font-weight:700\">{{ ac.tag }}<\u002Fspan> {{ ac.label }}<\u002Fspan><span style=\"color:#7f9b8b;white-space:nowrap\">{{ ac.sub }} →<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <section style=\"background:#0c1110;border:1px solid #1b2522;margin-top:16px\">\n        <div style=\"padding:14px 20px;border-bottom:1px solid #1b2522;font-size:11px;letter-spacing:.14em;color:#7f9b8b\">MODULE BOARD · BOSS FIGHTS (BEAT EACH WITH ≥ 9/12)<\u002Fdiv>\n        <sc-for list=\"{{ modules }}\" as=\"md\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ md.onClick }}\" style=\"width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid #1b2522;color:#d6f5e3;padding:14px 20px;cursor:pointer;display:grid;grid-template-columns:48px minmax(0,1fr) minmax(90px,180px) 110px;gap:14px;align-items:center;font-size:13px\" style-hover=\"background:#0f1715\">\n            <span style=\"color:#3dff8b;font-weight:700\">{{ md.n }}<\u002Fspan>\n            <span><span style=\"display:block\">{{ md.name }}<\u002Fspan><span style=\"display:block;color:#7f9b8b;font-size:12px;margin-top:2px\">BOSS: {{ md.boss }}<\u002Fspan><\u002Fspan>\n            <span style=\"height:6px;background:#16201c;position:relative\"><span style=\"position:absolute;left:0;top:0;bottom:0;width:{{ md.pct }};background:{{ md.color }}\"><\u002Fspan><\u002Fspan>\n            <span style=\"text-align:right;color:{{ md.color }};font-weight:700\">{{ md.status }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isListen }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ listenListOn }}\" hint-placeholder-val=\"{{ true }}\">\n        <h1 style=\"font-size:20px;margin:0 0 6px;color:#3dff8b\">LISTENING DESK<\u002Fh1>\n        <p style=\"margin:0 0 18px;color:#7f9b8b;font-size:13px;max-width:760px;line-height:1.6\">All'esame l'audio si ascolta 2 volte, prendendo appunti. Modalità esame: massimo 2 ascolti e trascrizione nascosta fino alla correzione.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px\">\n          <sc-for list=\"{{ listenList }}\" as=\"li\" hint-placeholder-count=\"9\">\n            <button sc-camel-on-click=\"{{ li.onClick }}\" style=\"text-align:left;background:#0c1110;border:1px solid #1b2522;color:#d6f5e3;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:130px\" style-hover=\"border-color:#3dff8b\">\n              <span style=\"font-size:11px;letter-spacing:.1em;color:{{ li.kindColor }}\">{{ li.kind }}<\u002Fspan>\n              <span style=\"font-weight:700;font-size:14px;line-height:1.4\">{{ li.title }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#7f9b8b;line-height:1.4\">{{ li.source }}<\u002Fspan>\n              <span style=\"margin-top:auto;font-size:12px;color:#ffb020\">{{ li.best }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ listenOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ listenBack }}\" style=\"background:none;border:none;color:#7f9b8b;padding:0;cursor:pointer;font-size:13px;margin-bottom:14px\">← LISTENING DESK<\u002Fbutton>\n        <h1 style=\"font-size:20px;margin:0 0 4px;color:#3dff8b\">{{ L.title }}<\u002Fh1>\n        <div style=\"font-size:12px;color:#7f9b8b;margin-bottom:16px\">{{ L.source }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start\">\n          <section style=\"background:#0c1110;border:1px solid #1b2522;padding:18px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px\">\n              <span style=\"color:#7f9b8b\">PLAYS <span style=\"color:#ffb020;font-weight:700\">{{ L.plays }}<\u002Fspan><\u002Fspan>\n              <button sc-camel-on-click=\"{{ L.toggleExam }}\" style=\"background:transparent;border:1px Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ run.answered }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;border-left:2px solid {{ run.fbColor }};padding:4px 0 4px 12px;font-size:13px;line-height:1.55;color:#a9c7b6\"><span style=\"color:{{ run.fbColor }};font-weight:700\">{{ run.fbTag }}<\u002Fspan> {{ run.why }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ run.next }}\" style=\"margin-top:14px;background:#3dff8b;color:#03140a;border:none;padding:11px 18px;font-weight:700;cursor:pointer;font-size:13px\">NEXT ↵<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ run.quit }}\" style=\"align-self:flex-start;background:none;border:none;color:#7f9b8b;cursor:pointer;font-size:12px;padding:0\">ABORT<\u002Fbutton>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCards }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 style=\"font-size:20px;margin:0 0 6px;color:#3dff8b\">FLASH DESK · SPACED REPETITION<\u002Fh1>\n      <p style=\"margin:0 0 18px;color:#7f9b8b;font-size:13px;line-height:1.6\">5 livelli. Se sbagli, la carta torna al livello 1 e riappare oggi. Se la sai, sale di livello e torna dopo 1, 2, 4, 8 o 16 giorni. Tastiera: Spazio per girare la carta, 1 / 2 / 3 per valutarla.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px;max-width:820px\">\n        <sc-for list=\"{{ boxes }}\" as=\"bx\" hint-placeholder-count=\"5\">\n          <div style=\"background:#0c1110;border:1px solid #1b2522;padding:10px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:11px;color:#7f9b8b\">LV{{ bx.n }}<\u002Fspan>\n            <span style=\"font-family:VT323,monospace;font-size:30px;color:{{ bx.color }}\">{{ bx.count }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px\">\n        <sc-for list=\"{{ cardTopics }}\" as=\"ct\" hint-placeholder-count=\"8\"><button sc-camel-on-click=\"{{ ct.onClick }}\" style=\"background:{{ ct.bg }};color:{{ ct.fg }};border:1px solid #1b2522;padding:6px 10px;cursor:pointer;font-size:12px\">{{ ct.label }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasCard }}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"max-width:820px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:12px;color:#7f9b8b\">{{ card.dueLabel }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ card.flip }}\" style=\"text-align:left;background:#0c1110;border:1px solid {{ card.bd }};color:#d6f5e3;padding:28px 24px;cursor:pointer;min-height:220px;display:flex;flex-direction:column;gap:16px\">\n            <span style=\"font-size:11px;letter-spacing:.14em;color:#ffb020\">{{ card.topic }} · LV{{ card.box }}<\u002Fspan>\n            <span style=\"font-size:22px;line-height:1.4;font-weight:700\">{{ card.front }}<\u002Fspan>\n            <sc-if value=\"{{ card.shown }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:16px;line-height:1.6;color:#3dff8b;border-top:1px solid #1b2522;padding-top:14px\">{{ card.back }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ card.hidden }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:12px;color:#7f9b8b\">TAP / SPACE TO REVEAL<\u002Fspan><\u002Fsc-if>\n          <\u002Fbutton>\n          <sc-if value=\"{{ card.shown }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n              <button sc-camel-on-click=\"{{ card.again }}\" style=\"background:transparent;color:#ff5a5a;border:1px solid #ff5a5a;padding:12px;cursor:pointer;font-size:13px;font-weight:700\">1 · AGAIN<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ card.hard }}\" style=\"background:transparent;color:#ffb020;border:1px solid #ffb020;padding:12px;cursor:pointer;font-size:13px;font-weight:700\">2 · HARD<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ card.good }}\" style=\"background:#3dff8b;color:#03140a;border:none;padding:12px;cursor:pointer;font-size:13px;font-weight:700\">3 · GOT IT<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noCard }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:820px;background:#0c1110;border:1px solid #3dff8b;padding:24px;font-size:14px;line-height:1.6\">Nessuna carta da ripassare oggi in questo argomento. <button sc-camel-on-click=\"{{ cramAll }}\" style=\"margin-left:8px;background:transparent;color:#3dff8b;border:1px solid #1fa35a;padding:6px 12px;cursor:pointer;font-size:12px\">RIPASSA TUTTO COMUNQUE<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isBoss }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 style=\"font-size:20px;margin:0 0 6px;color:#ff5a5a\">BOSS FIGHTS<\u002Fh1>\n      <p style=\"margin:0 0 18px;color:#7f9b8b;font-size:13px;line-height:1.6;max-width:780px\">Ogni modulo ha un boss: 12 domande in 8 minuti e lo batti con almeno 9/12, come all'esame. Il boss finale è un mock non-attending completo da 120 minuti (summary, reading e report).<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px\">\n        <sc-for list=\"{{ bossList }}\" as=\"bs\" hint-placeholder-count=\"5\">\n          <div style=\"background:#0c1110;border:1px solid {{ bs.bd }};padding:18px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"font-size:11px;letter-spacing:.12em;color:#7f9b8b\">{{ bs.n }} · {{ bs.module }}<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:{{ bs.color }}\">{{ bs.status }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:18px;font-weight:700;color:#ff5a5a\">{{ bs.boss }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#a9c7b6;line-height:1.5\">{{ bs.desc }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#ffb020\">{{ bs.best }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ bs.onClick }}\" style=\"align-self:flex-start;background:#ff5a5a;color:#1a0505;border:none;padding:11px 16px;font-weight:700;cursor:pointer;font-size:13px\">FIGHT<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCareer }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px\">\n        <section style=\"background:#0c1110;border:1px solid #1b2522;padding:18px\">\n          <div style=\"font-size:11px;letter-spacing:.14em;color:#7f9b8b;margin-bottom:12px\">CAREER LADDER · EQUITY {{ eqLabel }}<\u002Fdiv>\n          <sc-for list=\"{{ ladder }}\" as=\"ld\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr) 80px;gap:10px;padding:8px 0;border-bottom:1px solid #121a17;font-size:13px;align-items:center\">\n              <span style=\"color:{{ ld.color }}\">{{ ld.mark }}<\u002Fspan><span style=\"color:{{ ld.color }};font-weight:{{ ld.weight }}\">{{ ld.name }}<\u002Fspan><span style=\"text-align:right;color:#7f9b8b\">{{ ld.eq }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"margin-top:14px;font-size:12px;color:#a9c7b6\">{{ nextRankLabel }}<\u002Fdiv>\n          <div style=\"height:6px;background:#16201c;margin-top:8px;position:relative\"><div style=\"position:absolute;left:0;top:0;bottom:0;width:{{ rankPct }};background:#3dff8b\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"background:#0c1110;border:1px solid #1b2522;padding:18px\">\n          <div style=\"font-size:11px;letter-spacing:.14em;color:#7f9b8b;margin-bottom:12px\">PERFORMANCE REVIEWS · LATEST<\u002Fdiv>\n          <sc-for list=\"{{ reviewLog }}\" as=\"rl\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid #121a17;font-size:12.5px\">\n              <span><span style=\"display:block\">{{ rl.title }}<\u002Fspan><span style=\"display:block;color:#7f9b8b\">{{ rl.date }}<\u002Fspan><\u002Fspan>\n              <span style=\"text-align:right;color:{{ rl.color }};font-weight:700\">{{ rl.rating }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ reviewEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:12px;color:#7f9b8b\">Ancora nessuna review: completa un esercizio.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <section style=\"margin-top:16px\">\n        <div style=\"font-size:11px;letter-spacing:.14em;color:#7f9b8b;margin-bottom:10px\">SKILL MAP · ACCESA DA 75 IN SU (SOGLIA 9/12)<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px\">\n          <sc-for list=\"{{ skillTiles }}\" as=\"st\" hint-placeholder-count=\"10\">\n            <button sc-camel-on-click=\"{{ st.onClick }}\" style=\"text-align:left;background:{{ st.bg }};border:1px solid {{ st.bd }};color:#d6f5e3;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-weight:700;color:{{ st.fg }}\">{{ st.code }}<\u002Fspan><span style=\"font-family:VT323,monospace;font-size:34px;color:{{ st.fg }}\">{{ st.v }}<\u002Fspan><\u002Fdiv>\n              <span style=\"font-size:12px;color:#a9c7b6\">{{ st.name }}<\u002Fspan>\n              <div style=\"display:flex;align-items:flex-end;gap:3px;height:26px\">\n                <sc-for list=\"{{ st.bars }}\" as=\"br\" hint-placeholder-count=\"8\"><span style=\"flex:1;height:{{ br.h }};background:{{ st.fg }};opacity:.75\"><\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"font-size:11px;color:{{ st.dColor }}\">{{ st.delta }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <footer style=\"border-top:1px solid #1b2522;padding:12px 20px;font-size:11px;color:#4f6b5c;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between\">\n    <span>Contenuti dallo Student Pack 2025–26 (Bocconi Language Centre), dai mock ufficiali e dal Work Trend Index 2024. I testi segnati «New» sono scritti per questa piattaforma.<\u002Fspan>\n    <span>Progressi salvati su questo dispositivo<\u002Fspan>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ hasReview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(3,6,5,.86);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50\">\n      <div style=\"width:100%;max-width:520px;background:#0c1110;border:1px solid {{ rv.color }};padding:24px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto\">\n        <div style=\"font-size:11px;letter-spacing:.16em;color:#7f9b8b\">PERFORMANCE REVIEW · {{ rv.title }}<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;color:{{ rv.color }};line-height:1.2\">{{ rv.rating }}<\u002Fdiv>\n        <div style=\"font-family:VT323,monospace;font-size:64px;line-height:1;color:#d6f5e3\">{{ rv.score }}<\u002Fdiv>\n        <sc-for list=\"{{ rv.lines }}\" as=\"rl2\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #121a17;padding:6px 0\"><span style=\"color:#a9c7b6\">{{ rl2.k }}<\u002Fspan><span style=\"color:{{ rl2.c }};font-weight:700\">{{ rl2.v }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ rv.promo }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#3dff8b;color:#03140a;padding:12px;font-weight:700;font-size:14px\">PROMOTED → {{ rv.promoName }}<\u002Fdiv><\u002Fsc-if>\n        <div style=\"font-size:13px;color:#a9c7b6;line-height:1.55;border-left:2px solid #1fa35a;padding-left:12px\">{{ rv.comment }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeReview }}\" style=\"background:#3dff8b;color:#03140a;border:none;padding:12px 18px;font-weight:700;cursor:pointer;font-size:14px\">{{ rv.closeLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#3dff8b;color:#03140a;padding:10px 16px;font-size:13px;font-weight:700;z-index:60;max-width:90vw\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  KEY = 'pes-c1-v1';\n  EXAM = new Date('2027-01-28T11:30:00+01:00');\n  RANKS = [['Intern',0],['Analyst',400],['Associate',1000],['Senior Associate',1800],['Manager',2800],['Director',4200],['Vice President',6000],['CEO',8500]];\n  NAV = [['dash','DASH'],['listen','LISTEN'],['read','READ'],['write','WRITE'],['drill','DRILL'],['cards','CARDS'],['boss','BOSS'],['career','CAREER']];\n  state = { ready:false, view:'dash', p:this.load(), listen:null, read:null, write:null, run:null, review:null, toast:null, toastAt:0,\n    dMod:'all', dSkill:'all', cardTopic:'all', cardShown:false, cram:false, mock:null, rate:1, speaking:'—', tick:0 };\n\n  load() { let p={}; try { p = JSON.parse(localStorage.getItem('pes-c1-v1')) || {}; } catch(e) {}\n    return Object.assign({eq:0, skills:{}, bosses:{}, blitz:[], cards:{}, best:{}, reviews:[], streak:0, lastDay:null, keys:{}, gapKeys:{}, notes:{}, drafts:{}}, p); }\n  save(p) { try { localStorage.setItem(this.KEY, JSON.stringify(p)); } catch(e) {} }\n  setP(mut) { this.setState(s => { const p = JSON.parse(JSON.stringify(s.p)); mut(p); this.save(p); return {p}; }); }\n\n  componentDidMount() {\n    const go = () => { if (window.EN_DRILLS && window.EN_READINGS && window.EN_WRITING && window.EN_LISTENING) this.setState({ready:true}); else setTimeout(go, 40); };\n    go();\n    this.iv = setInterval(() => { this.setState(s => ({tick:s.tick+1})); this.timers(); }, 1000);\n    this.kd = e => this.onKey(e); window.addEventListener('keydown', this.kd);\n    if (window.speechSynthesis) { window.speechSynthesis.onvoiceschanged = () => this.forceUpdate(); }\n  }\n  componentWillUnmount() { clearInterval(this.iv); window.removeEventListener('keydown', this.kd); this.ttsStop(); }\n\n  // ---------- helpers\n  today() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\n  dayNum(s) { return Math.floor(new Date(s+'T12:00:00').getTime()/864e5); }\n  words(t) { return (t||'').trim().split(/\\s+/).filter(Boolean).length; }\n  shuffle(a) { const b=a.slice(); for (let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }\n  norm(t) { return (t||'').toLowerCase().replace(/[’‘]/g,\"'\").replace(/[^a-z0-9%'\\s,.-]/g,' ').replace(/\\s+/g,' ').trim(); }\n  tokens(t) { return (t||'').toLowerCase().replace(/[’‘]/g,\"'\").replace(/[^a-z0-9%'\\s]/g,' ').split(/\\s+/).filter(Boolean); }\n  copied(text, source, n) { n=n||7; if (!source) return []; const st=this.tokens(source), set=new Set(); for (let i=0;i+n<=st.length;i++) set.add(st.slice(i,i+n).join(' '));\n    const tt=this.tokens(text), out=[]; let i=0; while (i+n<=tt.length) { if (set.has(tt.slice(i,i+n).join(' '))) { let j=i+n; while (j<tt.length && set.has(tt.slice(j-n+1,j+1).join(' '))) j++; out.push(tt.slice(i,j).join(' ')); i=j; } else i++; } return out; }\n  rankOf(eq) { let r=0; this.RANKS.forEach((x,i)=>{ if (eq>=x[1]) r=i; }); return r; }\n  fmt(n) { return n.toLocaleString('en-US'); }\n  mmss(s) { s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0'); }\n  toast(t) { this.setState({toast:t, toastAt:Date.now()}); }\n  skillName(id) { const s=(window.EN_SKILLS||[]).find(x=>x.id===id); return s?s.code+' · '+s.name:id; }\n\n  // ---------- review & progress\n  award(o) { // o: {title, pct (0-100), score label, eq, skills:{id:pct}, extra lines, comment, onClose}\n    const before = this.state.p.eq; const oldRank = this.rankOf(before);\n    const deltas = []; const upd = {};\n    Object.keys(o.skills||{}).forEach(id => { const cur = this.state.p.skills[id] || {v:0, hist:[]}; const nv = cur.hist.length ? Math.round(cur.v*0.65 + o.skills[id]*0.35) : Math.round(o.skills[id]*0.6);\n      deltas.push({id, d:nv-cur.v}); upd[id] = {v:nv, hist:cur.hist.concat([nv]).slice(-12)}; });\n    this.setP(p => {\n      p.eq += o.eq;\n      const d = this.today();\n      if (p.lastDay !== d) { const y = p.lastDay ? this.dayNum(d)-this.dayNum(p.lastDay) : 99; p.streak = y===1 ? p.streak+1 : 1; p.lastDay = d; }\n      Object.keys(upd).forEach(id => { p.skills[id] = upd[id]; });\n      const rating = this.ratingOf(o.pct);\n      p.reviews = [{title:o.title, date:new Date().toLocaleDateString('it-IT'), rating:rating[0], pct:o.pct}].concat(p.reviews).slice(0,30);\n      if (o.mut) o.mut(p);\n    });\n    const newRank = this.rankOf(before + o.eq);\n    const r = this.ratingOf(o.pct);\n    const lines = [{k:'Equity earned', v:'+'+o.eq+' EQ', c:'#3dff8b'}].concat(deltas.map(x => ({k:this.skillName(x.id), v:(x.d>=0?'▲ +':'▼ ')+x.d, c:x.d>=0?'#3dff8b':'#ff5a5a'}))).concat(o.lines||[]);\n    this.setState({review:{title:o.title, rating:r[0], color:r[1], score:o.score, lines, promo:newRank>oldRank, promoName:this.RANKS[newRank][0], comment:o.comment||r[2], onClose:o.onClose, closeLabel:o.closeLabel||'CLOSE REVIEW'}});\n  }\n  ratingOf(pct) {\n    if (pct>=90) return ['EXCEEDS EXPECTATIONS','#3dff8b','Ottimo lavoro: sei sopra la soglia d\\'esame con margine. Ripassa solo gli errori.'];\n    if (pct>=75) return ['MEETS EXPECTATIONS','#9be870','Sei sopra la soglia di 9/12. Lavora sugli errori per avere un margine di sicurezza.'];\n    if (pct>=50) return ['PARTIALLY MEETS','#ffb020','Sei sotto la soglia di 9/12. Rileggi le spiegazioni e rifai l\\'esercizio domani.'];\n    return ['BELOW EXPECTATIONS','#ff5a5a','Riparti dalle carte di questo argomento, poi rifai un drill breve.'];\n  }\n\n  // ---------- timers\n  timers() {\n    const r = this.state.run;\n    if (r && r.deadline && !r.over && Date.now() >= r.deadline) this.endRun(true);\n    const m = this.state.mock;\n    if (m && !m.over && Date.now() >= m.deadline) { this.setState({mock:{...m, over:true}}); this.toast('Tempo scaduto: consegna quello che hai.'); }\n  }\n\n  // ---------- keyboard\n  onKey(e) {\n    const tg = e.target && e.target.tagName; if (tg==='TEXTAREA' || tg==='INPUT') return;\n    if (this.state.review) { if (e.key==='Enter' || e.key==='Escape') { e.preventDefault(); this.closeReview(); } return; }\n    const r = this.state.run;\n    if (r) {\n      const k = e.key.toLowerCase(); const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);\n      if (idx >= 0 && !r.answered) { e.preventDefault(); this.pick(idx); return; }\n      if (e.key==='Enter' && r.answered) { e.preventDefault(); this.nextQ(); }\n      return;\n    }\n    if (this.state.view==='cards') {\n      if (e.key===' ') { e.preventDefault(); this.setState(s=>({cardShown:!s.cardShown})); return; }\n      if (this.state.cardShown && '123'.indexOf(e.key)>=0) { e.preventDefault(); this.gradeCard(+e.key); return; }\n    }\n    const n = '12345678'.indexOf(e.key); if (n>=0 && !e.metaKey && !e.ctrlKey && !this.state.mock) this.go(this.NAV[n][0]);\n  }\n  go(v) { this.ttsStop(); this.setState({view:v
